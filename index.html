<style>
/* Layout: one-screen field tool. Header, toolbar, croqui stage filling the screen, status bar (pincel) at the bottom, sheets sliding up. */
:root{
  --bg:#eef0ee; --surface:#ffffff; --surface2:#e3e6e3; --line:#cdd2ce;
  --ink:#1c2224; --muted:#5d6764; --accent:#c8102e; --accent-ink:#ffffff;
  --stage:#d9ddd9; --ok:#1f7a45; --warn:#9a6a00;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14181a; --surface:#1e2427; --surface2:#283034; --line:#36403f;
  --ink:#e8ecea; --muted:#9aa5a2; --accent:#ff4d5e; --accent-ink:#1a0005;
  --stage:#0d1011; --ok:#4cc483; --warn:#e2b34a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181a; --surface:#1e2427; --surface2:#283034; --line:#36403f;
  --ink:#e8ecea; --muted:#9aa5a2; --accent:#ff4d5e; --accent-ink:#1a0005;
  --stage:#0d1011; --ok:#4cc483; --warn:#e2b34a; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;gap:10px;padding:10px 16px 8px;background:var(--surface);border-bottom:1px solid var(--line)}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.01em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:36px;padding:0 11px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ibtn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ibtn svg{width:17px;height:17px;flex:none}

.tools{display:flex;gap:8px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:6px;background:var(--surface2);border-radius:8px;padding:0 10px;height:36px;flex:1 1 120px;min-width:0}
.search input{border:0;background:transparent;outline:none;width:100%;min-width:0;font-family:var(--f-mono);font-size:14px}
.seg{display:flex;background:var(--surface2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;height:30px;padding:0 10px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}

.stage{position:relative;flex:1;min-height:0;background:var(--stage);overflow:hidden;touch-action:none}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:600;display:grid;place-items:center}
.banner{position:absolute;left:12px;right:60px;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;font-size:13px;line-height:1.35;display:flex;gap:10px;align-items:flex-start}
.banner b{font-weight:600}
.banner button{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 2px}
.hint{position:absolute;left:12px;right:12px;bottom:12px;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:9px 12px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.hint button{border:0;border-radius:6px;padding:6px 10px;font-weight:600;background:var(--bg);color:var(--ink);white-space:nowrap}
.hint .sw{width:14px;height:14px;border-radius:3px;display:inline-block;vertical-align:-2px;margin-right:6px}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:20px;font-size:13.5px;font-weight:500;pointer-events:none;white-space:nowrap}

.legend{display:flex;gap:6px;overflow-x:auto;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);scrollbar-width:none}
.legend::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;height:36px;padding:0 12px 0 9px;font-size:13.5px;font-weight:600;white-space:nowrap}
.chip .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .n{color:var(--bg);opacity:.75}
.sw{width:16px;height:16px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.25);display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;line-height:1}
.sw.ring{border-radius:50%;background:transparent!important;border-width:3px}

.scrim{position:fixed;inset:0;background:rgba(10,14,15,.38)}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:86%;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.18)}
@media (min-width:720px){.sheet{left:auto;right:16px;bottom:16px;width:420px;border-radius:16px;max-height:calc(100% - 32px)}}
.sheet h2{margin:0;font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.sheet h3{margin:14px 0 7px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.x{border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;flex:none}
.stgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stgrid .chip{width:100%;justify-content:flex-start;border-radius:8px;height:38px;padding:0 8px;font-size:13px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:12.5px;color:var(--muted);font-weight:500}
.fld input,.fld textarea,.fld select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-width:0;font-variant-numeric:tabular-nums}
.fld textarea{resize:vertical;min-height:40px}
.full{grid-column:1/-1}
.note{font-size:13px;color:var(--warn);margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.row .ibtn{flex:1 1 auto;justify-content:center}
.danger{color:var(--accent)!important}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.q{font-family:var(--f-mono);text-align:right;width:44px;font-variant-numeric:tabular-nums;font-weight:600}
.tbl .nums{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:block;margin-top:2px;word-break:break-word}
.tbl .lb{display:flex;align-items:center;gap:8px;font-weight:600}
pre.wa{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--f-mono);font-size:12px;max-height:180px;overflow:auto;margin:0}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.pitem .t{flex:1;min-width:0}
.pitem .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .t span{font-size:12.5px;color:var(--muted)}
.pitem.cur{border-color:var(--ink)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.35;margin-top:10px}
.chk input{margin-top:3px;width:18px;height:18px;flex:none}
.busy{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,14,15,.45)}
.busy div{background:var(--surface);padding:16px 22px;border-radius:12px;font-weight:600}
.preview img{width:100%;border-radius:8px;border:1px solid var(--line);margin-top:10px}
.muted{color:var(--muted);font-size:13.5px;line-height:1.45}
.zoom button:disabled{opacity:.4;cursor:default}
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:16px}
.gbox{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px}
.gbox h1{font-family:var(--f-display);font-weight:700;margin:0;font-size:28px}
.gbox img{border-radius:14px}
.gbox label{font-size:13px;color:var(--muted);font-weight:500;margin-top:4px}
.gbox input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;font-size:16px;min-width:0}
.gbox .ibtn{justify-content:center;height:42px;margin-top:4px}
.gerr{color:var(--accent);margin:0;font-size:14px}
.fotos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fotos button{border:0;padding:0;background:none;min-width:0}
.fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block;background:var(--surface2)}
.hlog{margin-top:14px;display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums}
.ph img{width:100%;border-radius:8px;border:1px solid var(--line);margin-top:10px}
@media (max-width:420px){.ibtn .lbl{display:none}.ibtn{padding:0 9px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<div class="app">
  <header>
    <div class="ttl"><h1 id="pname">Medição Enaex</h1><div class="meta" id="pmeta"></div></div>
    <button class="ibtn" id="bPolys" title="Polígonos salvos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18M3 12h18M3 17h18"/></svg><span class="lbl">Polígonos</span></button>
    <button class="ibtn" id="bSum" title="Resumo e exportação"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="lbl">Resumo</span></button>
    <button class="ibtn pri" id="bOpen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></svg><span class="lbl">Abrir PDF ou foto</span></button>

<div class="gate" id="gate"><form class="gbox" id="gForm"><img src="icon-192.png" alt="" width="64" height="64"><h1>Medição Enaex</h1><p class="muted" style="margin:0">Digite a senha da equipe para entrar.</p>

<script>
const SAMPLE=null;
const SAMPLE_BG=null;

const ST=[
 {k:'adicional',l:'Adicional',c:'#18a33a',ring:1,e:'🟢',cr:1},
 {k:'nao_furado',l:'Não furado',c:'#d63ddb',e:'🟣'},
 {k:'repasse',l:'Repasse',c:'#f6d80b',e:'🟡'},
 {k:'fora_malha',l:'Fora da malha',c:'#23c8ea',e:'🔵',cr:1},
 {k:'perdido',l:'Perdido',c:'#e3322b',e:'🔴'},
 {k:'nao_carregado',l:'Não carregado',c:'#f28a1d',e:'🟠'},
 {k:'deck1',l:'Furos de 1 deck',c:'#8a6542',e:'🟤',deck:1},
 {k:'deck2',l:'Furos de 2 decks',c:'#57391f',e:'🟤🟤',deck:2},
 {k:'deck3',l:'Furos de 3 decks',c:'#2b1a0c',e:'🟤🟤🟤',deck:3},
 {k:'alta_metragem',l:'Alta metragem',c:'#111111',ring:1,e:'⚫'},
 {k:'agua',l:'Com água',c:'#1e6fd9',e:'💧',drop:1}
];
const SK=Object.fromEntries(ST.map(s=>[s.k,s]));
function toggle(h,k){if(h.st.includes(k)){if(h.add&&SK[k].cr)return;h.st=h.st.filter(x=>x!==k);return}if(SK[k].deck)h.st=h.st.filter(x=>!(SK[x]&&SK[x].deck));if(SK[k].cr&&h.add)h.st=h.st.filter(x=>!(SK[x]&&SK[x].cr));h.st=[...h.st,k]}
const live=()=>P.holes.filter(h=>!h.ghost);
let addType='adicional',addSrc=-1,moveIdx=-1;
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d'),stage=$('#stage');
let P=null,bgImg=null,view={s:1,ox:0,oy:0},mode='sel',brush=null,sel=-1,draft=[];
const LABEL_DX=5.5,LABEL_DY=4.2;

/* ---------- storage (IndexedDB) ---------- */
let dbh=null,mem={};
function idb(){return new Promise(res=>{try{const r=indexedDB.open('croqui-real',1);r.onupgradeneeded=()=>r.result.createObjectStore('polys',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}})}
function tx(m,fn){return new Promise(res=>{if(!dbh)return res(fn(null));try{const t=dbh.transaction('polys',m),s=t.objectStore('polys');const r=fn(s);t.oncomplete=()=>res(r&&r.result!==undefined?r.result:undefined);t.onerror=()=>res(undefined)}catch(e){res(undefined)}})}
async function dbPut(o){mem[o.id]=o;await tx('readwrite',s=>s&&s.put(o))}
async function dbAll(){if(!dbh)return Object.values(mem);const r=await new Promise(res=>{try{const q=dbh.transaction('polys').objectStore('polys').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>res([])}catch(e){res([])}});return r}
async function dbDel(id){delete mem[id];await tx('readwrite',s=>s&&s.delete(id))}
/* ---------- edits: who/when stamps and undo ---------- */
let saveT=null,base=null,undoSt=[],myId=null,syncState='local';
const myName=()=>lsGet('cr-nome')||'';
const hsig=h=>{const{t,by,bn,log,...r}=h;return JSON.stringify(r)};
const zsig=z=>{const{t,...r}=z;return JSON.stringify(r)};
const msig=p=>JSON.stringify([p.nome,p.proj,p.tol]);
function ensureKeys(p){p.dead=p.dead||{};p.holes.forEach(h=>{if(!h.k)h.k=h.add?uid():'n'+h.n});p.zones.forEach(z=>{if(!z.id)z.id=uid()})}
function stateStr(){return JSON.stringify({holes:P.holes,zones:P.zones,nome:P.nome,proj:P.proj,tol:P.tol})}
function rebuildBase(){ensureKeys(P);base={h:new Map(P.holes.map(h=>[h.k,hsig(h)])),z:new Map(P.zones.map(z=>[z.id,zsig(z)])),m:msig(P),s:stateStr()}}
function stamp(){ensureKeys(P);const now=Date.now();let ch=false;const seen=new Set();
  P.holes.forEach(h=>{seen.add(h.k);if(base.h.get(h.k)===hsig(h))return;ch=true;h.t=now;if(myId){h.by=myId;delete h.bn}else{delete h.by;h.bn=myName()}delete P.dead[h.k];
    const e={t:now,s:h.st.join('+'),pm:h.pm||'',pr:h.pr||''};if(myId)e.by=myId;else e.bn=myName();const L=h.log||[],last=L[L.length-1];
    if(last&&now-last.t<120000&&(last.by||'')===(e.by||'')&&(last.bn||'')===(e.bn||''))L[L.length-1]=e;else L.push(e);h.log=L.slice(-4)});
  base.h.forEach((s,k)=>{if(!seen.has(k)){P.dead[k]=now;ch=true}});
  const zs=new Set();P.zones.forEach(z=>{zs.add(z.id);if(base.z.get(z.id)!==zsig(z)){z.t=now;delete P.dead[z.id];ch=true}});
  base.z.forEach((s,k)=>{if(!zs.has(k)){P.dead[k]=now;ch=true}});
  if(base.m!==msig(P)){P.mt=now;ch=true}return ch}
function commit(noUndo){clearTimeout(saveT);saveT=null;if(!P||!base)return;const prev=base.s;if(!stamp())return;
  if(!noUndo){undoSt.push(prev);if(undoSt.length>60)undoSt.shift()}P.upd=Date.now();rebuildBase();dbPut(P);pushRemote(P);undoBtn()}
function save(){if(!P)return;clearTimeout(saveT);saveT=setTimeout(()=>commit(),400)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&saveT)commit()});addEventListener('pagehide',()=>{if(saveT)commit()});
function undo(){if(!P)return;if(saveT)commit();const s=undoSt.pop();if(!s){toast('Nada para desfazer');return}const o=JSON.parse(s);
  P.holes=o.holes;P.zones=o.zones;P.nome=o.nome;P.proj=o.proj;P.tol=o.tol;sel=-1;closeSheet();commit(true);renderLegend();draw();undoBtn();toast('Última alteração desfeita')}
function undoBtn(){const b=$('#zUndo');if(b)b.disabled=!undoSt.length}

/* ---------- team: online sync (db + assets) ---------- */
let rdb=null,ras=null,ruser=null,rq=Promise.resolve(),pushedLocal=false;const pushing=new Set(),dirty=new Set();
const isA=f=>typeof f==='string'&&f.startsWith('a:');
const fotoSrc=f=>isA(f)?'/_blob/'+f.slice(2):f;

function hit(wx,wy,tight){let b=-1,bd=tight?Math.max(4,13/view.s):Math.max(9,22/view.s);P.holes.forEach((h,i)=>{if(h.ghost)return;const[cx,cy]=hc(h);const d=Math.hypot(cx-wx,cy-wy);if(d<bd){bd=d;b=i}});return b}

    if(h.cam===camSel&&h.dia===camDia){delete h.cam;delete h.dia;toast('Furo '+hn(h)+' sem caminhão')}else{h.cam=camSel;h.dia=camDia;toast('Furo '+hn(h)+' → caminhão '+camSel)}save();renderLegend();draw();return}

  if(brush){if(i<0)return;const h=P.holes[i];const k=brush;toggle(h,k);save();renderLegend();sel=-1;draw();toast('Furo '+hn(h)+(h.st.includes(k)?' → ':' sem ')+SK[k].l);return}

let xlsxP=null;function loadXlsx(){return xlsxP||(xlsxP=new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement('script');s.src='lib/xlsx.full.min.js';s.onload=()=>res(window.XLSX);s.onerror=()=>{xlsxP=null;rej(new Error('xlsx'))};document.head.appendChild(s)}))}

async function exportCanvas(o){const Z=bgImg?bgImg.naturalWidth/P.w:2.5;const W=Math.round(P.w*Z),Hc=Math.round(P.h*Z);const{by,zones}=summaryData();
  const items=ST.filter(s=>by[s.k].length);const cols=W>1600?4:2,rows=Math.ceil(items.length/cols);const band=o.leg?Math.round(130+rows*52+(zones.length?40+zones.length*38:0)):0;
  const c=document.createElement('canvas');c.width=W;c.height=Hc+band;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,c.height);
  if(bgImg)x.drawImage(bgImg,0,0,W,Hc);x.save();x.scale(Z,Z);drawOverlay(x,{depth:o.depth,nobg:!bgImg});x.restore();
  if(o.leg){let y=Hc+20;x.fillStyle='#1c2224';x.fillRect(40,y,W-80,3);y+=52;x.font='700 40px "Barlow Condensed",Arial,sans-serif';x.fillText('Croqui real · '+P.nome,40,y);
    x.font='500 24px Barlow,Arial,sans-serif';x.fillStyle='#5d6764';x.textAlign='right';x.fillText(`${live().length} furos · gerado em ${new Date().toLocaleDateString('pt-BR')}`,W-40,y);x.textAlign='left';y+=26;
    const cw=(W-80)/cols;items.forEach((s,i)=>{const cx=40+(i%cols)*cw,cy=y+Math.floor(i/cols)*52+20;if(s.ring){x.strokeStyle=s.c;x.lineWidth=5;x.beginPath();x.arc(cx+16,cy+16,13,0,7);x.stroke()}else{x.fillStyle=s.c;rr(x,cx,cy,32,32,6);x.fill();if(s.deck>1){x.fillStyle='#fff';x.font='700 20px Barlow,Arial,sans-serif';x.textAlign='center';x.fillText(s.deck,cx+16,cy+23);x.textAlign='left'}}
      x.fillStyle='#1c2224';x.font='600 26px Barlow,Arial,sans-serif';x.fillText(`${s.l} (${by[s.k].length})`,cx+46,cy+26)});y+=rows*52+20;
    if(zones.length){y+=24;x.font='600 22px Barlow,Arial,sans-serif';x.fillStyle='#5d6764';x.fillText('CARREGAMENTOS',40,y);x.fillStyle='#1c2224';x.font='500 25px Barlow,Arial,sans-serif';zones.forEach(z=>{y+=38;x.fillText(`${z.lb.replace(/\n/g,' · ')} — ${z.n} furos`,40,y)})}}
  return c}
const dlP=(window.claude&&claude.use)?claude.use('downloads').catch(()=>null):Promise.resolve(null);

async function shareOrDownload(name,data){try{const ext=name.split('.').pop();const type={png:'image/png',pdf:'application/pdf',csv:'text/csv',json:'application/json'}[ext]||'application/octet-stream';
  const blob=data instanceof Blob?data:new Blob([data],{type});const file=new File([blob],name,{type:blob.type||type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return true}catch(e){if(e&&e.name==='AbortError')return true}}
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('Arquivo salvo em Downloads');return true}catch(e){return false}}
async function offer(name,data,canvas){const dl=await dlP;
  if(dl){try{await dl.save({filename:name,data});toast('Arquivo pronto');return}catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited'){toast('Aguarde um instante e tente de novo');return}}}
  if(await shareOrDownload(name,data))return;
  const pv=$('#prev');if(canvas&&pv){pv.innerHTML='<p class="muted">Salvar arquivos não está disponível nesta tela. Toque e segure a imagem para salvar ou compartilhar.</p><img alt="Croqui real gerado" src="'+canvas.toDataURL('image/png')+'">';pv.scrollIntoView({behavior:'smooth'})}
  else toast('Salvar arquivos não está disponível nesta tela')}
