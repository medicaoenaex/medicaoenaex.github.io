<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carregamento de Campo</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#14202b;--mut:#5d6b78;--line:#d6dde3;--pri:#0b5cad;--pri2:#e6f0fa;--ok:#1f9d55;--warn:#f08c00;--bad:#d64545;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#102a43;color:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:54px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:15px}
main{padding:12px;max-width:900px;margin:0 auto;padding-bottom:90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
input,select,textarea{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:11px 14px;font-size:15px;min-height:46px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:#f0c4c4}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns .btn{flex:1 1 auto}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{flex:1;border:0;background:transparent;padding:10px 6px;font-size:14px;min-height:42px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--pri);color:#fff}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-size:14px;white-space:nowrap}
.tabs button.on{background:#102a43;color:#fff;border-color:#102a43}
.poly{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.bar{height:8px;background:#e5e9ed;border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;margin-bottom:8px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.mapwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fbfcfd;max-height:70vh;touch-action:pan-x pan-y;position:relative}
.mapz{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
.mapz button{pointer-events:auto;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.94);font-size:22px;line-height:1;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.mapz button:disabled{opacity:.4}
.mapwrap svg{display:block;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mapwrap circle{cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{background:var(--pri2);border-radius:10px;padding:10px}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--mut);font-weight:600}
td.n,th.n{text-align:right}
tr.click{cursor:pointer}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;color:#fff}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,20,30,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.panel{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px 20px}
.panel h3{margin:0 0 6px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.stbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stbtns button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px;font-size:13px;min-height:44px}
.stbtns button.on{color:#fff}
.deck{display:grid;grid-template-columns:auto 1fr 110px;gap:6px;align-items:center;margin-top:6px}
.deck b{font-size:13px;color:var(--mut);width:52px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#102a43;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:40}
#toast.show{opacity:1}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}
.hint{background:#fff8e6;border:1px solid #f3dca4;border-radius:10px;padding:10px;font-size:13px;margin-top:8px}
.chk{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:15px}
.chk input{width:24px;height:24px;flex:0 0 auto}
.conds{display:flex;flex-wrap:wrap;gap:6px}
.conds button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:13px}
.conds button.on{background:#7a4b00;border-color:#7a4b00;color:#fff}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.hist{font-size:13px;color:var(--mut);border-left:3px solid var(--line);padding-left:8px;margin-top:4px}
.hist div{padding:2px 0}
.selbar{position:sticky;bottom:8px;z-index:4;background:#102a43;color:#fff;border-radius:12px;padding:10px;margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.selbar .btn{min-height:38px;padding:6px 10px;font-size:14px}
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block;font-size:11px;color:#000}
  #print h1{font-size:18px;margin:0 0 4px}#print h2{font-size:14px;margin:14px 0 6px;border-bottom:2px solid #102a43}
  #print table{font-size:10px;width:100%}html,body{background:#fff!important}#print th,#print td{padding:3px 4px;border:1px solid #bbb}
  #print .pb{page-break-before:always}#print img{max-width:100%}
  #print .sig{display:flex;gap:30px;margin-top:40px}#print .sig div{flex:1;border-top:1px solid #000;padding-top:4px;text-align:center}
}
@keyframes pfl{0%{opacity:1}50%{opacity:.15}100%{opacity:1}}.pfl{animation:pfl .9s ease-in-out 5;animation-fill-mode:forwards}
</style>
</head>
<body>
<header><button id="back" style="display:none">‹ Voltar</button><h1 id="ttl">Carregamento de Campo</h1><button id="hdrBtn" style="display:none"></button></header>
<main id="app"></main>
<div id="sheet" class="sheet hidden"></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">
<script>
"use strict";
/* ===== Configuração ===== */
const KEY='carregamentoCampo.v1';
const MINAS=['Pico','HZT','TAM','ABO'];
const PRODUTOS=['Ibemux','Ibenite','Blendado','Encartuchado'];
const DETS=['DT5 15m','DT STD 15m','DT STD 10m'];
const CAMS=['UMT 1038','UMT 1039','UMT 1044','UMT 1045','UMB 1148','UMB 1113'];
const ST={pendente:{n:'Pendente',c:'#9aa3ad'},carregado:{n:'Carregado',c:'#1f9d55'},repasse:{n:'Repasse',c:'#f08c00'},perdido:{n:'Perdido',c:'#d64545'},nao:{n:'Não carregar',c:'#5b6b7a'}};
const CONDS=['Obstruído','Desmoronado','Fraturado','Quente','Reativo','Água corrente','Boca danificada','Furo desviado'];
const SITU={aberto:{n:'Em carregamento',c:'#0b5cad'},carregado:{n:'Carregamento concluído',c:'#1f9d55'},detonado:{n:'Detonado',c:'#5b6b7a'}};
const CHK_PRE=['Área isolada e sinalizada','Acessos bloqueados e vigias posicionados','Furos inspecionados (profundidade e água)','Caminhões inspecionados e aterrados','Explosivos e acessórios conferidos com a NF','Rádio e EPIs conferidos','Condições do tempo verificadas (raios)'];
const CHK_FIM=['Todos os furos lançados','Tampão conferido','Sobras de explosivo devolvidas','Acessórios conferidos (saldo zero)','Área limpa e embalagens recolhidas','Ligação conferida conforme o plano','Área entregue ao blaster'];

/* ===== Estado ===== */
let S={polys:[],cur:null,last:null};
let view='home', tab='mapa', zoom=1, listFilter='todos', listQ='', sel=null;
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.polys))S=Object.assign(S,d);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Não deu para salvar no aparelho — faça um backup');}}

/* ===== Utilidades ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(v==null||v==='')return null;if(typeof v==='number')return isNaN(v)?null:v;let t=String(v).replace(/\s/g,'');if(t.includes(',')&&t.includes('.'))t=t.lastIndexOf(',')>t.lastIndexOf('.')?t.replace(/\./g,'').replace(',','.'):t.replace(/,/g,'');else t=t.replace(',','.');const n=parseFloat(t);return isNaN(n)?null:n;};
const fmt=(n,d=0)=>n==null||isNaN(n)?'–':Number(n).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fmtC=n=>String(Math.round(n*1000)/1000).replace('.',',');
const brDate=s=>s?s.split('-').reverse().join('/'):'';
const dayOf=ts=>{if(!ts)return '';const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),ms||2200);}
const cur=()=>S.polys.find(p=>p.id===S.cur);
const opts=(arr,v,blank)=>(blank?`<option value="">${blank}</option>`:'')+arr.map(a=>`<option ${a===v?'selected':''}>${esc(a)}</option>`).join('');
const holeKg=h=>(h.decks||[]).reduce((s,d)=>s+(num(d.kg)||0),0);

function closeSheet(){$('#sheet').classList.add('hidden');$('#sheet').innerHTML='';}
function openSheet(html){const s=$('#sheet');s.innerHTML=`<div class="panel">${html}</div>`;s.classList.remove('hidden');s.onclick=e=>{if(e.target===s)closeSheet();};}
function confirmBox(msg,ok,label='Confirmar'){openSheet(`<h3>Confirmar</h3><p>${esc(msg)}</p><div class="btns"><button class="btn" id="cNo">Cancelar</button><button class="btn pri" id="cOk">${esc(label)}</button></div>`);$('#cNo').onclick=closeSheet;$('#cOk').onclick=()=>{closeSheet();ok();};}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copiado');}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}ta.remove();toast(ok?'Copiado':'Selecione o texto e copie manualmente');}}
function exportBox(title,name,text,mime){
  openSheet(`<h3>${esc(title)}<button class="btn sm" id="xClose">Fechar</button></h3><textarea id="xTxt" readonly style="min-height:220px">${esc(text)}</textarea><div class="btns"><button class="btn pri" id="xCopy">Copiar</button><button class="btn" id="xDown">Baixar arquivo</button></div><p class="mut">Se o botão Baixar não funcionar aqui, use Copiar e cole num bloco de notas ou no WhatsApp.</p>`);
  $('#xClose').onclick=closeSheet;$('#xCopy').onclick=()=>copyText(text);
  $('#xDown').onclick=()=>{try{const b=new Blob([text],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();}catch(e){toast('Download bloqueado — use Copiar');}};
}

/* ===== Bibliotecas (usa lib/ do site; se não tiver, baixa do cdnjs) ===== */
function loadScript(srcs){return new Promise((res,rej)=>{const tryI=i=>{if(i>=srcs.length)return rej(new Error('Sem internet para carregar o leitor de arquivos'));const sc=document.createElement('script');sc.src=srcs[i];sc.onload=()=>res();sc.onerror=()=>{sc.remove();tryI(i+1);};document.head.appendChild(sc);};tryI(0);});}
let pdfP=null,xlsxP=null;
function loadPdf(){return pdfP||(pdfP=(async()=>{if(!window.pdfjsLib)await loadScript(['lib/pdf.min.js','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js']);if(!window.pdfjsWorker)await loadScript(['lib/pdf.worker.min.js','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js']);return window.pdfjsLib;})().catch(e=>{pdfP=null;throw e;}));}
function loadXlsx(){return xlsxP||(xlsxP=(async()=>{if(!window.XLSX)await loadScript(['lib/xlsx.full.min.js','https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js']);return window.XLSX;})().catch(e=>{xlsxP=null;throw e;}));}
function busy(m){let b=$('#busy');if(!m){if(b)b.remove();return;}if(!b){b=document.createElement('div');b.id='busy';b.style.cssText='position:fixed;inset:0;z-index:50;background:rgba(10,20,30,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;padding:20px;text-align:center;white-space:pre-line';document.body.appendChild(b);}b.textContent=m;}

let excelP=null;
function loadExcel(){return excelP||(excelP=(async()=>{if(!window.ExcelJS)await loadScript(['lib/exceljs.min.js','https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js']);return window.ExcelJS;})().catch(e=>{excelP=null;throw e;}));}
let jspdfP=null;
function loadJsPdf(){return jspdfP||(jspdfP=(async()=>{if(!(window.jspdf&&window.jspdf.jsPDF))await loadScript(['lib/jspdf.umd.min.js','https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js']);return window.jspdf.jsPDF;})().catch(e=>{jspdfP=null;throw e;}));}
// planilha pronta: mostra um botão para baixar (o toque da pessoa garante o download no computador; no celular dá para compartilhar)
function entregarPlanilha(blob,nome){
  const tipo='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';const url=URL.createObjectURL(blob);
  const file=new File([blob],nome,{type:tipo});const celular=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const podeComp=celular&&navigator.canShare&&(()=>{try{return navigator.canShare({files:[file]});}catch(e){return false;}})();
  openSheet(`<h3>✅ Planilha pronta<button class="btn sm" id="epX">Fechar</button></h3>
    <p><b>${esc(nome)}</b> · ${fmt(blob.size/1048576,1)} MB</p>
    <div class="btns" style="flex-direction:column"><a class="btn pri" id="epDl" href="${url}" download="${esc(nome)}" style="text-align:center;text-decoration:none">⬇️ Baixar planilha</a>${podeComp?'<button class="btn" id="epSh">Compartilhar (WhatsApp, e-mail…)</button>':''}</div>
    <p class="mut">${celular?'Depois de baixar, abra pelo app do Excel.':'O arquivo vai para a pasta Downloads (ou o Chrome pergunta onde salvar). Abra no Excel.'}</p>`);
  $('#epX').onclick=closeSheet;$('#epDl').onclick=()=>{setTimeout(()=>toast('Planilha baixada: '+nome,3000),300);};
  if(podeComp)$('#epSh').onclick=async()=>{try{await navigator.share({files:[file],title:nome});}catch(e){}};
}
async function entregarArquivo(blob,nome,tipo){
  try{const file=new File([blob],nome,{type:tipo});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:nome});return true;}}catch(e){if(e&&e.name==='AbortError')return true;}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();a.remove();toast('Arquivo gerado: '+nome);return true;}catch(e){toast('Este navegador bloqueou o download. Abra o app pelo link do GitHub.');return false;}
}

/* ===== Croqui de fundo (fica no IndexedDB do aparelho) ===== */
const bgCache={};let dbP=null;
function db(){return dbP||(dbP=new Promise(res=>{try{const r=indexedDB.open('carregamentoCampo',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('bg'))d.createObjectStore('bg');if(!d.objectStoreNames.contains('foto'))d.createObjectStore('foto');};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}catch(e){res(null);}}));}
async function bgGet(id){if(id in bgCache)return bgCache[id];const d=await db();if(!d)return bgCache[id]=null;return new Promise(res=>{try{const q=d.transaction('bg').objectStore('bg').get(id);q.onsuccess=()=>res(bgCache[id]=q.result||null);q.onerror=()=>res(null);}catch(e){res(null);}});}
async function bgPut(id,url,daNuvem){bgCache[id]=url;if(!daNuvem){const y=SY();y.bq=y.bq||{};y.bq[id]=Date.now();}const d=await db();if(!d)return false;return new Promise(res=>{try{const t=d.transaction('bg','readwrite');t.objectStore('bg').put(url,id);t.oncomplete=()=>res(true);t.onerror=()=>res(false);}catch(e){res(false);}});}
async function bgDel(id){bgCache[id]=null;const d=await db();if(!d)return;try{d.transaction('bg','readwrite').objectStore('bg').delete(id);}catch(e){}}
// fotos dos furos (ficam só neste aparelho)
async function fotoGet(k){const d=await db();if(!d)return[];return new Promise(res=>{try{const q=d.transaction('foto').objectStore('foto').get(k);q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([]);}catch(e){res([]);}});}
async function fotoPut(k,arr){const d=await db();if(!d)return false;return new Promise(res=>{try{const t=d.transaction('foto','readwrite');if(arr.length)t.objectStore('foto').put(arr,k);else t.objectStore('foto').delete(k);t.oncomplete=()=>res(true);t.onerror=()=>res(false);}catch(e){res(false);}});}
async function pdfPageToImage(buf,maxW=2400){busy('Abrindo PDF…');const lib=await loadPdf();const doc=await lib.getDocument({data:new Uint8Array(buf),isEvalSupported:false}).promise;const page=await doc.getPage(1);const v1=page.getViewport({scale:1});const Z=Math.min(3,maxW/v1.width);const vp=page.getViewport({scale:Z});const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);await page.render({canvasContext:x,viewport:vp}).promise;busy();return{url:c.toDataURL('image/jpeg',.8),w:c.width,h:c.height};}
function imageFileToImage(file,maxW=2400){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,maxW/im.naturalWidth);const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res({url:c.toDataURL('image/jpeg',.82),w:c.width,h:c.height});};im.onerror=()=>rej(new Error('Imagem inválida'));im.src=r.result;};r.readAsDataURL(file);});}
function pickFile(accept){return new Promise(res=>{const fi=$('#fileIn');fi.accept=accept;fi.value='';fi.onchange=()=>res(fi.files[0]||null);fi.click();});}
const readBuf=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsArrayBuffer(f);});
const readTxt=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result));r.onerror=rej;r.readAsText(f);});

/* ===== Ler arquivo de coordenadas (Excel, CSV, TXT ou PDF) ===== */
// a 1ª aba tem cara de coordenadas (norte/leste)?
function rowsToHolesOk(X,wb){try{rowsToHoles(X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''}).map(r=>r.map(v=>typeof v==='number'?String(v):String(v??'').trim())));return true;}catch(e){return false;}}
function avisoPlanCarreg(nome,pols){const ps=pols.length?pols.map(v=>'POL '+esc(v)).join(' e '):'';
  return `⚠️ <b>${esc(nome)}</b> é a <b>planilha de carregamento</b>${ps?` (${ps})`:''}, não o arquivo de coordenadas. Ela não cria polígono porque não tem a posição dos furos.<br><br>
  Para lançar o que foi carregado: abra ${ps?`o <b>${ps.split(' e ')[0]}</b>`:'o polígono'} no app → <b>⋯</b> → <b>Importar planilha preenchida</b>${pols.length>1?` (depois repita no ${ps.split(' e ').slice(1).join(' e ')})`:''}.<br>
  Para criar o polígono, use aqui o arquivo de coordenadas do topógrafo (furo, norte, leste).`;}
async function fileToRows(file){
  const nm=file.name.toLowerCase();
  if(/\.xlsx?$/.test(nm)){busy('Lendo planilha…');const X=await loadXlsx();const wb=X.read(await readBuf(file),{type:'array'});busy();
    const ab=wb.SheetNames.filter(n=>/^CARREG/i.test(n));
    if(ab.length&&!rowsToHolesOk(X,wb)){const pols=[...new Set(ab.map(n=>{const c=wb.Sheets[n][MOD_HDR.pol];return c&&c.v!=null?String(c.v).trim():'';}).filter(Boolean))];
      const e=new Error('Esta é a planilha de carregamento, não o arquivo de coordenadas');e.carreg=pols;throw e;}
    return X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''}).map(r=>r.map(v=>typeof v==='number'?String(v):String(v??'').trim()));}
  if(/\.pdf$/.test(nm)){busy('Lendo PDF…');const lib=await loadPdf();const doc=await lib.getDocument({data:new Uint8Array(await readBuf(file)),isEvalSupported:false}).promise;const rows=[];
    for(let p=1;p<=doc.numPages;p++){const tc=await (await doc.getPage(p)).getTextContent();const lines=[];
      tc.items.filter(i=>i.str.trim()).forEach(i=>{const y=i.transform[5],x=i.transform[4];let L=lines.find(l=>Math.abs(l.y-y)<2.5);if(!L){L={y,it:[]};lines.push(L);}L.it.push({x,s:i.str.trim()});});
      lines.sort((a,b)=>b.y-a.y).forEach(l=>rows.push(l.it.sort((a,b)=>a.x-b.x).flatMap(i=>i.s.split(/\s+/))));}
    busy();return rows;}
  const t=(await readTxt(file)).replace(/^﻿/,'');const L=t.split(/\r?\n/).filter(l=>l.trim());
  const sep=[';','\t',','].find(c=>L.slice(0,5).every(l=>l.includes(c)));
  return L.map(l=>sep?l.split(sep).map(v=>v.trim().replace(/^"|"$/g,'')):l.trim().split(/\s+/));
}
function rowsToHoles(rows){
  const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
  const find=(h,keys)=>h.findIndex(c=>keys.some(k=>norm(c)===k||norm(c).startsWith(k)));
  let hi=-1,ci=null;
  for(let i=0;i<Math.min(rows.length,40);i++){const h=rows[i];const cx=find(h,['x','este','east','easting','coordx','coordenadax']),cy=find(h,['y','norte','north','northing','coordy','coordenaday']);
    if(cx>=0&&cy>=0){hi=i;ci={id:find(h,['furo','id','hole','holeid','nome','name','ponto','numero','n']),x:cx,y:cy,p:find(h,['prof','profundidade','depth','comprimento','length','compr'])};break;}}
  const out=[];
  rows.slice(hi+1).forEach((r,k)=>{
    if(ci){const x=num(r[ci.x]),y=num(r[ci.y]);if(x==null||y==null)return;out.push({id:ci.id>=0&&r[ci.id]?r[ci.id]:String(out.length+1),x,y,p:ci.p>=0?num(r[ci.p]):null});return;}
    // sem cabeçalho: ID + dois números grandes (X,Y) + profundidade
    const nums=r.map(num);const big=nums.map((n,i)=>n!=null&&Math.abs(n)>=1000?i:-1).filter(i=>i>=0);
    if(big.length<2)return;const ix=big[0],iy=big[1];
    const id=ix>0?r[0]:String(out.length+1);
    const after=nums.slice(iy+1).filter(n=>n!=null&&n>0.5&&n<=80);
    out.push({id,x:nums[ix],y:nums[iy],p:after.length?after[0]:null});
  });
  if(!out.length)throw new Error('Não achei coordenadas nesse arquivo. Me mande um exemplo para ajustar o leitor.');
  coordEscala(out);
  return out;
}
// planilha que perdeu a vírgula das coordenadas (ex.: 7774646,585 virou 7774646585): volta cada valor para o tamanho certo.
// Usa os valores que ainda têm casas decimais como referência; sem nenhum, usa o tamanho de UTM (norte 7 dígitos, leste 6).
function coordEscala(out){
  const dig=n=>Math.floor(Math.log10(Math.abs(n)))+1;
  [['x',6],['y',7]].forEach(([k,utm])=>{const v=out.map(o=>o[k]).filter(n=>n);if(!v.length)return;
    const dec=v.filter(n=>!Number.isInteger(n));let alvo=null;
    if(dec.length){const c={};dec.forEach(n=>{const d=dig(n);c[d]=(c[d]||0)+1;});alvo=+Object.keys(c).sort((a,b)=>c[b]-c[a])[0];}
    else if(v.every(n=>dig(n)>utm+1))alvo=utm;
    if(alvo==null)return;
    out.forEach(o=>{const n=o[k];if(!n)return;const d=dig(n);if(d>alvo&&Number.isInteger(n))o[k]=Math.round(n/10**(d-alvo)*1e4)/1e4;});});
  return out;
}

const DYN=['status','profMed','agua','aguaM','decks','booster','brinel','detTipo','detQtd','tampao','caminhao','obs','cond','lotes','hist','ts','por'];
const PK=['lotes','cams','acess','check','situ','geo','pos','detAt','bg','wpp'];
function polyDoc(p){const ex={};PK.forEach(k=>{if(p[k]!=null)ex[k]=p[k];});if(ex.bg){ex.bg={...ex.bg};delete ex.bg.on;} /* mostrar/ocultar croqui é de cada celular */return{...ex,dvtProg:p.dvtProg??null,proj:p.proj||null,mina:p.mina,cava:p.cava,pol:p.pol,banco:p.banco,data:p.data,resp:p.resp,nfs:p.nfs||{},esp:p.esp||null,criado:p.criado||null,holes:p.holes.map(h=>{const o={};GEO.forEach(k=>{if(h[k]!=null)o[k]=h[k];});return o;})};}
function furoDoc(h){const o={};DYN.forEach(k=>o[k]=h[k]??null);return o;}
// cada parte do polígono vira um "caminho"; o celular manda só os caminhos que mudou desde a última sincronização
// assim dois colegas mexendo no mesmo polígono (caminhões diferentes, furos extras, checklist) não apagam o trabalho um do outro
const SUBK=['cams','acess','check','nfs','situ','pos','lotes','proj'];
const hsh=v=>{const t=JSON.stringify(v??null);let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return(h>>>0).toString(36)+t.length.toString(36);};
function mapaDoc(doc){const m={};Object.keys(doc||{}).forEach(k=>{const v=doc[k];
  if(k==='holes'&&Array.isArray(v))v.forEach(h=>{if(h&&h.id!=null)m['holes\u0001'+h.id]=hsh(h);});
  else if(SUBK.includes(k)&&v&&typeof v==='object'&&!Array.isArray(v))Object.keys(v).forEach(q=>m[k+'\u0001'+q]=hsh(v[q]));
  else m[k]=hsh(v);});return m;}
function mudancas(pid,doc){const y=SY();y.ph=y.ph||{};const base=y.ph[pid],cur=mapaDoc(doc);
  const ks=base?[...new Set([...Object.keys(base),...Object.keys(cur)])].filter(k=>base[k]!==cur[k]):Object.keys(cur);
  return ks.map(k=>k.split('\u0001'));}
let syncT=null,syncing=false,syncMsg='';

function pendentes(){const y=SY();return Object.keys(y.dp).length+Object.keys(y.df).length;}
async function api(body){
  const r=await fetch(apiURL(),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  let d={};try{d=await r.json();}catch(e){}
  if(!r.ok){const er=new Error(d.erro||('Erro '+r.status));er.sair=!!d.sair;throw er;}
  return d;
}
async function syncNow(){
  const y=SY();if(!y.token||syncing)return;
  syncing=true;const t0=Date.now();
  try{
    const polys=Object.keys(y.dp).map(id=>{const p=S.polys.find(x=>x.id===id);if(p){const doc=polyDoc(p);return{id,doc,mud:mudancas(id,doc)};}if(y.del&&y.del[id])return{id,doc:y.del[id],excluido:true};return null;}).filter(Boolean);
    const furos=[];Object.keys(y.df).forEach(k=>{const [pid,fid]=k.split('\u0001');const p=S.polys.find(x=>x.id===pid);const h=p&&p.holes.find(q=>q.id===fid);if(h){const doc=furoDoc(h);if(h.ts&&!doc.por)doc.por=h.por=meuNome();furos.push({poly_id:pid,furo_id:fid,doc,ts:h.ts||1});}});
    const d=await api({acao:'sync',token:y.token,desde:y.desde||null,polys,furos});
    // limpa só o que foi enviado e não mudou de novo durante o envio
    Object.keys(y.dp).forEach(k=>{if(y.dp[k]<=t0){delete y.dp[k];if(y.del)delete y.del[k];}});
    Object.keys(y.df).forEach(k=>{if(y.df[k]<=t0)delete y.df[k];});
    aplicarRemoto(d);setTimeout(nuvemArquivos,300);
    y.desde=d.agora;y.ultima=Date.now();if(d.usuario)y.nome=d.usuario.nome;syncMsg='';

  }catch(e){
    if(e.sair){y.token=null;syncMsg='Sessão expirada. Entre de novo.';save();}
    else syncMsg=e instanceof TypeError?'Sem conexão com a base — os lançamentos ficam guardados no celular e sobem quando tiver sinal.':e.message;
  }finally{syncing=false;atualizaTelaSync();}
}
const avisosRem=[];
function aplicarRemoto(d){
  const y=SY();let mudou=false;
  (d.polys||[]).forEach(rp=>{
    if(y.dp[rp.id])return; // tenho alteração local ainda não enviada
    y.ph=y.ph||{};if(!rp.excluido)y.ph[rp.id]=mapaDoc(rp.doc||{});
    const i=S.polys.findIndex(x=>x.id===rp.id);
    if(rp.excluido){if(i>=0){S.polys.splice(i,1);if(S.cur===rp.id&&view==='poly'){S.cur=null;view='home';}mudou=true;}return;}
    const doc=rp.doc||{};
    if(i<0){const np={id:rp.id,...Object.fromEntries(PK.filter(k=>doc[k]!=null).map(k=>[k,doc[k]])),dvtProg:doc.dvtProg??null,proj:doc.proj||null,criado:doc.criado||Date.now(),mina:doc.mina,cava:doc.cava,pol:doc.pol,banco:doc.banco,data:doc.data,resp:doc.resp,nfs:doc.nfs||{},esp:doc.esp,
        holes:(doc.holes||[]).map(g=>Object.assign(novoFuro(g.id,g.x,g.y,g.profProj,g.line,g.n),g.obsCroqui?{obsCroqui:g.obsCroqui}:{},g.cargaProj!=null?{cargaProj:g.cargaProj}:{},g.tempo!=null?{tempo:g.tempo,tempos:g.tempos||null}:{}))};S.polys.push(np);mudou=true;return;}
    const p=S.polys[i];const bgOn=p.bg?p.bg.on:undefined;['mina','cava','pol','banco','data','resp','esp','proj','dvtProg',...PK].forEach(k=>p[k]=doc[k]);p.nfs=doc.nfs||{};
    if(p.bg){p.bg={...p.bg,on:bgOn!==false};}else delete p.bg;
    const byId=new Map(p.holes.map(h=>[h.id,h]));
    (doc.holes||[]).forEach(g=>{const h=byId.get(g.id);if(h){GEO.forEach(k=>{if(g[k]!==undefined)h[k]=g[k];});}else p.holes.push(Object.assign(novoFuro(g.id,g.x,g.y,g.profProj,g.line,g.n),g.obsCroqui?{obsCroqui:g.obsCroqui}:{},g.tempo!=null?{tempo:g.tempo,tempos:g.tempos||null}:{}));});
    mudou=true;
  });
  (d.furos||[]).forEach(rf=>{
    const p=S.polys.find(x=>x.id===rf.poly_id);if(!p)return;const h=p.holes.find(q=>q.id===rf.furo_id);if(!h)return;
    const k=FK(rf.poly_id,rf.furo_id);if(y.df[k]&&(h.ts||0)>rf.ts)return;
    if((rf.ts||0)<(h.ts||0))return;
    const antes=JSON.stringify(alertasFuro(p,h));
    DYN.forEach(f=>{if(rf.doc&&f in rf.doc)h[f]=rf.doc[f];});if(!h.decks)h.decks=[];if(!h.status)h.status='pendente';
    if(y.desde&&rf.doc&&rf.doc.por&&rf.doc.por!==meuNome()){const a=alertasFuro(p,h);if(a.length&&JSON.stringify(a)!==antes)avisosRem.push(`POL ${p.pol} furo ${h.id} (${rf.doc.por}): ${a[0]}`);}
    mudou=true;
  });
  if(avisosRem.length){notificar(avisosRem.length===1?'Furo fora do projeto':avisosRem.length+' furos fora do projeto',avisosRem.slice(0,4).join('\n'));avisosRem.length=0;}

function gerarMalha(){
  const L=parseInt($('#gL').value),F=parseInt($('#gF').value),A=num($('#gA').value)||3.5,E=num($('#gE').value)||4,P=num($('#gP').value),stg=$('#gS').value==='1',seq=$('#gN').value==='seq';
  if(!(L>0&&F>0)||L*F>3000)throw new Error('Confira linhas e furos por linha');
  const hs=[];let k=1;
  for(let l=1;l<=L;l++)for(let f=1;f<=F;f++)hs.push(novoFuro(seq?String(k++):`L${l}-F${f}`,(f-1)*E+(stg&&l%2===0?E/2:0),(l-1)*A,P,l,f));
  return hs;
}
function lerLista(){
  const lines=$('#gList').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length)throw new Error('Cole a lista de furos');
  const hs=[];let semXY=false;
  lines.forEach((ln,i)=>{const c=ln.split(/[;\t]/).map(s=>s.trim());if(i===0&&isNaN(num(c[c.length-1]))&&isNaN(num(c[1])))return;/*cabeçalho*/
    if(c.length>=3)hs.push(novoFuro(c[0],num(c[1]),-num(c[2]),c.length>=4?num(c[3]):null));
    else{semXY=true;hs.push(novoFuro(c[0],null,null,num(c[1])));}});
  if(!hs.length)throw new Error('Nenhum furo reconhecido');
  if(semXY)hs.forEach((h,i)=>{h.x=(i%10)*4;h.y=Math.floor(i/10)*3.5;});
  else{const mx=Math.min(...hs.map(h=>h.x)),my=Math.min(...hs.map(h=>h.y));hs.forEach(h=>{h.x-=mx;h.y-=my;});hs.geo={mx,my};}
  return hs;
}

/* caminhão por deck: d.cam vale para o deck; sem d.cam o deck é do caminhão do furo (h.caminhao) */
const deckCam=(h,d)=>(d&&d.cam)||h.caminhao||'';
const deckTemCarga=d=>d&&(num(d.kg)>0||!!d.prod);
function camsDoFuro(h){const s=[];(h.decks||[]).forEach(d=>{if(!deckTemCarga(d)&&!d.cam)return;const c=deckCam(h,d);if(c&&!s.includes(c))s.push(c);});if(!s.length&&h.caminhao)s.push(h.caminhao);return s;}
const kgDoCam=(h,c)=>(h.decks||[]).reduce((t,d)=>t+(deckCam(h,d)===c?(num(d.kg)||0):0),0);
const camsPoly=p=>[...new Set(p.holes.flatMap(camsDoFuro))];
const camsTxt=h=>camsDoFuro(h).map(camCurto).join(' + ');
function normCams(h){if(!h.decks)return h;if(!h.caminhao){const c=h.decks.map(d=>d.cam).find(Boolean);if(c)h.caminhao=c;}h.decks.forEach(d=>{if(!d.cam||d.cam===h.caminhao)delete d.cam;});return h;}
// lança a carga de um caminhão no furo sem apagar o que outro caminhão já colocou
function lancarCarga(h,cam,prod,kg){
  const outros=(h.decks||[]).filter(d=>deckTemCarga(d)&&deckCam(h,d)!==cam);
  const meu=kg!=null?[{prod,kg}]:(h.decks||[]).filter(d=>deckCam(h,d)===cam).map(d=>({prod:d.prod,kg:d.kg}));
  if(!outros.length){h.decks=meu;h.caminhao=cam;}
  else{outros.forEach(d=>d.cam=deckCam(h,d));h.decks=[...outros,...meu.map(d=>Object.assign(d,{cam}))].slice(0,3);if(!h.caminhao)h.caminhao=outros[0].cam;}
  return normCams(h);}
function novoFuro(id,x,y,prof,line,n){return{id:String(id),x,y,line:line||null,n:n||null,profProj:prof,profMed:null,agua:'seca',aguaM:null,status:'pendente',decks:[],booster:null,brinel:null,detTipo:'',detQtd:null,tampao:null,caminhao:'',obs:'',cond:[],lotes:null,ts:null};}


/* ===== Projeto de carregamento (valores do plano de fogo, informados pelo usuário) ===== */
const PROJ_PADRAO={prod:'',kg:null,decks:1,tampao:null,booster:null,detTipo:'',detQtd:null,tolKg:10,tolProf:0.5,tolCam:3};
const projDe=p=>Object.assign({},PROJ_PADRAO,p.proj||{});
const kgProj=(p,h)=>h.cargaProj!=null?h.cargaProj:projDe(p).kg;
// classifica o furo comparando executado x projeto
function desvio(p,h){
  const pr=projDe(p),kp=kgProj(p,h),ke=holeKg(h);
  if(h.status==='perdido'||h.status==='nao')return{c:'fora',t:ST[h.status].n};
  if(!ke)return{c:'sem',t:'Sem carga lançada'};
  if(kp==null)return{c:'semproj',t:'Sem carga de projeto'};
  const d=(ke-kp)/kp*100;
  if(d<-pr.tolKg)return{c:'abaixo',d,t:`Abaixo do projeto (${fmt(d,0)}%)`};
  if(d>pr.tolKg)return{c:'acima',d,t:`Acima do projeto (+${fmt(d,0)}%)`};
  return{c:'ok',d,t:`Dentro do projeto (${d>=0?'+':''}${fmt(d,0)}%)`};
}
const DV={ok:{n:'Dentro do projeto',c:'#1f9d55'},abaixo:{n:'Abaixo do projeto',c:'#f08c00'},acima:{n:'Acima do projeto',c:'#7048e8'},sem:{n:'Sem carga lançada',c:'#b8c0c8'},semproj:{n:'Sem projeto',c:'#5b6b7a'},fora:{n:'Perdido / não carregar',c:'#d64545'}};
function conferencia(p){
  const pr=projDe(p),r={n:{},kgProj:0,kgExec:0,profBaixa:0,tampDif:0,boosterDif:0,lista:[]};Object.keys(DV).forEach(k=>r.n[k]=0);
  p.holes.forEach(h=>{const dv=desvio(p,h);r.n[dv.c]++;
    if(h.status!=='perdido'&&h.status!=='nao'){const kp=kgProj(p,h);if(kp!=null)r.kgProj+=kp;}
    r.kgExec+=holeKg(h);
    if(h.profMed!=null&&h.profProj!=null&&h.profMed<h.profProj-pr.tolProf)r.profBaixa++;
    if(pr.tampao!=null&&h.tampao!=null&&Math.abs(h.tampao-pr.tampao)>0.5)r.tampDif++;
    if(pr.booster!=null&&h.booster!=null&&num(h.booster)!==pr.booster)r.boosterDif++;
    if(dv.c==='abaixo'||dv.c==='acima')r.lista.push([h,dv]);});
  return r;
}

function tzHolesDe(P){ // lê os furos do backup do app Temporização
  return P.holes.filter(h=>!h.ghost).map(h=>{const st=h.st||[];const lbl=medLabel(h);const t=num(lbl);
    const nd=st.includes('deck3')?3:st.includes('deck2')?2:1;const tempos=Array.isArray(h.dt)?h.dt.slice(0,nd).map(num).filter(v=>v!=null):null;

}
const temTempo=h=>h.tempo!=null&&!isNaN(h.tempo);
function corTempo(t,t0,t1){const k=t1>t0?(t-t0)/(t1-t0):0;return`hsl(${Math.round(235-235*k)},78%,${k>.45&&k<.7?40:46}%)`;}
function faixaTempo(p){const ts=p.holes.filter(temTempo).map(h=>h.tempo);return ts.length?[Math.min(...ts),Math.max(...ts)]:[0,0];}
function analiseTempo(p){
  const ativos=p.holes.filter(h=>h.status!=='perdido'&&h.status!=='nao');
  const com=ativos.filter(temTempo),sem=ativos.filter(h=>!temTempo(h));
  const por={};com.forEach(h=>{(por[h.tempo]=por[h.tempo]||[]).push(h);});
  const rep=Object.entries(por).filter(([,v])=>v.length>1).map(([t,v])=>[+t,v]).sort((a,b)=>a[0]-b[0]);
  const ord=[...new Set(com.map(h=>h.tempo))].sort((a,b)=>a-b);let gmin=null;for(let i=1;i<ord.length;i++){const g=ord[i]-ord[i-1];if(gmin==null||g<gmin)gmin=g;}
  const dets=com.reduce((s,h)=>s+(h.tempos&&h.tempos.length?h.tempos.length:1),0);
  const [t0,t1]=faixaTempo(p);

function vizinhoMin(pts){let d=Infinity;const sm=pts.slice(0,250);for(let i=0;i<sm.length;i++)for(let j=i+1;j<sm.length;j++){const q=Math.hypot(sm[i][0]-sm[j][0],sm[i][1]-sm[j][1]);if(q>1e-6&&q<d)d=q;}return isFinite(d)?d:1;}
function casar(p,T,m){ // aplica transformação m nos furos da temporização e liga ao furo mais próximo
  const dm=vizinhoMin(p.holes.map(h=>[h.x,h.y]));const lim=dm*0.45;const usados=new Set();const pares=[];
  T.forEach(t=>{const X=m[0]*t.x+m[2]*t.y+m[4],Y=m[1]*t.x+m[3]*t.y+m[5];let best=-1,bd=Infinity;p.holes.forEach((h,i)=>{const d=Math.hypot(h.x-X,h.y-Y);if(d<bd){bd=d;best=i;}});if(best>=0&&bd<=lim&&!usados.has(best)){usados.add(best);pares.push([best,t]);}});
  return pares;
}
function semelhanca(p1,p2,q1,q2){const dpx=p2[0]-p1[0],dpy=p2[1]-p1[1],dqx=q2[0]-q1[0],dqy=q2[1]-q1[1],den=dpx*dpx+dpy*dpy;if(den<1e-9)return null;const sr=(dqx*dpx+dqy*dpy)/den,si=(dqy*dpx-dqx*dpy)/den;return[sr,si,-si,sr,q1[0]-(sr*p1[0]-si*p1[1]),q1[1]-(si*p1[0]+sr*p1[1])];}
function tzEncaixar(p,T){
  if(!T.length){toast('O backup não tem furos com tempo');return;}

  if(auto.length>=Math.min(T.length,p.holes.length)*0.8){aplicar(auto);return;}
  let A=0,B=p.holes.length-1,a=0,b=T.length-1;
  const draw=(res)=>{openSheet(`<h3>Encaixar temporização<button class="btn sm" id="teClose">Cancelar</button></h3>

    <div class="row"><div><label>2º furo do croqui</label><select id="teB">${p.holes.map((h,i)=>`<option value="${i}" ${i===B?'selected':''}>${esc(h.id)}</option>`).join('')}</select></div><div><label>tem o tempo</label><select id="teb">${T.map((t,i)=>`<option value="${i}" ${i===b?'selected':''}>${fmt(t.tempo)} ms</option>`).join('')}</select></div></div>
    ${res?`<div class="hint">${res.length} de ${T.length} tempos encaixaram em furos do croqui.${res.length<T.length*0.8?' Poucos — confira os 2 pares escolhidos.':''}</div>`:''}
    <div class="btns"><button class="btn" id="teTest">Testar encaixe</button><button class="btn pri" id="teOk" ${res&&res.length?'':'disabled style="opacity:.5"'}>Aplicar tempos</button></div>`);
    $('#teClose').onclick=closeSheet;
    ['teA','tea','teB','teb'].forEach(id=>$('#'+id).onchange=()=>{A=+$('#teA').value;a=+$('#tea').value;B=+$('#teB').value;b=+$('#teb').value;draw();});
    $('#teTest').onclick=()=>{const m=semelhanca([T[a].x,T[a].y],[T[b].x,T[b].y],[p.holes[A].x,p.holes[A].y],[p.holes[B].x,p.holes[B].y]);if(!m||A===B||a===b){toast('Escolha 2 furos e 2 tempos diferentes');return;}draw(casar(p,T,m));};
    if(res&&res.length)$('#teOk').onclick=()=>aplicar(res);};
  draw();
}

/* ===== Importar do app Medição Enaex (croqui real) ===== */
let medImport=null;
function medStatus(st){st=st||[];
  if(st.includes('perdido'))return'perdido';
  if(st.includes('nao_furado'))return'nao';
  if(st.includes('nao_carregado'))return'nao';
  if(st.includes('repasse'))return'repasse';
  return'pendente';}
function medLabel(h){return h.tl!=null&&h.tl!==''?String(h.tl):h.n>=1e5?'A'+(h.n-1e5):h.pf?h.pf+String(h.n).padStart(3,'0'):String(h.n);}
function lerMedicao(txt,nome){
  txt=txt.replace(/^﻿/,'');
  if(/^\s*\{/.test(txt)){
    const d=JSON.parse(txt);const P=d.poly||d;
    if(!P||!Array.isArray(P.holes))throw new Error('Arquivo não é um backup do Medição Enaex');
    if(d.app==='temporizacao'){const hs=tzHolesDe(P).map(t=>{const f=novoFuro(t.id,t.x,t.y,num(P.proj));f.tempo=t.tempo;if(t.tempos)f.tempos=t.tempos;if(t.perdido)f.status='perdido';if(t.obs)f.obsCroqui=t.obs;return f;});
      const bg=P.bg&&P.w?{url:P.bg,w:P.w,h:P.h}:null;return{holes:hs,nome:P.nome||'',bg,resumo:'plano de temporização (cada furo com seu tempo)'+(bg?' · com o desenho de fundo':'')};}
    const projP=num(P.proj);
    const hs=P.holes.filter(h=>!h.ghost).sort((a,b)=>(a.n||0)-(b.n||0)).map(h=>{
      const st=h.st||[];let status=medStatus(st);
      const pr=num(h.pr),pm=num(h.pm);
      if(status==='repasse'&&pr!=null)status='pendente'; // repasse já feito: furo liberado para carregar
      const f=novoFuro(medLabel(h),h.x+5.5,h.y+4.2,num(h.pp)??projP); // centro do furo no croqui
      f.status=status;f.profMed=pr??pm;
      if(st.includes('agua')||num(h.ag)){f.agua='agua';f.aguaM=num(h.ag);}
      f.caminhao=h.cam||'';f.obs=h.obs||'';
      if(st.length)f.obsCroqui=st.join(' + ');
      return f;});
    if(!hs.length)throw new Error('Backup sem furos');
    const bg=P.bg&&P.w?{url:P.bg,w:P.w,h:P.h}:null;
    return{holes:hs,nome:P.nome||'',bg,resumo:'posições iguais ao croqui'+(bg?' · com o desenho do croqui de fundo':'')};
  }
  // CSV (Medição Enaex, Temporização, planilha do app ou lista com coordenadas)
  const L=txt.split(/\r?\n/).filter(l=>l.trim());if(!L.length)throw new Error('Arquivo vazio');
  const norm=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9_]/g,'');
  const sepDe=l=>[';','\t',','].map(c=>[c,l.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const mkSplit=sep=>l=>{const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const c=l[i];if(q){if(c==='"'&&l[i+1]==='"'){cur+='"';i++;}else if(c==='"')q=false;else cur+=c;}else if(c==='"')q=true;else if(c===sep){out.push(cur);cur='';}else cur+=c;}out.push(cur);return out.map(v=>v.trim());};
  const IDK=['furo','n_furo','nfuro','numero_furo','furo_id','hole','holeid','hole_id','id','n','no','numero','ponto','nome','tempo_ms'];
  let hi=-1,split=null,head=null;
  for(let k=0;k<Math.min(L.length,15);k++){const sp=mkSplit(sepDe(L[k]));const h=sp(L[k]).map(norm);if(h.some(c=>IDK.includes(c)||c.startsWith('furo'))){hi=k;split=sp;head=h;break;}}
  if(hi<0){ // sem cabeçalho reconhecido: tenta como lista de coordenadas
    const sp=mkSplit(sepDe(L[0]));try{const hs=rowsToHoles(L.map(sp)).map(q=>novoFuro(q.id,q.x,-q.y,q.p));const mx=Math.min(...hs.map(h=>h.x)),my=Math.min(...hs.map(h=>h.y));hs.forEach(h=>{h.x-=mx;h.y-=my;});return{holes:hs,nome:'',geo:{mx,my},resumo:'lista de coordenadas'};}
    catch(e){throw new Error('Não reconheci este CSV. 1ª linha: "'+L[0].slice(0,80)+'". Me mande o arquivo para eu ajustar o leitor.');}}
  const col=(...ks)=>{for(const k of ks){const i=head.indexOf(k);if(i>=0)return i;}return head.findIndex(c=>ks.some(k=>c.startsWith(k)));};
  const ci={id:col('furo','n_furo','nfuro','numero_furo','furo_id','hole','holeid','hole_id','id','n','no','numero','ponto','nome'),tempo:col('tempo_ms','tempo'),st:col('status','marcacao'),pp:col('prof_projeto_m','prof_projeto','profundidade_projeto','prof_proj','prof','profundidade','depth'),pm:col('prof_medida_m','prof_medida','profundidade_medida','prof_med'),pr:col('prof_apos_repasse_m','prof_apos_repasse'),ag:col('lamina_agua_m','lamina_agua','coluna_agua','agua_m'),cam:col('caminhao'),obs:col('observacao','obs'),x:col('x','este','east','coord_x'),y:col('y','norte','north','coord_y'),d1:col('tempo_deck1'),d2:col('tempo_deck2'),d3:col('tempo_deck3')};
  const tz=ci.id<0&&ci.tempo>=0; // CSV do app Temporização: o furo é o próprio tempo
  const rows=L.slice(hi+1).map(split);const temXY=ci.x>=0&&ci.y>=0&&rows.some(r=>num(r[ci.x])!=null);
  const g=(r,k)=>ci[k]>=0?(r[ci[k]]??''):'';
  const hs=rows.map((r,i)=>{const id=tz?g(r,'tempo'):g(r,'id');if(!id)return null;
    const stTxt=(g(r,'st')+'').toLowerCase();
    let status='pendente';if(stTxt.includes('perdido'))status='perdido';else if(stTxt.includes('não furado')||stTxt.includes('nao furado')||stTxt.includes('não carregado')||stTxt.includes('nao carregado'))status='nao';else if(stTxt.includes('repasse')&&num(g(r,'pr'))==null)status='repasse';
    const f=novoFuro(id,temXY?num(g(r,'x')):(i%10)*4,temXY?-num(g(r,'y')):Math.floor(i/10)*3.5,num(g(r,'pp')));
    f.status=status;f.profMed=num(g(r,'pr'))??num(g(r,'pm'));
    if(stTxt.includes('água')||stTxt.includes('agua')||num(g(r,'ag'))){f.agua='agua';f.aguaM=num(g(r,'ag'));}
    f.caminhao=g(r,'cam');f.obs=g(r,'obs');
    if(tz){f.tempo=num(id);const ds=['d1','d2','d3'].map(k=>num(g(r,k))).filter(v=>v!=null);if(ds.length>1)f.tempos=ds;}
    else if(ci.tempo>=0&&num(g(r,'tempo'))!=null)f.tempo=num(g(r,'tempo'));
    return f;}).filter(Boolean);
  if(!hs.length)throw new Error('CSV sem furos');
  let geo=null;if(temXY){const mx=Math.min(...hs.map(h=>h.x)),my=Math.min(...hs.map(h=>h.y));hs.forEach(h=>{h.x-=mx;h.y-=my;});geo={mx,my};}
  return{holes:hs,nome:'',geo,resumo:(tz?'CSV da Temporização (cada furo com seu tempo). ':'')+(temXY?'com coordenadas':'o CSV não traz a posição; o mapa fica em grade (use o backup .json para o desenho igual ao croqui)')};
}

const ehExtra=h=>/^EX\d+$/i.test(String(h.id));
function maisPerto(p,x,y){let b=null,d=Infinity;p.holes.forEach(h=>{const q=Math.hypot(h.x-x,h.y-y);if(q<d){d=q;b=h;}});return b;}
function addExtra(p,near,ponto){
  const base=near||(ponto&&maisPerto(p,ponto.x,ponto.y))||p.holes[p.holes.length-1]||{x:0,y:0};
  const ids=new Set(p.holes.map(h=>h.id));let k=1;while(ids.has('EX'+k))k++;
  const h=ponto?novoFuro('EX'+k,Math.round(ponto.x*100)/100,Math.round(ponto.y*100)/100,base.profProj):novoFuro('EX'+k,(base.x||0)+(p.esp||4)/2,(base.y||0)+1.5,base.profProj);
  histAdd(h,ponto?'Criado no croqui (tocar e segurar)':'Criado como furo extra');
  p.holes.push(h);markP(p.id);markF(p.id,h.id);save();renderPoly();editHole(p.holes.length-1);
}

/* ----- Foto do polígono (drone): acha os furos na foto e afina o encaixe ----- */
// furo na foto = mancha cinza-azulada redonda (pó da perfuração) com um ponto escuro no meio
function borrar(a,W,H,s){const r=Math.max(1,Math.round(Math.sqrt(12*s*s/3+1)/2-0.5)),t=new Float32Array(W*H);let o=a.slice?a.slice():Float32Array.from(a);
  for(let pass=0;pass<3;pass++){for(let y=0;y<H;y++){let acc=0;const b=y*W;for(let x=-r;x<=r;x++)acc+=o[b+Math.min(W-1,Math.max(0,x))];for(let x=0;x<W;x++){t[b+x]=acc/(2*r+1);acc+=o[b+Math.min(W-1,x+r+1)]-o[b+Math.max(0,x-r)];}}
    for(let x=0;x<W;x++){let acc=0;for(let y=-r;y<=r;y++)acc+=t[Math.min(H-1,Math.max(0,y))*W+x];for(let y=0;y<H;y++){o[y*W+x]=acc/(2*r+1);acc+=t[Math.min(H-1,y+r+1)*W+x]-t[Math.max(0,y-r)*W+x];}}}
  return o;}
function mapaFuros(d,W,H){const n=W*H,q=new Float32Array(n),dk=new Float32Array(n);
  for(let i=0;i<n;i++){const r=d[i*4],g=d[i*4+1],b=d[i*4+2],l=(r+g+b)/3;dk[i]=255-l;q[i]=(b-r)+0.5*(255-l);}
  const a=borrar(q,W,H,3),b=borrar(q,W,H,9),c=borrar(dk,W,H,3),e=borrar(dk,W,H,9),f=borrar(dk,W,H,1.2),h=borrar(dk,W,H,4),s=new Float32Array(n);
  for(let i=0;i<n;i++)s[i]=(a[i]-b[i])+0.6*(c[i]-e[i])+0.4*(f[i]-h[i]);return s;}
const invAf=m=>{const [a,b,c,d,e,f]=m,det=a*d-b*c;return[d/det,-b/det,-c/det,a/det,(c*f-d*e)/det,(b*e-a*f)/det];};
const apAf=(m,x,y)=>[m[0]*x+m[2]*y+m[4],m[1]*x+m[3]*y+m[5]];
// ajuste afim (mínimos quadrados) de pontos s -> d
function ajusteAf(S,D){const n=S.length;if(n<6)return null;let M=[[0,0,0],[0,0,0],[0,0,0]],vx=[0,0,0],vy=[0,0,0];
  S.forEach(([x,y],i)=>{const v=[x,y,1];for(let a=0;a<3;a++){for(let b=0;b<3;b++)M[a][b]+=v[a]*v[b];vx[a]+=v[a]*D[i][0];vy[a]+=v[a]*D[i][1];}});
  const sol=v=>{const A=M.map((r,i)=>[...r,v[i]]);for(let i=0;i<3;i++){let p=i;for(let k=i+1;k<3;k++)if(Math.abs(A[k][i])>Math.abs(A[p][i]))p=k;[A[i],A[p]]=[A[p],A[i]];if(Math.abs(A[i][i])<1e-9)return null;for(let k=0;k<3;k++)if(k!==i){const f=A[k][i]/A[i][i];for(let j=i;j<4;j++)A[k][j]-=f*A[i][j];}}return A.map((r,i)=>r[3]/r[i]);};
  const X=sol(vx),Y=sol(vy);return X&&Y?[X[0],Y[0],X[1],Y[1],X[2],Y[2]]:null;}
async function afinarPelaFoto(p,img,m){ // m: foto -> mapa (dos 2 toques). Devolve m afinado e quais furos apareceram na foto
  const hs=p.holes.filter(h=>h.status!=='nao');if(hs.length<8)return null;
  const im=await new Promise((ok,err)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=err;i.src=img.url;});
  let F=invAf(m);const esc=Math.hypot(F[0],F[1]);
  const nnM=(()=>{const d=hs.map(a=>{let mn=Infinity;hs.forEach(b=>{if(b!==a){const q=Math.hypot(a.x-b.x,a.y-b.y);if(q<mn)mn=q;}});return mn;}).sort((a,b)=>a-b);return d[d.length>>1];})();
  const sp=nnM*esc;if(!(sp>3))return null;
  const P0=hs.map(h=>apAf(F,h.x,h.y));const x0=Math.max(0,Math.min(...P0.map(q=>q[0]))-2*sp),y0=Math.max(0,Math.min(...P0.map(q=>q[1]))-2*sp),x1=Math.min(img.w,Math.max(...P0.map(q=>q[0]))+2*sp),y1=Math.min(img.h,Math.max(...P0.map(q=>q[1]))+2*sp);
  if(x1-x0<10||y1-y0<10)return null;
  let k=28/sp;k=Math.min(k,2600/(x1-x0),2600/(y1-y0),4);const W=Math.round((x1-x0)*k),H=Math.round((y1-y0)*k);
  const c=document.createElement('canvas');c.width=W;c.height=H;const cx=c.getContext('2d');cx.drawImage(im,x0,y0,x1-x0,y1-y0,0,0,W,H);
  const s=mapaFuros(cx.getImageData(0,0,W,H).data,W,H);
  const ord=Float32Array.from(s).sort();const T=0.3*ord[Math.floor(ord.length*0.99)];
  const toL=([x,y])=>[(x-x0)*k,(y-y0)*k],toF=([x,y])=>[x/k+x0,y/k+y0];
  let par=[];
  for(let it=0;it<5;it++){const w=Math.max(2,Math.round((it?0.3:0.45)*sp*k));par=[];
    hs.forEach((h,i)=>{const [u,v]=toL(apAf(F,h.x,h.y));const ui=Math.round(u),vi=Math.round(v);if(ui<w||vi<w||ui>=W-w||vi>=H-w)return;let bm=-Infinity,bu=0,bv=0;
      for(let yy=vi-w;yy<=vi+w;yy++)for(let xx=ui-w;xx<=ui+w;xx++){const z=s[yy*W+xx];if(z>bm){bm=z;bu=xx;bv=yy;}}
      if(bm>T)par.push([i,toF([bu,bv])]);});
    if(par.length<Math.max(6,hs.length*0.25))return{m,achados:[],nao:hs.map(h=>h.id),fraco:true};
    const err=par.map(([i,q])=>{const pp=apAf(F,hs[i].x,hs[i].y);return Math.hypot(pp[0]-q[0],pp[1]-q[1]);});const lim=[...err].sort((a,b)=>a-b)[Math.floor(err.length*0.8)];
    const usa=par.filter((_,j)=>err[j]<=lim);const nf=ajusteAf(usa.map(([i])=>[hs[i].x,hs[i].y]),usa.map(([,q])=>q));if(!nf)break;
    const e2=Math.hypot(nf[0],nf[1]),e3=Math.hypot(nf[2],nf[3]);if(e2/esc<0.7||e2/esc>1.4||e3/esc<0.7||e3/esc>1.4)break; // deformou demais: fica com o encaixe dos toques
    F=nf;}
  const achados=new Set(par.filter(([i,q])=>{const pp=apAf(F,hs[i].x,hs[i].y);return Math.hypot(pp[0]-q[0],pp[1]-q[1])<0.25*sp;}).map(([i])=>hs[i].id));
  return{m:invAf(F),achados:[...achados],nao:hs.filter(h=>!achados.has(h.id)).map(h=>h.id)};
}

  openSheet(`<h3>Croqui de fundo<button class="btn sm" id="bClose">Fechar</button></h3><p class="mut">Escolha o PDF do croqui ou uma foto (pode ser a foto do drone). Depois você toca em 2 furos no desenho para o app encaixar. Na foto, o app procura os outros furos sozinho e acerta o encaixe.</p><div class="btns" style="flex-direction:column"><button class="btn pri" id="bPick">Escolher PDF ou foto</button>${opts2}</div>`);
  $('#bClose').onclick=closeSheet;
  if($('#bRe'))$('#bRe').onclick=async()=>{const url=await bgGet(p.id);if(!url){toast('Croqui não encontrado neste aparelho');return;}calibrar(p,{url,w:p.bg.w,h:p.bg.h,foto:!!p.bg.foto});};
  $('#bPick').onclick=async()=>{const file=await pickFile('.pdf,image/*');if(!file)return;
    try{const pdf=/\.pdf$/i.test(file.name);const img=pdf?await pdfPageToImage(await readBuf(file)):await imageFileToImage(file);if(!pdf)img.foto=true;calibrar(p,img);}catch(e){busy();toast(e.message||'Não consegui abrir o arquivo');}};

function calibrar(p,img){
  if(p.holes.length<2){toast('O polígono precisa de pelo menos 2 furos');return;}
  // sugere os dois furos mais distantes entre si (primeiro e último)
  let A=0,B=p.holes.length-1,dm=0;for(let i=0;i<p.holes.length;i+=Math.max(1,Math.floor(p.holes.length/60)))for(let j=i+1;j<p.holes.length;j+=Math.max(1,Math.floor(p.holes.length/60))){const d=Math.hypot(p.holes[i].x-p.holes[j].x,p.holes[i].y-p.holes[j].y);if(d>dm){dm=d;A=i;B=j;}}
  const pick=[null,null];let step=0,z=1;
  const sel=(id,v)=>`<select id="${id}">${p.holes.map((h,i)=>`<option value="${i}" ${i===v?'selected':''}>${esc(h.id)}</option>`).join('')}</select>`;
  const draw=()=>{
    openSheet(`<h3>Encaixar o croqui<button class="btn sm" id="cClose">Cancelar</button></h3>
    <div class="row"><div><label>1º furo</label>${sel('cA',A)}</div><div><label>2º furo</label>${sel('cB',B)}</div></div>
    <div class="hint" id="cMsg">Toque no centro do furo <b>${esc(p.holes[step===0?A:B].id)}</b> no desenho abaixo (${step+1} de 2). Use o zoom para acertar.</div>
    <div class="btns"><button class="btn sm" id="cZo">− Zoom</button><button class="btn sm" id="cZi">+ Zoom</button></div>
    <div class="mapwrap" style="max-height:55vh;margin-top:8px"><div style="position:relative;width:${100*z}%"><img id="cImg" src="${img.url}" style="width:100%;display:block">${pick.map((q,k)=>q?`<div style="position:absolute;left:${q[0]/img.w*100}%;top:${q[1]/img.h*100}%;width:18px;height:18px;margin:-9px;border-radius:50%;border:3px solid ${k?'#d64545':'#0b5cad'};background:rgba(255,255,255,.4);pointer-events:none"></div>`:'').join('')}</div></div>
    <div class="btns"><button class="btn" id="cRedo">Refazer toques</button><button class="btn pri" id="cOk" ${pick[1]?'':'disabled style="opacity:.5"'}>Salvar encaixe</button></div>`);
    $('#cClose').onclick=closeSheet;
    $('#cA').onchange=e=>{A=+e.target.value;pick[0]=pick[1]=null;step=0;draw();};
    $('#cB').onchange=e=>{B=+e.target.value;pick[0]=pick[1]=null;step=0;draw();};
    $('#cZi').onclick=()=>{z=Math.min(5,z*1.5);draw();};$('#cZo').onclick=()=>{z=Math.max(1,z/1.5);draw();};
    $('#cRedo').onclick=()=>{pick[0]=pick[1]=null;step=0;draw();};
    $('#cImg').onclick=e=>{const r=e.target.getBoundingClientRect();const u=(e.clientX-r.left)/r.width*img.w,v=(e.clientY-r.top)/r.height*img.h;if(!pick[0])pick[0]=[u,v];else pick[1]=[u,v];step=pick[0]?1:0;draw();};
    $('#cOk').onclick=async()=>{if(!(pick[0]&&pick[1]))return;if(A===B){toast('Escolha dois furos diferentes');return;}
      const p1=pick[0],p2=pick[1],q1=[p.holes[A].x,p.holes[A].y],q2=[p.holes[B].x,p.holes[B].y];
      // transformação de semelhança (escala + giro + deslocamento) da imagem para o mapa
      const dpx=p2[0]-p1[0],dpy=p2[1]-p1[1],dqx=q2[0]-q1[0],dqy=q2[1]-q1[1],den=dpx*dpx+dpy*dpy;
      if(den<1){toast('Os dois toques estão no mesmo lugar');return;}
      const sr=(dqx*dpx+dqy*dpy)/den,si=(dqy*dpx-dqx*dpy)/den;
      const e1=q1[0]-(sr*p1[0]-si*p1[1]),f1=q1[1]-(si*p1[0]+sr*p1[1]);
      let m=[sr,si,-si,sr,e1,f1],res=null;
      if(img.foto){busy('Procurando os furos na foto…');try{res=await afinarPelaFoto(p,img,m);}catch(e){console.error(e);}busy();if(res&&!res.fraco)m=res.m;}
      p.bg={w:img.w,h:img.h,m,on:true,foto:!!img.foto};if(res&&!res.fraco)p.bg.semFoto=res.nao;else delete p.bg.semFoto;
      const ok=await bgPut(p.id,img.url);markP(p.id);save();closeSheet();tab='mapa';renderPoly();
      if(!ok)toast('Encaixado, mas o aparelho não guardou a imagem');
      else if(res&&!res.fraco){const n=res.achados.length,t=n+res.nao.length;
        openSheet(`<h3>Foto encaixada<button class="btn sm" id="fOk">OK</button></h3><p><b>${n} de ${t}</b> furos do croqui foram achados na foto e usados para acertar o encaixe.</p>
        ${res.nao.length?`<p class="mut">Sem furo visível na foto (pode ser furo coberto, sombra, máquina em cima ou furo não perfurado). Confira no mapa: eles ficam com um anel laranja.</p><p style="max-height:30vh;overflow:auto">${res.nao.map(esc).join(', ')}</p>`:''}
        <p class="mut">A foto de drone nunca é perfeita (ângulo, lente). Se algum furo ficar fora do lugar, use “Reposicionar” e toque em 2 furos mais afastados.</p>`);$('#fOk').onclick=closeSheet;}
      else if(img.foto)toast('Foto encaixada pelos 2 toques (não consegui achar furos suficientes na foto para afinar)');
      else toast('Croqui encaixado');};
  };
  draw();
}

/* ----- Mapa ----- */
const CAM_COR={'UMT 1038':'#e8590c','UMT 1039':'#1971c2','UMT 1044':'#2f9e44','UMT 1045':'#9c36b5','UMB 1148':'#c2255c','UMB 1113':'#0c8599'};
const EXTRA_COR=['#5c940d','#862e9c','#d9480f','#364fc7','#a61e4d','#087f5b'];
function camCor(c){if(!c)return'#b8c0c8';if(CAM_COR[c])return CAM_COR[c];let h=0;for(const ch of c)h=(h*31+ch.charCodeAt(0))>>>0;return EXTRA_COR[h%EXTRA_COR.length];}
const camCurto=c=>(c||'').replace(/^UM[TB]\s*/,'');
let corPor=(S.ui&&S.ui.corPor)||'caminhao',pincel=null,rotulos=true;
let planFlash=null; // furos que acabaram de chegar da planilha (anel pulsando no croqui)
function setCorPor(v){corPor=v;S.ui=Object.assign(S.ui||{},{corPor:v});save();}
const nf=n=>n===1?'1 furo':n+' furos';
function rotuloFuro(h){const kg=holeKg(h);return[camsTxt(h),kg?fmt(kg)+' kg':''].filter(Boolean);} // pincel = caminhão sendo marcado no mapa
function geom(p,crop){
  const bgOn=!!(p.bg&&p.bg.on!==false);const bgUrl=p.bg?(bgCache[p.id]||null):null;const useBg=bgOn&&!!bgUrl;
  const pts=p.holes.map(h=>[h.x,h.y]);
  if(useBg&&!crop){const m=p.bg.m;[[0,0],[p.bg.w,0],[0,p.bg.h],[p.bg.w,p.bg.h]].forEach(([u,v])=>pts.push([m[0]*u+m[2]*v+m[4],m[1]*u+m[3]*v+m[5]]));}
  const xs=pts.map(q=>q[0]),ys=pts.map(q=>q[1]);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  let dmin=Infinity;const sm=p.holes.slice(0,250);
  for(let a=0;a<sm.length;a++)for(let b=a+1;b<sm.length;b++){const d=Math.hypot(sm[a].x-sm[b].x,sm[a].y-sm[b].y);if(d>0.01&&d<dmin)dmin=d;}
  if(!isFinite(dmin))dmin=4;const r=dmin*(useBg?0.3:0.36),pad=r*(crop?4:2.2),off=r*1.8;
  return{bgOn,bgUrl,useBg,minX,minY,r,pad,off,W:maxX-minX+pad*2+off,H:maxY-minY+pad*2,X:x=>x-minX+pad+off,Y:y=>y-minY+pad};
}
function corFuro(h){
  if(corPor==='caminhao'){if(h.status==='perdido'||h.status==='nao')return ST[h.status].c;return camCor(camsDoFuro(h)[0]||'');}
  if(corPor==='desvio')return DV[desvio(cur(),h).c].c;
  if(corPor==='tempo'){if(h.status==='perdido'||h.status==='nao')return'#343a40';if(!temTempo(h))return'#b8c0c8';const [t0,t1]=faixaTempo(cur());return corTempo(h.tempo,t0,t1);}
  return ST[h.status].c;
}
function meiaLua(h,cx,cy,r){if(corPor!=='caminhao'||h.status==='perdido'||h.status==='nao')return'';const cs=camsDoFuro(h);if(cs.length<2)return'';const q=r*0.92;
  return`<path d="M${cx} ${cy-q}A${q} ${q} 0 0 1 ${cx} ${cy+q}Z" fill="${camCor(cs[1])}" pointer-events="none"/><line x1="${cx}" y1="${cy-q}" x2="${cx}" y2="${cy+q}" stroke="#fff" stroke-width="${r*0.06}" pointer-events="none"/>`;}

/* ===== Desfazer e histórico ===== */
const undoSt=[];
const SNAPK=[...DYN,'tempo','tempos','cargaProj'];
function snapH(h){const o={};SNAPK.forEach(k=>o[k]=h[k]==null?null:JSON.parse(JSON.stringify(h[k])));return o;}
function pushUndo(p,hs,txt){undoSt.push({pid:p.id,txt,s:hs.map(h=>[h.id,snapH(h)])});if(undoSt.length>30)undoSt.shift();}
function podeDesfazer(p){return undoSt.length>0&&undoSt[undoSt.length-1].pid===p.id;}
function desfazer(p){
  if(!podeDesfazer(p)){toast('Nada para desfazer');return;}
  const u=undoSt.pop();const byId=new Map(p.holes.map(h=>[h.id,h]));let tz=false;
  u.s.forEach(([id,o])=>{const h=byId.get(id);if(!h)return;if(h.tempo!==o.tempo)tz=true;Object.assign(h,o);if(!h.decks)h.decks=[];if(!h.status)h.status='pendente';histAdd(h,'Desfeito ('+u.txt+')');h.ts=Date.now();h.por=meuNome();markF(p.id,h.id);});
  if(tz)markP(p.id);save();renderPoly();toast('Desfeito: '+u.txt);
}
function histAdd(h,t){h.hist=(h.hist||[]).slice(-19);h.hist.push({ts:Date.now(),por:meuNome()||'',t});}
function resumoFuro(h){const kg=holeKg(h);return[ST[h.status].n,kg?fmt(kg)+' kg':'',camsDoFuro(h).join(' + '),h.profMed!=null?'prof. '+fmt(h.profMed,1)+' m':'',(h.cond||[]).join('/')].filter(Boolean).join(' · ');}
function carimbaLotes(p,h){if(h.status==='carregado'&&!h.lotes&&p.lotes&&Object.values(p.lotes).some(Boolean))h.lotes=Object.assign({},p.lotes);}

/* ===== GPS (só para polígono importado com coordenadas UTM) ===== */
function geoUTM(g){return !!g&&g.mx>100000&&g.mx<900000&&-g.my>1000000&&-g.my<10000000;}
function ll2utm(lat,lon){
  const a=6378137,f=1/298.257223563,k0=0.9996,e2=f*(2-f),ep2=e2/(1-e2),zone=Math.floor((lon+180)/6)+1,l0=((zone-1)*6-177)*Math.PI/180;
  const fi=lat*Math.PI/180,la=lon*Math.PI/180,sf=Math.sin(fi),cf=Math.cos(fi),N=a/Math.sqrt(1-e2*sf*sf),T=Math.tan(fi)**2,C=ep2*cf*cf,A=cf*(la-l0);
  const M=a*((1-e2/4-3*e2*e2/64-5*e2**3/256)*fi-(3*e2/8+3*e2*e2/32+45*e2**3/1024)*Math.sin(2*fi)+(15*e2*e2/256+45*e2**3/1024)*Math.sin(4*fi)-(35*e2**3/3072)*Math.sin(6*fi));
  const E=k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120)+500000;
  let No=k0*(M+N*Math.tan(fi)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720));if(lat<0)No+=10000000;
  return{E,N:No,zone};
}
let gpsOn=false,gpsId=null,gpsPos=null,gpsErr='';
function gpsStart(){

  gpsOn=true;gpsErr='';
  gpsId=navigator.geolocation.watchPosition(ps=>{gpsPos={lat:ps.coords.latitude,lon:ps.coords.longitude,acc:ps.coords.accuracy};gpsErr='';gpsDraw();},
    e=>{gpsErr=e.code===1?'Permissão do GPS negada. Libere a localização para este site.':'Sem sinal do GPS.';gpsDraw();},{enableHighAccuracy:true,maximumAge:3000,timeout:20000});
}

  const gG=$('#gpsG'),info=$('#gpsInfo'),p=cur();if(!gG||!p||!p.geo||!lastGeom)return;
  if(!gpsOn){gG.innerHTML='';return;}
  if(!gpsPos){if(info)info.textContent=gpsErr||'Procurando sinal do GPS…';return;}
  const u=ll2utm(gpsPos.lat,gpsPos.lon),x=u.E-p.geo.mx,y=-u.N-p.geo.my,g=lastGeom;
  let best=null,bd=Infinity;p.holes.forEach(h=>{const d=Math.hypot(h.x-x,h.y-y);if(d<bd){bd=d;best=h;}});
  const ext=Math.max(g.W,g.H);
  if(bd>ext*3){gG.innerHTML='';if(info)info.innerHTML=`Você está a <b>${fmt(bd)} m</b> do polígono (fora do mapa). Precisão ${fmt(gpsPos.acc)} m.`;return;}
  gG.innerHTML=`<circle cx="${g.X(x)}" cy="${g.Y(y)}" r="${Math.max(gpsPos.acc,g.r)}" fill="rgba(11,92,173,.12)" stroke="#0b5cad" stroke-width="${g.r*0.08}"/><circle cx="${g.X(x)}" cy="${g.Y(y)}" r="${g.r*0.55}" fill="#0b5cad" stroke="#fff" stroke-width="${g.r*0.2}"/>`;
  if(info)info.innerHTML=`📍 Furo mais perto: <b>${esc(best.id)}</b> a ${fmt(bd,1)} m · precisão do GPS ${fmt(gpsPos.acc)} m${gpsPos.acc>5?' (fraca)':''} <button class="btn sm" id="gpsOpen" style="margin-left:6px">Abrir ${esc(best.id)}</button>`;

/* ===== Liberação: situação do polígono e checklists ===== */
const situDe=p=>p.situ||'aberto';
/* ===== Fechamento: o que falta antes de liberar ===== */
function faltas(p){
  const idx=new Map(p.holes.map((h,i)=>[h,i]));const carr=p.holes.filter(h=>h.status==='carregado');
  const temCam=h=>(h.decks||[]).filter(d=>num(d.kg)>0).every(d=>deckCam(h,d));
  return [
    ['Pendentes (não carregados)',p.holes.filter(h=>h.status==='pendente')],
    ['Em repasse',p.holes.filter(h=>h.status==='repasse')],
    ['Carregados sem carga lançada',carr.filter(h=>!holeKg(h))],
    ['Carregados sem caminhão',carr.filter(h=>holeKg(h)&&!temCam(h))],
    ['Carregados sem tampão',carr.filter(h=>h.tampao==null)],
    ['Carregados sem detonador',carr.filter(h=>!h.detTipo&&!num(h.detQtd))],
    ['Fora da tolerância do projeto',carr.filter(h=>alertasFuro(p,h).length)],
  ].map(([t,hs])=>({t,hs:hs.map(h=>({h,i:idx.get(h)}))})).filter(g=>g.hs.length);}
function faltasHtml(p){const G=faltas(p);const tot=G.reduce((s,g)=>s+g.hs.length,0);
  if(!G.length)return `<div class="card"><h2>Fechamento do polígono</h2><div class="hint" style="background:#eaf7ef;border-color:#b5e0c4">✔ Nada faltando: todos os furos estão lançados, com caminhão, tampão e detonador.</div></div>`;
  return `<div class="card"><h2>Fechamento do polígono <span class="mut">(${tot} ${tot>1?'itens':'item'})</span></h2><p class="mut" style="margin:0 0 6px">Toque no furo para abrir e corrigir.</p>
  ${G.map(g=>`<div style="margin:8px 0"><b>${esc(g.t)}: ${g.hs.length}</b><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${g.hs.slice(0,40).map(x=>`<button class="btn sm" data-fi="${x.i}" style="flex:0 0 auto;min-width:44px">${esc(x.h.id)}</button>`).join('')}${g.hs.length>40?`<span class="mut" style="align-self:center">+${g.hs.length-40}</span>`:''}</div></div>`).join('')}</div>`;}
function tabLiber(p){
  p.check=p.check||{};
  const bloco=(k,tit,itens)=>{const c=p.check[k]||{it:{}};const nOk=itens.filter((_,i)=>c.it&&c.it[i]).length;
    return`<div class="card"><h2>${tit} <span class="mut">(${nOk}/${itens.length})</span></h2>${itens.map((t,i)=>`<label class="chk"><input type="checkbox" data-k="${k}" data-i="${i}" ${c.it&&c.it[i]?'checked':''}>${esc(t)}</label>`).join('')}
    <div class="row" style="margin-top:6px"><div><label>Liberado por</label><input id="nm_${k}" value="${esc(c.nome||meuNome()||p.resp||'')}"></div><div style="align-self:end"><button class="btn ${c.ts?'':'pri'}" data-lib="${k}" style="width:100%">${c.ts?'Registrar de novo':'Registrar liberação'}</button></div></div>
    ${c.ts?`<div class="hint" style="background:#eaf7ef;border-color:#b5e0c4">✔ Registrado por <b>${esc(c.nome)}</b> em ${new Date(c.ts).toLocaleString('pt-BR')}${nOk<itens.length?` · <b style="color:var(--bad)">${itens.length-nOk} item(ns) não marcado(s)</b>`:''}</div>`:''}</div>`;};
  const si=situDe(p);
  $('#tabBox').innerHTML=faltasHtml(p)+`<div class="card"><h2>Situação do polígono</h2><div class="seg" id="situ">${Object.entries(SITU).map(([k,v])=>`<button data-s="${k}" class="${si===k?'on':''}">${v.n}</button>`).join('')}</div>
  ${si==='detonado'?`<div class="row"><div><label>Data e hora da detonação</label><input id="detAt" type="datetime-local" value="${esc(p.detAt||'')}"></div></div>`:''}</div>
  ${bloco('pre','Antes do carregamento',CHK_PRE)}${bloco('fim','Fechamento do carregamento',CHK_FIM)}
  <p class="mut">O checklist é registro do que foi conferido em campo. Ele não substitui os procedimentos e liberações da mina.</p>`;
  document.querySelectorAll('#situ button').forEach(b=>b.onclick=()=>{
    const v=b.dataset.s;const pend=p.holes.filter(h=>h.status==='pendente').length;
    const ap=()=>{p.situ=v;markP(p.id);save();tabLiber(p);toast('Situação: '+SITU[v].n);};
    if(v!=='aberto'&&pend)confirmBox(`Ainda há ${nf(pend)} pendente(s). Marcar como "${SITU[v].n}" mesmo assim?`,ap,'Marcar');else ap();});
  if($('#detAt'))$('#detAt').onchange=e=>{p.detAt=e.target.value;markP(p.id);save();};
  document.querySelectorAll('#tabBox [data-fi]').forEach(b=>b.onclick=()=>editHole(+b.dataset.fi));
  document.querySelectorAll('#tabBox input[data-k]').forEach(c=>c.onchange=()=>{const k=c.dataset.k;p.check[k]=p.check[k]||{it:{}};p.check[k].it=p.check[k].it||{};p.check[k].it[c.dataset.i]=c.checked;markP(p.id);save();});
  document.querySelectorAll('[data-lib]').forEach(b=>b.onclick=()=>{const k=b.dataset.lib;const nm=$('#nm_'+k).value.trim();if(!nm){toast('Informe quem liberou');return;}
    const reg=()=>{p.check[k]=p.check[k]||{it:{}};p.check[k].nome=nm;p.check[k].ts=Date.now();
      if(k==='fim'&&situDe(p)==='aberto'&&!p.holes.some(h=>h.status==='pendente'))p.situ='carregado';markP(p.id);save();tabLiber(p);toast('Liberação registrada');};
    const tot=k==='fim'?faltas(p).reduce((s,g)=>s+g.hs.length,0):0;
    if(tot)confirmBox(`O fechamento ainda mostra ${tot} item(ns) faltando (veja no topo desta aba). Registrar a liberação mesmo assim?`,reg,'Registrar');else reg();});
}

/* ===== Resumo do carregamento para o WhatsApp (modelo do Rodrigo) ===== */
const diaDe=ts=>{if(!ts)return '';const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const maisDia=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return diaDe(d.getTime());};
const camWpp=c=>String(c||'').replace(/^\s*(UMB|UMT|UBT|CAM\.?|CAMINH[AÃ]O)\s*/i,'').trim()||'sem caminhão';
const detNome=t=>{const m=String(t||'').match(/(\d+)\s*m\b/i);return 'Detonadores '+(/DT5|ELETR/i.test(t)?'Eletrônicos':String(t).replace(/\s*\d+\s*m\b/i,'').trim())+(m?' '+m[1]+' mts':'');};
function wppDados(p,o){
  const carr=p.holes.filter(h=>h.status==='carregado'&&(o.escopo==='tudo'||diaDe(h.ts)===o.data));
  const nd=h=>(h.decks||[]).filter(d=>num(d.kg)>0).length;
  const decks={};carr.forEach(h=>{const n=Math.max(1,nd(h));decks[n]=(decks[n]||0)+1;});
  const det={};let booster=0,bags=0;const frota={};
  carr.forEach(h=>{booster+=num(h.booster)||0;if(h.detTipo&&num(h.detQtd))det[h.detTipo]=(det[h.detTipo]||0)+num(h.detQtd);bags+=Math.max(0,nd(h)-1);
    (h.decks||[]).forEach(d=>{const kg=num(d.kg);if(!kg)return;const c=camWpp(deckCam(h,d));frota[c]=frota[c]||{};const pr=d.prod||'';frota[c][pr]=(frota[c][pr]||0)+kg;});});
  return {carr,decks,det,booster,bags,frota};}
function wppTexto(p,o,D){
  const hr=new Date().getHours();const L=[];
  L.push((hr<12?'Bom dia':hr<18?'Boa tarde':'Boa noite')+' a todos!','','*Informações do carregamento*','');
  L.push('Data: '+brDate(o.data),'Mina: '+(p.mina||''),'Cava: '+(p.cava||''),'Polígono: '+(p.pol||''),'Banco: '+(p.banco||''),'Status: '+o.status,'Coordenadas: '+(o.coord||''),'Perfuratriz: '+(o.perf||''),'');
  const mx=Math.max(2,...Object.keys(D.decks).map(Number));
  for(let n=1;n<=mx;n++)L.push(`• *Furos de ${n} Deck${n>1?'s':''} ${D.decks[n]||0}*`);
  L.push(`• *Total de furos carregados ${o.escopo==='tudo'?'no polígono':'hoje'} ${D.carr.length}*`,'','*Consumo:*','');
  if(D.booster)L.push(`• ${fmt(D.booster)} ${o.boosterNome||'Booster'}`);
  Object.entries(D.det).forEach(([t,q])=>L.push(`• ${fmt(q)} ${(o.detNomes&&o.detNomes[t])||detNome(t)}`));
  const bg=num(o.bags);if(bg)L.push(`• ${fmt(bg)} Blastbags`);
  L.push('','*Frota utilizada:*','');
  Object.entries(D.frota).forEach(([c,ps])=>Object.entries(ps).forEach(([pr,kg])=>L.push(`• ${c} - ${fmt(kg)}kg ${pr}`.trim())));
  L.push('','Mina: '+(p.mina||''),'Operação: '+D.carr.length+' Furos','Impacto: '+(o.impacto||'Não'),'','*D+1:*','Data: '+brDate(o.d1data),'Mina: '+(o.d1mina||p.mina||''),'Operação: '+(o.d1op||''));
  return L.join('\n');}
function resumoWpp(p){
  const sv=p.wpp||{};const g=S.wppG||{};
  const o={data:today(),escopo:'dia',status:situDe(p)==='aberto'?'Carregando':situDe(p)==='carregado'?'Carregado':'Detonado',coord:sv.coord||'',perf:sv.perf||'',impacto:sv.impacto||'Não',

    ${dets.map((t,i)=>`<div class="row">${inp('wpT'+i,'Nome do '+esc(t),o.detNomes[t]||detNome(t))}</div>`).join('')}
    <div class="row"><div><label>D+1 data</label><input id="wp1d" type="date" value="${o.d1data}"></div>${inp('wp1m','D+1 mina',o.d1mina)}</div>
    <div class="row">${inp('wp1o','D+1 operação',o.d1op,'ex.: 125 Furos')}</div>

    <div class="btns"><button class="btn pri" id="wpW">Mandar no WhatsApp</button><button class="btn" id="wpCp">Copiar</button></div>`);
    const ler=()=>{o.data=$('#wpD').value||today();o.escopo=$('#wpE').value;o.status=$('#wpS').value;o.perf=$('#wpP').value.trim();o.coord=$('#wpC').value.trim();o.impacto=$('#wpI').value.trim();o.boosterNome=$('#wpB').value.trim();

let painelPer='7',painelMina='';

  const ps=S.polys.filter(p=>!painelMina||p.mina===painelMina);
  const R={furos:0,kg:0,prod:{},cam:{},booster:0,brinel:0,det:{},polys:new Set(),linhas:[]};

// lê os números azuis de um recorte da página e agrupa em rótulos de 1 ou 2 linhas (furo com 2 decks tem 2 tempos empilhados)

/* ===== Lançamento por voz ===== */
const NUMP={zero:0,um:1,uma:1,dois:2,duas:2,'três':3,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,quatorze:14,catorze:14,quinze:15,dezesseis:16,dezessete:17,dezoito:18,dezenove:19,vinte:20,meio:0.5,meia:0.5};

const VOZ_KW=[ // campo, palavras (exatas) e começos de palavra
  ['tampao',['tampao','tampoes','tampa','tampo'],['tampa']],
  ['booster',['booster','boosters','buster','busters','boster','bosters','bus'],['booste','buste']],
  ['brinel',['brinel','brinell','brineis','brinels'],['brinel']],
  ['detQtd',['detonador','detonadores','espoleta','espoletas','det'],['detonad','espolet']],
  ['profMed',['profundidade','prof','medida','medido','fundo','profundo','profundura'],['profund']],
  ['aguaM',['agua','aguas','lamina','coluna'],[]],
  ['kg',['carga','carreguei','carregou','coloquei','botei','emulsao','explosivo','total'],[]],

function vozNum(tk,i){ // lê número a partir do token i: "2,5" "2 vírgula 5" "dois e meio" "2 metros e meio"
  let t=tk[i];if(t==null)return null;let v=/^\d/.test(t)?num(t):null;if(v==null&&t in NUMP)v=NUMP[t];if(v==null)return null;let used=1;

  else if(tk[i+1]==='e'&&(tk[i+2]==='meio'||tk[i+2]==='meia')){v+=0.5;used=3;}
  else if(tk[i+1]==='meio'||(tk[i+1]==='meia'&&!/^\d/.test(tk[i+2]||''))){v+=0.5;used=2;}
  else if(VOZ_UN_M.has(tk[i+1])&&tk[i+2]==='e'&&(tk[i+3]==='meio'||tk[i+3]==='meia')){v+=0.5;used=4;}

function parseVoz(txt,camList){

  const soltos=[];

    if(campo){r[campo]=n.v;if(campo==='aguaM')r.agua='agua';}else soltos.push(n.v);

  return r;
}

const VOZ_NW=(()=>{const o={zero:0,um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,quatorze:14,catorze:14,quinze:15,dezesseis:16,dezasseis:16,dezessete:17,dezoito:18,dezenove:19,

function vozExtenso(tk){const out=[];

    let v=VOZ_NW[w],slot=vozSlot(v),j=i+1;
    if(w==='mil'){v=1000;slot=1000;}

async function vozOfflineIniciar(st,mostra){
  const model=await vozCarregarModelo();

  const AC=window.AudioContext||window.webkitAudioContext;const ctx=new AC();const src=ctx.createMediaStreamSource(stream);
  let semG=false;try{semG=localStorage.getItem('carregamento.vozGram')==='0';}catch(e){}

  const proc=ctx.createScriptProcessor(4096,1,1);proc.onaudioprocess=e=>{try{rec.acceptWaveform(e.inputBuffer);}catch(_){}};
  src.connect(proc);proc.connect(ctx.destination);

    const fim=()=>{try{proc.disconnect();src.disconnect();}catch(e){}stream.getTracks().forEach(t=>t.stop());try{ctx.close();}catch(e){}try{rec.remove();}catch(e){}ok();};

function idbOutroApp(nome,store){return new Promise(res=>{try{const r=indexedDB.open(nome);let novo=false;
  r.onupgradeneeded=e=>{novo=true;try{e.target.transaction.abort();}catch(_){}};
  r.onsuccess=()=>{const d=r.result;if(novo||!d.objectStoreNames.contains(store)){d.close();return res([]);}try{const q=d.transaction(store).objectStore(store).getAll();q.onsuccess=()=>{d.close();res(q.result||[]);};q.onerror=()=>{d.close();res([]);};}catch(e){d.close();res([]);}};
  r.onerror=()=>res([]);r.onblocked=()=>res([]);}catch(e){res([]);}});}
async function acharMedicoesApps(){
  const out=[];
  for(const [db,app,rot] of [['croqui-real','croqui-real','Medição Enaex'],['temporizacao','temporizacao','Temporização']]){
    (await idbOutroApp(db,'polys')).filter(P=>P&&!P.sample&&Array.isArray(P.holes)).forEach(P=>out.push({key:db,P,app,origem:rot,nome:P.nome||P.arquivo||'(sem nome)',n:P.holes.filter(h=>!h.ghost).length,data:P.upd?new Date(P.upd).toLocaleDateString('pt-BR'):''}));}
  acharMedicoes().forEach(m=>{if(!out.some(o=>o.P.id&&o.P.id===m.P.id))out.push(Object.assign(m,{origem:'neste celular'}));});
  return out.sort((a,b)=>(b.P.upd||0)-(a.P.upd||0));

function acharMedicoes(){
  const out=[];const visto=new Set();
  const busca=(o,key,d)=>{if(!o||typeof o!=='object'||d>4)return;
    if(Array.isArray(o.holes)&&o.holes.length&&o.holes.some(h=>h&&typeof h==='object'&&'x' in h&&'y' in h&&('n' in h||'tl' in h))){const id=key+'|'+(o.nome||o.id||out.length);if(!visto.has(id)){visto.add(id);out.push({key,P:o,nome:o.nome||o.pol||o.id||'(sem nome)',n:o.holes.filter(h=>!h.ghost).length,data:o.data||o.dt||''});}return;}
    (Array.isArray(o)?o:Object.values(o)).forEach(v=>busca(v,key,d+1));};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||k===KEY||k.startsWith('carregamento'))continue;const v=localStorage.getItem(k);if(!v||v[0]!=='{'&&v[0]!=='[')continue;try{busca(JSON.parse(v),k,0);}catch(e){}}}catch(e){}
  return out;
}

function camFuro(p,i,meu,voz){
  const h=p.holes[i],pr=projDe(p);const kp=kgProj(p,h);
  const meuD=(h.decks||[]).filter(d=>deckCam(h,d)===meu&&deckTemCarga(d));const outrosKg=holeKg(h)-kgDoCam(h,meu);const outrosC=camsDoFuro(h).filter(c=>c!==meu);

  ${outrosC.length&&outrosKg>0?`<div class="hint" style="margin:8px 0 0">Este furo já tem ${fmt(outrosKg)} kg do ${esc(outrosC.map(camCurto).join(' + '))}. O que você lançar aqui entra como outro deck, do ${esc(camCurto(meu))}.</div>`:''}

  <label>Observação</label><input id="cfO" value="${esc(h.obs||'')}">
  <div class="btns"><button class="btn ok" id="cfOk" style="font-size:18px;min-height:56px">✔ Carregado pelo ${esc(camCurto(meu))}</button></div>
  <div class="btns"><button class="btn" id="cfRe">Não deu para carregar (repasse)</button></div>`);

    if(st==='carregado')lancarCarga(h,meu,$('#cfP').value,k);

  $('#cfOk').onclick=()=>salva('carregado');$('#cfRe').onclick=()=>salva('repasse');
}

function filaFoto(pid,hid,ts){const y=SY();y.fq=y.fq||{};y.fq[pid+'|'+hid+'|'+ts]=1;save();}
async function enviarFotos(){
  const y=SY();if(!y.token||fotoEnviando||!y.fq)return;const ks=Object.keys(y.fq).slice(0,40);if(!ks.length)return;fotoEnviando=true;
  try{for(const k of ks){if(!SY().token)break;const [pid,hid,ts]=k.split('|');const arr=await fotoGet(pid+'|'+hid);const f=arr.find(x=>String(x.ts)===ts);if(!f){delete y.fq[k];continue;}

}
// todas as fotos deste celular que ainda não subiram (inclusive as tiradas antes de entrar na conta)
async function filaTodasFotos(){const d=await db();if(!d)return;const ks=await new Promise(res=>{try{const q=d.transaction('foto').objectStore('foto').getAllKeys();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([]);}catch(e){res([]);}});
  const y=SY();y.fq=y.fq||{};for(const k of ks){const arr=await fotoGet(k);arr.forEach(f=>{if(!f.nuvem)y.fq[k+'|'+f.ts]=1;});}save();}

let croquiOcupado=false;
async function nuvemCroquis(){const y=SY();if(!y.token||croquiOcupado||y.croquiOff)return;croquiOcupado=true;y.bq=y.bq||{};y.bgv=y.bgv||{};
  try{for(const pid of Object.keys(y.bq)){const p=S.polys.find(x=>x.id===pid);const url=p&&p.bg?await bgGet(pid):null;if(!url){delete y.bq[pid];continue;}
      const v=y.bq[pid];const r=await api({acao:'croqui_enviar',token:y.token,poly_id:pid,v,img:url.split(',')[1]});
      if(r&&r.ok){if(y.bq[pid]===v)delete y.bq[pid];if(p.bg){p.bg.v=v;y.bgv[pid]=v;markP(pid);}}}
    for(const p of S.polys){if(!p.bg||!p.bg.v||y.bgv[p.id]===p.bg.v||y.bq[p.id])continue;
      const r=await api({acao:'croqui_url',token:y.token,poly_id:p.id});if(!r||!r.url)continue;
      const b=await (await fetch(r.url)).blob();const url=await new Promise((ok,er)=>{const f=new FileReader();f.onload=()=>ok(f.result);f.onerror=er;f.readAsDataURL(b);});
      if(await bgPut(p.id,url,true)){y.bgv[p.id]=p.bg.v;if(view==='poly'&&S.cur===p.id&&$('#sheet').classList.contains('hidden'))renderPoly();}}
    save();}
  catch(e){if(/desconhecida/i.test(e.message||''))y.croquiOff=true;console.error(e);}finally{croquiOcupado=false;}}
async function nuvemArquivos(){await nuvemCroquis();await enviarFotos();}
async function listarFotos(pid,forca){
  const y=SY();if(!y.token||y.fotoOff)return[];const c=fotosRem[pid];if(c&&!forca&&Date.now()-c.t<5*60e3)return c.l;
  try{const r=await api({acao:'foto_listar',token:y.token,poly_id:pid});fotosRem[pid]={t:Date.now(),l:r.fotos||[]};return fotosRem[pid].l;}catch(e){return c?c.l:[];}
}

    <div id="hDif" class="mut"></div>

    <div class="row"><div><label>Booster (un)</label><input id="hBo" inputmode="numeric" value="${f.booster??''}"></div><div><label>Brinel (un)</label><input id="hBr" inputmode="numeric" value="${f.brinel??''}"></div></div>

 <div class="row"><div><label>Tempo de detonação (ms)</label><input id="hTz" inputmode="decimal" value="${f.tempos&&f.tempos.length>1?f.tempos.join(';'):(f.tempo??'')}" placeholder="do plano"></div><div></div></div>
