    <label>Fotos (ficam só neste celular)</label><div class="thumbs" id="hFt"></div><button class="btn sm" id="hFoto" style="margin-top:6px">📷 Adicionar foto</button>
    ${p.situ==='detonado'?'<div class="hint">⚠️ Este polígono está marcado como detonado.</div>':''}
    <div class="btns"><button class="btn" id="hUsePj">Usar carga do projeto</button><button class="btn" id="hRep">Repetir último</button><button class="btn" id="hNear">+ Furo ao lado</button>${ehExtra(h)?'<button class="btn" id="hMov">Mover no croqui</button><button class="btn bad" id="hDelX">Excluir furo extra</button>':''}</div>

    bind();showDif();showPj();fotosFuro(p,h);
  };
  const grab=()=>{
    f.profProj=num($('#hPP').value);f.profMed=num($('#hPM').value);
    if($('#hAM'))f.aguaM=num($('#hAM').value);
    f.decks.forEach((d,k)=>{d.prod=document.querySelector(`[data-dp="${k}"]`).value;d.kg=num(document.querySelector(`[data-dk="${k}"]`).value);const c=document.querySelector(`[data-dc="${k}"]`);if(c){if(c.value)d.cam=c.value;else delete d.cam;}});
    f.booster=num($('#hBo').value);f.brinel=num($('#hBr').value);f.detTipo=$('#hDT').value;f.detQtd=num($('#hDQ').value);
    f.tampao=num($('#hTa').value);f.caminhao=$('#hCa').value;f.obs=$('#hOb').value.trim();f.cargaProj=num($('#hCP').value);{const l={prod:$('#hLp').value.trim(),booster:$('#hLb').value.trim(),det:$('#hLd').value.trim()};f.lotes=Object.values(l).some(Boolean)?l:null;}{const ts=$('#hTz').value.split(/[;\/]/).map(num).filter(v=>v!=null);f.tempo=ts.length?ts[0]:null;f.tempos=ts.length>1?ts:null;}
  };
  const showPj=()=>{const el=$('#hPj');if(!el)return;const pr=projDe(p);const tmp=Object.assign({},h,{decks:f.decks.map((d,k)=>({prod:d.prod,kg:num((document.querySelector(`[data-dk="${k}"]`)||{}).value)})),status:f.status,cargaProj:num(($('#hCP')||{}).value)});
    const kp=kgProj(p,tmp);if(kp==null&&pr.tampao==null&&pr.booster==null){el.style.display='none';return;}el.style.display='';
    const dv=desvio(p,tmp);const ke=holeKg(tmp);
    el.innerHTML=`<b>Projeto:</b> ${kp!=null?fmt(kp)+' kg':'—'}${pr.prod?' '+esc(pr.prod):''}${pr.decks>1?' · '+pr.decks+' decks':''}${pr.tampao!=null?' · tampão '+fmt(pr.tampao,1)+' m':''}${pr.booster!=null?' · '+pr.booster+' booster':''}${pr.detQtd?' · '+pr.detQtd+' '+esc(pr.detTipo||'det.'):''}<br><b>Executado:</b> ${ke?fmt(ke)+' kg':'—'} ${ke&&kp!=null?`<span class="chip" style="background:${DV[dv.c].c}">${dv.t}</span>`:''}`;};
  const showDif=()=>{const pp=num($('#hPP').value),pm=num($('#hPM').value);const el=$('#hDif');if(pp!=null&&pm!=null){const d=pm-pp;el.innerHTML=`Diferença: <b style="color:${d<-0.5?'var(--bad)':d>0.5?'var(--warn)':'var(--ok)'}">${d>0?'+':''}${fmt(d,1)} m</b>${d<-0.5?' — abaixo do projeto (avaliar repasse)':''}`;}else el.textContent='';};
  const bind=()=>{
    $('#hClose').onclick=()=>{closeSheet();sel=null;};
    $('#hVoz').onclick=()=>{grab();vozOuvir(t=>{const r=parseVoz(t,[...new Set([...CAMS,...camsPoly(p)])]);delete r.furo;aplicaVoz(p,f,r);draw();toast(`Ouvi: "${t}"`);});};
    document.querySelectorAll('.stbtns button').forEach(b=>b.onclick=()=>{grab();f.status=b.dataset.s;draw();});
    document.querySelectorAll('#hAg button').forEach(b=>b.onclick=()=>{grab();f.agua=b.dataset.a;draw();});
    document.querySelectorAll('#hCo button').forEach(b=>b.onclick=()=>{grab();const c=b.dataset.c;f.cond=(f.cond||[]).includes(c)?f.cond.filter(x=>x!==c):[...(f.cond||[]),c];draw();});
    document.querySelectorAll('#hND button').forEach(b=>b.onclick=()=>{grab();const n=+b.dataset.n;while(f.decks.length<n)f.decks.push({prod:f.decks[0]?.prod||'',kg:''});f.decks.length=n;draw();});

    $('#hUsePj').onclick=()=>{const pr=projDe(p);const kp=kgProj(p,Object.assign({},h,{cargaProj:num($('#hCP').value)}));if(kp==null){toast('Defina o projeto no menu ⋯ do polígono');return;}grab();
      const n=pr.decks||1;f.decks=Array.from({length:n},()=>({prod:pr.prod,kg:Math.round(kp/n*10)/10}));if(pr.booster!=null)f.booster=pr.booster;if(pr.tampao!=null)f.tampao=pr.tampao;if(pr.detTipo)f.detTipo=pr.detTipo;if(pr.detQtd!=null)f.detQtd=pr.detQtd;if(f.status==='pendente')f.status='carregado';draw();toast('Preenchido com o projeto — ajuste se o real foi diferente');};

    if($('#hDelX'))$('#hDelX').onclick=()=>confirmBox('Excluir o furo extra '+h.id+'?',()=>{const j=p.holes.indexOf(h);if(j>=0)p.holes.splice(j,1);delete SY().df[FK(p.id,h.id)];markP(p.id);save();closeSheet();renderPoly();toast('Furo '+h.id+' excluído');},'Excluir');
    $('#hSave').onclick=()=>{grab();commit(false);};

  };
  const commit=next=>{
    if(f.status==='pendente'&&f.decks.some(d=>num(d.kg)>0))f.status='carregado';
    f.decks=f.decks.filter(d=>d.prod||num(d.kg));
    f.ts=Date.now();f.por=meuNome();const tzMudou=h.tempo!==f.tempo||JSON.stringify(h.tempos||null)!==JSON.stringify(f.tempos||null)||h.cargaProj!==f.cargaProj;pushUndo(p,[h],'furo '+h.id);delete f.hist;normCams(f);const camAntes=camsPoly(p).filter(c=>camFora(p,c));Object.assign(h,f);carimbaLotes(p,h);histAdd(h,resumoFuro(h));markF(p.id,h.id);if(tzMudou)markP(p.id);
    if(f.status==='carregado')S.last=Object.assign(S.last||{},{furo:{decks:f.decks,booster:f.booster,brinel:f.brinel,detTipo:f.detTipo,detQtd:f.detQtd,tampao:f.tampao,caminhao:f.caminhao}});

      renderPoly();if(j<0){closeSheet();toast('Todos os furos lançados');}else editHole(j);}
    else{closeSheet();renderPoly();}
  };
  draw();
}

/* ----- Planilha de carregamento no MODELO da Enaex (PC_US-VGR … Repump.xlsx) ----- */

// continuam iguais) e só escreve nas células de digitação: cabeçalho de CARREG.1/2/3, linhas dos furos e o topo do CHECK LIST.
// As fórmulas do modelo (carga programada, massa, RC…) são do próprio modelo; o app não calcula nada.
let zipP=null;
function loadZip(){return zipP||(zipP=(async()=>{if(!window.JSZip)await loadScript(['lib/jszip.min.js','https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js']);return window.JSZip;})().catch(e=>{zipP=null;throw e;}));}
const MOD_KEY='modeloPlanilha';
const MOD_ABAS=['CARREG.1','CARREG.2','CARREG.3'];
const MOD_COL={id:'A',prof:'B',k1:'D',k2:'E',k3:'F',tampao:'G',tampProj:'H',deck1:'I',deck2:'J',obs:'K'};
const MOD_HDR={pol:'D2',banco:'D3',lito:'F3',expl:'H3',diam:'D4',alt:'F4',dens:'H4',mina:'B5',cava:'B6',afast:'D5',espac:'D6',operador:'J8',auxiliar:'J9'};
const MOD_CHK={data:'C3',umb:'E3',operador:'G3'};
const xlSerial=s=>{const [y,m,d]=String(s||today()).split('-').map(Number);return (Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/864e5;};
const xlDeSerial=n=>{const d=new Date(Date.UTC(1899,11,30)+Math.round(n)*864e5);return d.toISOString().slice(0,10);};
async function modeloObter(){
  const v=await bgGet(MOD_KEY);if(v&&v.buf)return v;
  try{const r=await fetch('lib/modelo-carregamento.xlsx',{cache:'no-cache'});if(r.ok){const buf=await r.arrayBuffer();return {nome:'modelo do site',buf,t:0,site:true};}}catch(e){}
  return null;
}
async function modeloEscolher(){
  const f=await pickFile('.xlsx');if(!f)return null;
  try{busy('Conferindo o modelo…');const buf=await readBuf(f);const X=await loadXlsx();const wb=X.read(buf,{type:'array',bookSheets:true});busy();
    if(!MOD_ABAS.some(n=>wb.SheetNames.includes(n))){toast('Este arquivo não tem as abas CARREG.1/2/3 do modelo');return null;}
    const v={nome:f.name,buf,t:Date.now()};await bgPut(MOD_KEY,v,true);toast('Modelo guardado neste aparelho');return v;
  }catch(e){busy();toast('Não consegui ler esse arquivo');return null;}
}
// listas da aba PARÂMETRO (litologia, explosivo, diâmetro, operadores…), pelo título da coluna
async function modeloListas(m){
  if(m._listas)return m._listas;const X=await loadXlsx();const wb=X.read(m.buf,{type:'array',sheets:['PARÂMETRO','CHECK LIST']});
  const L={lito:[],expl:[],diam:[],oper:[],aux:[],umb:[],mina:[],cava:[]};const sh=wb.Sheets['PARÂMETRO'];
  if(sh){const rows=X.utils.sheet_to_json(sh,{header:1,raw:true,defval:null});const hi=rows.findIndex(r=>r&&r.some(v=>/TIPO DE ROCHA|DIÂMETRO/i.test(String(v||''))));
    if(hi>=0){const H=rows[hi].map(v=>String(v||'').trim().toUpperCase());const col=re=>H.findIndex(h=>re.test(h));
      const pega=(k,re)=>{const c=col(re);if(c<0)return;rows.slice(hi+1).forEach(r=>{const v=r&&r[c];if(v!=null&&String(v).trim()!==''&&!L[k].some(x=>String(x)===String(v)))L[k].push(v);});};
      pega('lito',/^TIPO DE ROCHA/);pega('expl',/^EXPLOSIVO 2$/);if(!L.expl.length)pega('expl',/^EXPLOSIVO$/);pega('diam',/^DIÂMETRO/);pega('oper',/^OPERADORES/);pega('aux',/^AUXILIARES/);pega('umb',/^TAG$/);pega('mina',/^MINA$/);pega('cava',/^CAVA$/);}}
  const ck=wb.Sheets['CHECK LIST'];L.dataModelo=ck&&ck.C3&&typeof ck.C3.v==='number'?xlDeSerial(ck.C3.v):null;
  return m._listas=L;
}
// furos que vão para a planilha: do caminhão escolhido (na ordem em que foram lançados) ou todos
function modFuros(p,cam){
  if(!cam)return p.holes.slice();
  return p.holes.filter(h=>camsDoFuro(h).includes(cam)&&(h.decks||[]).some(d=>deckCam(h,d)===cam&&deckTemCarga(d))).sort((a,b)=>(a.ts||0)-(b.ts||0));
}
const modKgs=(h,cam)=>(h.decks||[]).filter(d=>deckTemCarga(d)&&(!cam||deckCam(h,d)===cam)).slice(0,3).map(d=>num(d.kg));
const modProd=(p,cam)=>{const c={};p.holes.forEach(h=>(h.decks||[]).forEach(d=>{if(d.prod&&(!cam||deckCam(h,d)===cam))c[d.prod]=(c[d.prod]||0)+1;}));return Object.keys(c).sort((a,b)=>c[b]-c[a])[0]||projDe(p).prod||'';};
const modCasa=(lista,v)=>{if(v==null||v==='')return '';const t=String(v).toLowerCase();return lista.find(x=>String(x).toLowerCase()===t)??lista.find(x=>String(x).toLowerCase().startsWith(t)||t.startsWith(String(x).toLowerCase()))??v;};

// volta: lê todas as abas CARREG.n do modelo (preenchido no Excel, por uma ou várias pessoas) e devolve o que cada furo tem lá.

// acha o furo do app pelo nº da planilha: igual, ou só o número (123 = C123 = M0123), se só um furo tiver esse número
function furoMap(holes){const ex=new Map(),nu=new Map();
  holes.forEach(h=>{const id=String(h.id).toUpperCase();ex.set(id,h);const m=id.match(/^[A-Z]*0*(\d+)$/);if(m){const k=m[1];nu.set(k,nu.has(k)?null:h);}});

function planLerModelo(p,X,wb,forcar){
  let mi={};try{const cp=wb.Custprops||{};if(cp.carreg_info)mi=JSON.parse(cp.carreg_info);}catch(e){}
  const tx=v=>v==null?'':String(v).trim();const normPol=v=>tx(v).toUpperCase().replace(/^POL\.?\s*/,'');
  const ck=wb.Sheets['CHECK LIST'];const camCk=tx(ck&&ck[MOD_CHK.umb]&&ck[MOD_CHK.umb].v);
  const abas=wb.SheetNames.filter(ehCarreg).sort(ordCarreg);
  const cel=(s,r)=>{const c=s[r];return c?c.v:null;};
  // caminhão de cada aba: o que está escrito na UMB do cabeçalho; senão o que o app gravou; senão o do CHECK LIST
  const camDe=n=>{const v=tx(cel(wb.Sheets[n],MOD_UMB));if(v)return v;if(mi.cams&&n in mi.cams)return mi.cams[n]||'';if(mi.app)return mi.cam||'';return camCk;};
  const temFuro=n=>{const s=wb.Sheets[n];for(let r=11;r<=60;r++)if(cel(s,MOD_COL.id+r)!=null)return true;return false;};
  const polDe=n=>tx(cel(wb.Sheets[n],MOD_HDR.pol));
  const nFur=n=>{const s=wb.Sheets[n];let k=0;const rg=X.utils.decode_range(s['!ref']||'A1:K11');for(let r=11;r<=rg.e.r+1;r++){const v=cel(s,MOD_COL.id+r);if(v!=null&&tx(v)!==''&&tx(v)!=='0')k++;}return k;};
  let minhas=abas.filter(n=>mi.abas&&n in mi.abas?mi.abas[n]===p.id:normPol(cel(wb.Sheets[n],MOD_HDR.pol))===normPol(p.pol));

  abas.forEach(n=>{if(!minhas.includes(n)&&mi.abas&&!(n in mi.abas)&&normPol(cel(wb.Sheets[n],MOD_HDR.pol))===normPol(p.pol))minhas.push(n);});
  const info={poly_id:p.id,pol:p.pol,mina:p.mina};
  if(!minhas.length){const n1=abas.find(temFuro)||abas[0];minhas=n1?[n1]:[];
    const pid=mi.abas&&n1&&mi.abas[n1];const q=pid&&S.polys.find(x=>x.id===pid);info.poly_id=pid||'?';info.pol=q?q.pol:tx(cel(wb.Sheets[n1]||{},MOD_HDR.pol))||'?';info.mina=q?q.mina:'';
    info.pols=[...new Set(abas.filter(temFuro).map(n=>tx(cel(wb.Sheets[n],MOD_HDR.pol))).filter(Boolean))];}
  info.opc=abas.map(n=>({n,pol:polDe(n),k:nFur(n)})).filter(o=>o.k);info.abasAuto=minhas.slice();
  if(forcar&&forcar.length){minhas=forcar.filter(n=>abas.includes(n));info.forcar=minhas;}
  const byIdF=furoMap(p.holes),byId={get:byIdF};const naoAchou=[];
  const work=new Map();// furo -> {nv, decks, caminhao}
  minhas.forEach(n=>{const s=wb.Sheets[n];const cam=camDe(n);const prodH=tx(cel(s,MOD_HDR.expl));const prodApp=prodH?modCasa(PRODUTOS,prodH.split(/\s/)[0]):'';
    const rg=X.utils.decode_range(s['!ref']||'A1:K11');
    const sn=mi.snap&&mi.snap[n];
    for(let r=11;r<=rg.e.r+1;r++){const id=tx(cel(s,MOD_COL.id+r));if(!id)continue;const h=byId.get(id.toUpperCase());if(!h){if(!naoAchou.includes(id))naoAchou.push(id);continue;}
      // linha que ninguém mexeu desde que o app gerou a planilha: não volta (assim uma cópia velha não desfaz o que outro caminhão lançou depois)
      if(sn&&sn[id.toUpperCase()]!=null&&sn[id.toUpperCase()]===modSig(cel(s,MOD_COL.prof+r),['k1','k2','k3'].map(k=>cel(s,MOD_COL[k]+r)),cel(s,MOD_COL.tampao+r),cel(s,MOD_COL.obs+r)))continue;
      let w=work.get(h);if(!w){w={nv:{},decks:(h.decks||[]).map(d=>Object.assign({},d)),caminhao:h.caminhao,vezes:0};work.set(h,w);}
      const prim=!w.vezes++;
      const pf=num(cel(s,MOD_COL.prof+r));if(pf!=null||prim){if(!(h.profMed==null&&(pf==null||pf===num(h.profProj))))w.nv.profMed=pf;}
      const ta=num(cel(s,MOD_COL.tampao+r));if(ta!=null||prim)w.nv.tampao=ta;
      const ob=tx(cel(s,MOD_COL.obs+r));if(ob||prim)w.nv.obs=ob;
      const kgs=['k1','k2','k3'].map(k=>num(cel(s,MOD_COL[k]+r)));
      const dk=w.decks;
      if(cam){const meus=dk.filter(d=>deckTemCarga(d)&&deckCam(w,d)===cam);dk.forEach(d=>{if(deckTemCarga(d))d.cam=deckCam(w,d);});
        const novos=kgs.map((kg,j)=>kg?{prod:(meus[j]&&meus[j].prod)||prodApp||(meus[0]&&meus[0].prod)||'',kg,cam}:null).filter(Boolean);
        // troca os decks deste caminhão no mesmo lugar (a ordem dos decks do furo não muda)
        let k=0;const decks=[];dk.forEach(d=>{if(!deckTemCarga(d))return;if(d.cam===cam){if(k<novos.length)decks.push(novos[k++]);}else decks.push(d);});

      else{const nd=kgs.map((kg,j)=>kg?Object.assign({},dk[j]||{},{prod:(dk[j]&&dk[j].prod)||prodApp,kg}):null).filter(Boolean);
        const tmp=normCams({caminhao:w.caminhao,decks:nd});w.decks=tmp.decks;w.caminhao=tmp.caminhao;}
    }});
  const linhas=[];
  work.forEach((w,h)=>{const nv=w.nv;nv.decks=w.decks.map(d=>{const o={prod:d.prod||'',kg:d.kg};if(d.cam&&d.cam!==w.caminhao)o.cam=d.cam;return o;});
    if((w.caminhao||'')!==(h.caminhao||''))nv.caminhao=w.caminhao;linhas.push({h,nv});});
  return {info,linhas,naoAchou};
}
// lê a planilha e devolve, por furo, os valores dela (nv) — usado na importação manual e no acompanhamento automático
function planLer(p,X,wb,forcar){
  if(MOD_ABAS.some(n=>wb.Sheets[n]))return planLerModelo(p,X,wb,forcar);
  const info={};if(wb.Sheets.Info)X.utils.sheet_to_json(wb.Sheets.Info,{header:1}).forEach(r=>info[r[0]]=r[1]);
  const sh=wb.Sheets.Carregamento||wb.Sheets[wb.SheetNames[0]];const rows=X.utils.sheet_to_json(sh,{header:1,raw:true,defval:null});
  const hi=rows.findIndex(r=>r&&r.some(v=>String(v||'').trim().toLowerCase()==='furo'));if(hi<0)throw new Error('Não achei a coluna "Furo" na planilha');
  const head=rows[hi].map(v=>String(v||'').trim().toLowerCase());const ci={};PL_COLS.forEach(([t,k])=>{const i=head.indexOf(t.toLowerCase());if(i>=0)ci[k]=i;});
  const byId={get:furoMap(p.holes)};const linhas=[],naoAchou=[];
  const tx=v=>v==null?'':String(v).trim();
  rows.slice(hi+1).forEach(r=>{if(!r)return;const id=tx(r[ci.id]);if(!id)return;const h=byId.get(id.toUpperCase());if(!h){naoAchou.push(id);return;}
    const g=k=>ci[k]!=null?r[ci[k]]:undefined;const nv={};
    if(g('status')!==undefined){const st=stDeNome(g('status'));if(st)nv.status=st;}
    ['profMed','aguaM','booster','brinel','detQtd','tampao'].forEach(k=>{if(g(k)!==undefined)nv[k]=num(g(k));});
    if(g('agua')!==undefined){const a=aguaDeNome(g('agua'));if(a)nv.agua=a;}
    if(g('detTipo')!==undefined)nv.detTipo=tx(g('detTipo'));if(g('caminhao')!==undefined)nv.caminhao=tx(g('caminhao'));if(g('obs')!==undefined)nv.obs=tx(g('obs'));
    if(g('cond')!==undefined)nv.cond=tx(g('cond')).split(/[,;\/]/).map(v=>v.trim()).filter(Boolean);
    if(ci.lp!=null||ci.lb!=null||ci.ld!=null){const l={prod:tx(g('lp')),booster:tx(g('lb')),det:tx(g('ld'))};nv.lotes=Object.values(l).some(Boolean)?l:null;}
    if(ci.k1!=null||ci.p1!=null){const temC=ci.c1!=null;nv.decks=[1,2,3].map(n=>{const d={prod:tx(g('p'+n)),kg:num(g('k'+n))};const c=temC?tx(g('c'+n)):((h.decks||[])[n-1]||{}).cam;if(c)d.cam=c;return d;}).filter(d=>d.prod||d.kg);
      const hc=nv.caminhao!==undefined?nv.caminhao:h.caminhao;const tmp=normCams({caminhao:hc,decks:nv.decks});nv.decks=tmp.decks;if(tmp.caminhao!==hc)nv.caminhao=tmp.caminhao;}
    if(g('tempo')!==undefined){const ts=String(g('tempo')??'').split(/[\/;]/).map(num).filter(v=>v!=null);nv.tempo=ts.length?ts[0]:null;nv.tempos=ts.length>1?ts:null;}
    linhas.push({h,nv});});
  return {info,linhas,naoAchou};
}
// forma comparável de cada campo (app x planilha)
function planCmp(k,v){if(k==='decks')return JSON.stringify((v||[]).map(d=>({prod:d.prod||'',kg:num(d.kg),cam:d.cam||''})));if(k==='cond')return JSON.stringify(v||[]);if(['tempos','lotes'].includes(k))return JSON.stringify(v||null);return v==null?'':String(v);}
// o que a planilha muda no furo (só nos campos "ks", se informados)
function planMud(h,nv,ks){const sub={};(ks||Object.keys(nv)).forEach(k=>{if(k in nv)sub[k]=nv[k];});
  const dif=Object.keys(sub).filter(k=>planCmp(k,h[k])!==planCmp(k,sub[k]));if(!dif.length)return null;
  Object.keys(sub).forEach(k=>{if(!dif.includes(k))delete sub[k];});
  // furo pendente que ganhou carga/caminhão na planilha vira carregado
  if((sub.status||h.status)==='pendente'&&((sub.decks&&sub.decks.some(d=>d.kg))||(sub.caminhao&&!h.caminhao)))sub.status='carregado';
  return {h,nv:sub,dif};}

async function planWTick(pid,forcar){const w=planW[pid];if(!w||w.lendo)return;if(document.hidden&&!forcar)return;
  const p=S.polys.find(x=>x.id===pid);if(!p){planWStop(pid);return;}
  w.lendo=true;try{
    let f;try{f=await w.fh.getFile();}catch(e){if(e&&e.name==='NotAllowedError'){w.erro='sem permissão';planWStop(pid,true);planWBarra();return;}w.erro='arquivo não encontrado';planWBarra();return;}
    if(f.lastModified===w.last&&!forcar){if(w.erro){w.erro=null;planWBarra();}return;}
    let r;try{const X=await loadXlsx();const wb=X.read(await f.arrayBuffer(),{type:'array',cellDates:true});r={f,...planLer(p,X,wb)};}catch(e){w.erro='não consegui ler (o Excel ainda está salvando?)';planWBarra();return;} // tenta de novo no próximo ciclo
    w.erro=null;const mud=[];
    r.linhas.forEach(({h,nv})=>{const ant=w.snap[String(h.id).toUpperCase()]||{};const ks=Object.keys(nv).filter(k=>ant[k]!==planCmp(k,nv[k]));if(!ks.length)return;const m=planMud(h,nv,ks);if(m)mud.push(m);});
    w.last=f.lastModified;w.snap=planSnap(r.linhas);w.lido=Date.now();
    if(mud.length){planAplicar(p,mud,'planilha acompanhada');w.ult={n:mud.length,ids:mud.map(m=>m.h.id),t:Date.now()};
      planFlash={ids:new Set(mud.map(m=>String(m.h.id))),ate:Date.now()+9000};if(corPor!=='caminhao')setCorPor('caminhao');
      const ids=mud.slice(0,5).map(m=>m.h.id).join(', ')+(mud.length>5?'…':'');toast(`📗 Planilha: ${mud.length} furo(s) atualizados (${ids})`,3500);
      if(S.cur===pid&&view==='poly'&&$('#sheet').classList.contains('hidden'))renderPoly();else planWBarra();}
    else planWBarra();
    planWGuardar(pid);
  }finally{if(planW[pid])planW[pid].lendo=false;}
}

/* ----- Resumo ----- */
function resumo(p,dia){
  const hs=dia?p.holes.filter(h=>dayOf(h.ts)===dia):p.holes;
  const r={total:p.holes.length,st:{},prod:{},det:{},cam:{},booster:0,brinel:0,agua:0,pm:[],pp:[],metros:0,abaixo:0};
  Object.keys(ST).forEach(k=>r.st[k]=0);
  hs.forEach(h=>{r.st[h.status]++;if(h.agua!=='seca')r.agua++;
    if(h.profMed!=null){r.pm.push(h.profMed);r.metros+=h.profMed;if(h.profProj!=null&&h.profMed<h.profProj-0.5)r.abaixo++;}
    if(h.profProj!=null)r.pp.push(h.profProj);
    if(h.status==='carregado'||holeKg(h)>0){
      h.decks.forEach(d=>{const kg=num(d.kg)||0;if(!kg)return;const pr=d.prod||'Sem produto';r.prod[pr]=(r.prod[pr]||0)+kg;const c=deckCam(h,d)||'Sem caminhão';r.cam[c]=r.cam[c]||{};r.cam[c][pr]=(r.cam[c][pr]||0)+kg;});
      r.booster+=num(h.booster)||0;r.brinel+=num(h.brinel)||0;if(h.detTipo&&h.detQtd)r.det[h.detTipo]=(r.det[h.detTipo]||0)+h.detQtd;}
  });
  r.lancados=hs.length;r.kg=Object.values(r.prod).reduce((a,b)=>a+b,0);
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;r.pmMed=avg(r.pm);r.ppMed=avg(r.pp);
  return r;
}

      const ac=acessRows(p,r);if(ac.length){titulo('Acessórios: paiol x aplicado');tabela([['Item',50],['Retirado',25,'r'],['Aplicado',25,'r'],['Devolvido',25,'r'],['Saldo',25,'r']],ac.map(a=>Object.assign([a.n,fmt(a.ret),fmt(a.apl),fmt(a.dev),a.saldo==null?'':fmt(a.saldo)],{cor:{4:a.saldo==null?null:a.saldo===0?'#2b8a3e':'#c92a2a'}})));}
    }
    cams.forEach((c,ix)=>{
      if(todos||ix)novaPag();
      const d=(p.cams||{})[c]||{};const nfv=d.nf??(p.nfs||{})[c];const df=camDif(p,c,kgL(c));const sai=num(d.kgNF)!=null?num(d.kgNF)-(num(d.kgRet)||0):null;
      titulo(c,camCor(c));
      const campos=[['NF',nfv],['kg na NF / balança',fmt(num(d.kgNF))],['kg de retorno / sobra',fmt(num(d.kgRet))],['Saída do caminhão (NF - retorno)',sai!=null?fmt(sai)+' kg':''],['Lançado nos furos',fmt(kgL(c))+' kg'],['Diferença lançado x saída',df?df.txt+(df.ok?' – dentro da tolerância':' – FORA da tolerância'):'informe o kg da NF'],
        ['Densidade do copo (g/cm³)',d.dens!=null?fmt(num(d.dens),2):''],['Temperatura (°C)',d.temp!=null?fmt(num(d.temp),1):''],['Operador',d.oper],['Início',d.ini],['Fim',d.fim],['Por produto',Object.entries(r.cam[c]||{}).map(([pr,k])=>`${pr} ${fmt(k)} kg`).join(' · ')]];
      tabela([['Campo',70],['Valor',W-2*M-70]],campos.map(([a,b],i)=>Object.assign([a,b],{cor:i===5&&df?{1:df.ok?'#2b8a3e':'#c92a2a'}:null})),{fs:9.5});
      const fur=furosDe(c);titulo(`Furos carregados pelo ${c} (${fur.length})`);
      const rows=[];fur.forEach(h=>{(h.decks||[]).forEach((dk,k)=>{if(deckCam(h,dk)!==c||!deckTemCarga(dk))return;const outros=camsDoFuro(h).filter(x=>x!==c);
        rows.push([h.id,`Deck ${k+1}/${h.decks.length}`,dk.prod,fmt(num(dk.kg)),ST[h.status].n,h.profMed!=null?fmt(h.profMed,1):'',h.tampao!=null?fmt(h.tampao,1):'',outros.map(camCurto).join(' + ')]);});
        if(!(h.decks||[]).some(dk=>deckCam(h,dk)===c&&deckTemCarga(dk)))rows.push([h.id,'','','',ST[h.status].n,h.profMed!=null?fmt(h.profMed,1):'',h.tampao!=null?fmt(h.tampao,1):'','']);});
      rows.push(Object.assign(['TOTAL','','',fmt(kgL(c)),'','','',''],{bold:true}));
      tabela([['Furo',22],['Deck',20],['Produto',30],['kg',18,'r'],['Status',26],['Prof. (m)',18,'r'],['Tampão',16,'r'],['Outro caminhão no furo',W-2*M-150]],rows);
      precisa(24);y+=12;doc.setDrawColor(120);[[M,'Operador do caminhão'],[M+(W-2*M)/2+4,'Blaster / responsável']].forEach(([x,t])=>{doc.line(x,y,x+(W-2*M)/2-8,y);doc.setFontSize(8);doc.text(t,x,y+4);});y+=8;
    });
    const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(7);doc.setTextColor(120);doc.text(`Carregamento de Campo · POL ${p.pol} · gerado em ${new Date().toLocaleString('pt-BR')} · página ${i}/${n}`,M,H-6);}
    doc.setProperties({title:`Caminhões POL ${p.pol}`});
    const blob=doc.output('blob');busy();
    await entregarArquivo(blob,`caminhoes-POL${p.pol}-${cams.length===1&&!todos?camCurto(cams[0])+'-':''}${p.data||today()}.pdf`,'application/pdf');
  }catch(e){busy();console.error(e);toast(/internet|carregar/i.test(e&&e.message||'')?'Não consegui abrir o gerador de PDF. Abra o app uma vez com internet.':'Não consegui gerar o PDF');}
}

/* ----- Relatório ----- */
let relModo='acum';
function relatorio(p,modo){
  const r=resumo(p),hj=resumo(p,today());
  const L=[];
  L.push(`📍 *CARREGAMENTO – POL ${p.pol}*`);
  L.push(`📅 Data: ${brDate(p.data)}`);
  L.push(`⛏️ Mina: ${p.mina}${p.cava?' | Cava: '+p.cava:''}${p.banco?' | Banco: '+p.banco:''}`);
  if(p.resp)L.push(`👷 Responsável: ${p.resp}`);
  L.push(`🚦 Situação: ${SITU[situDe(p)].n}`);
  L.push('');
  L.push(`🕳️ Furos: ${r.total} | Carregados: ${r.st.carregado} | Pendentes: ${r.st.pendente}`);
  if(r.st.repasse||r.st.perdido)L.push(`🔁 Repasse: ${r.st.repasse} | Perdidos: ${r.st.perdido}`);
  if(r.st.nao)L.push(`🚫 Não carregar: ${r.st.nao}`);
  L.push(`💧 Com água: ${r.agua}`);
  if(r.pmMed!=null)L.push(`📏 Prof. média medida: ${fmt(r.pmMed,1)} m (projeto ${fmt(r.ppMed,1)} m)`);
  const bloco=(t,x)=>{L.push('');L.push(t);Object.entries(x.prod).forEach(([k,v])=>L.push(`• ${k}: ${fmt(v)} kg`));L.push(`• Booster: ${fmt(x.booster)} un`);Object.entries(x.det).forEach(([k,v])=>L.push(`• ${k}: ${fmt(v)} un`));if(x.brinel)L.push(`• Brinel: ${fmt(x.brinel)} un`);};
  if(modo!=='hoje')bloco('💥 *Consumo acumulado do POL*',r);
  if(modo!=='acum')bloco(`💥 *Consumo de hoje (${brDate(today())})*`,hj);
  const pj=projDe(p);
  if(pj.kg!=null||p.holes.some(h=>h.cargaProj!=null)){const cf=conferencia(p);const lanc=cf.n.ok+cf.n.abaixo+cf.n.acima;L.push('');L.push('📐 *Projeto x executado*');
    L.push(`• Carga: projeto ${fmt(cf.kgProj)} kg | executado ${fmt(cf.kgExec)} kg`);
    if(lanc)L.push(`• Dentro da tolerância (±${fmt(pj.tolKg,0)}%): ${cf.n.ok}/${lanc} furos`);
    if(cf.n.abaixo)L.push(`• Abaixo do projeto: ${cf.n.abaixo} furo(s)`);if(cf.n.acima)L.push(`• Acima do projeto: ${cf.n.acima} furo(s)`);
    if(cf.profBaixa)L.push(`• Profundidade abaixo do projeto: ${cf.profBaixa} furo(s)`);}
  const tz=analiseTempo(p);
  if(tz.com.length){L.push('');L.push('⏱️ *Temporização*');L.push(`• Furos com tempo: ${tz.com.length}/${tz.ativos}${tz.sem.length?' | sem tempo: '+tz.sem.length:''}`);
    L.push(`• Tempos: ${fmt(tz.t0)} a ${fmt(tz.t1)} ms`);if(tz.rep.length)L.push(`• Tempos repetidos: ${tz.rep.map(([t,v])=>`${fmt(t)} ms (${v.map(x=>x.id).join(', ')})`).join('; ')}`);
    L.push(`• Detonadores com tempo: ${tz.dets}${p.dvtProg!=null?' | DVT programado: '+p.dvtProg+(p.dvtProg===tz.dets?' ✔':' ⚠️'):''}`);}
  const cams=Object.keys(r.cam);
  if(cams.length){L.push('');L.push('🚛 *Caminhões*');cams.forEach(c=>{const cd=camDif(p,c,Object.values(r.cam[c]).reduce((a,b)=>a+b,0));L.push(`• ${c} – ${Object.entries(r.cam[c]).map(([pr,kg])=>`${pr} ${fmt(kg)} kg`).join(' / ')}${(p.nfs||{})[c]?' – NF '+p.nfs[c]:''}${cd?` – NF x lançado ${cd.txt}${cd.ok?' ✔':' ⚠️'}`:''}`);});}
  const ac=acessRows(p,r).filter(a=>a.ret!=null);
  if(ac.length){L.push('');L.push('🧰 *Acessórios (saldo)*');ac.forEach(a=>L.push(`• ${a.n}: retirado ${fmt(a.ret)} | aplicado ${fmt(a.apl)} | devolvido ${fmt(a.dev||0)} | saldo ${fmt(a.saldo)}${a.saldo===0?' ✔':' ⚠️'}`));}
  const oc={};p.holes.forEach(h=>(h.cond||[]).forEach(c=>(oc[c]=oc[c]||[]).push(h.id)));
  if(Object.keys(oc).length){L.push('');L.push('⚠️ *Ocorrências nos furos*');Object.entries(oc).forEach(([c,v])=>L.push(`• ${c}: ${v.length} (${v.slice(0,12).join(', ')}${v.length>12?'…':''})`));}
  const ck=p.check||{};if(ck.pre&&ck.pre.ts||ck.fim&&ck.fim.ts){L.push('');L.push('✅ *Liberação*');if(ck.pre&&ck.pre.ts)L.push(`• Antes do carregamento: ${ck.pre.nome} (${new Date(ck.pre.ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})})`);if(ck.fim&&ck.fim.ts)L.push(`• Fechamento: ${ck.fim.nome} (${new Date(ck.fim.ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})})`);}
  const po=p.pos;if(po&&po.ts){L.push('');L.push('🧨 *Pós-fogo*');L.push(`• Falhas: ${po.falhas&&po.falhas.length?po.falhas.length+' ('+po.falhas.join(', ')+')':'nenhuma'}`);if(po.frag)L.push(`• Fragmentação: ${FRAG[po.frag]}${po.matacoes!=null?' | matacões: '+po.matacoes:''}`);L.push(`• Ultralançamento: ${po.ultra==='sim'?'houve'+(po.ultraDist!=null?' ('+fmt(po.ultraDist)+' m)':''):'não houve'}`);if(po.fumaca)L.push(`• Fumaça: ${FUMACA[po.fumaca]}`);if(po.vib!=null||po.ruido!=null)L.push(`• Vibração ${po.vib!=null?fmt(po.vib,1)+' mm/s':'–'} | pressão acústica ${po.ruido!=null?fmt(po.ruido,0)+' dB':'–'}`);if(po.obs)L.push('• '+po.obs);}
  const obs=p.holes.filter(h=>h.obs).map(h=>`• ${h.id}: ${h.obs}`);
  if(obs.length){L.push('');L.push('📝 *Observações*');L.push(...obs.slice(0,30));}
  return L.join('\n');
}
function tabRelatorio(p){
  const t=relatorio(p,relModo);
  $('#tabBox').innerHTML=`<div class="seg" id="rm" style="margin-bottom:10px">${[['acum','Acumulado'],['hoje','Só hoje'],['ambos','Os dois']].map(m=>`<button data-m="${m[0]}" class="${relModo===m[0]?'on':''}">${m[1]}</button>`).join('')}</div>
  <textarea id="rel" style="min-height:320px">${esc(t)}</textarea><div class="btns"><button class="btn pri" id="rCopy">Copiar relatório</button><button class="btn" id="rPrint">Relatório completo (imprimir / PDF)</button></div><p class="mut">Cole no WhatsApp. Você pode editar o texto antes de copiar.</p>`;
  document.querySelectorAll('#rm button').forEach(b=>b.onclick=()=>{relModo=b.dataset.m;tabRelatorio(p);});
  $('#rCopy').onclick=()=>copyText($('#rel').value);$('#rPrint').onclick=()=>imprimir(p);
}

/* ----- CSV ----- */
function csv(p){
  const n=v=>v==null?'':String(v).replace('.',',');
  const head=['POL','Mina','Furo','Status','ProfProjeto','ProfMedida','Agua','ColunaAgua','Deck1Produto','Deck1Kg','Deck1Caminhao','Deck2Produto','Deck2Kg','Deck2Caminhao','Deck3Produto','Deck3Kg','Deck3Caminhao','TempoMs','TotalKg','CargaProjetoKg','DesvioCarga','Booster','Brinel','Detonador','QtdDetonador','Tampao','Caminhao','NF','Obs','Condicao','LoteProduto','LoteBooster','LoteDetonador','LancadoPor','DataHora'];
  const rows=p.holes.map(h=>{const d=[0,1,2].map(k=>h.decks[k]||{});return[p.pol,p.mina,h.id,ST[h.status].n,n(h.profProj),n(h.profMed),h.agua,n(h.aguaM),d[0].prod||'',n(d[0].kg),deckTemCarga(d[0])?deckCam(h,d[0]):'',d[1].prod||'',n(d[1].kg),deckTemCarga(d[1])?deckCam(h,d[1]):'',d[2].prod||'',n(d[2].kg),deckTemCarga(d[2])?deckCam(h,d[2]):'',(h.tempos&&h.tempos.length>1?h.tempos.join('/'):(h.tempo??'')),n(holeKg(h)||null),n(kgProj(p,h)),desvio(p,h).t,n(h.booster),n(h.brinel),h.detTipo,n(h.detQtd),n(h.tampao),camsDoFuro(h).join(' + '),camsDoFuro(h).map(c=>(p.nfs||{})[c]).filter(Boolean).join(' + '),(h.obs||'').replace(/;/g,','),(h.cond||[]).join(', '),(h.lotes?.prod||''),(h.lotes?.booster||''),(h.lotes?.det||''),h.por||'',h.ts?new Date(h.ts).toLocaleString('pt-BR'):''].join(';');});
  return [head.join(';'),...rows].join('\n');
}
