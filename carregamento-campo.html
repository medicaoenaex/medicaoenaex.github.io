/* ===== GPS (só para polígono importado com coordenadas UTM) ===== */
function geoUTM(g){return !!g&&g.mx>100000&&g.mx<900000&&-g.my>1000000&&-g.my<10000000;}
function ll2utm(lat,lon){
  const a=6378137,f=1/298.257223563,k0=0.9996,e2=f*(2-f),ep2=e2/(1-e2),zone=Math.floor((lon+180)/6)+1,l0=((zone-1)*6-177)*Math.PI/180;
  const fi=lat*Math.PI/180,la=lon*Math.PI/180,sf=Math.sin(fi),cf=Math.cos(fi),N=a/Math.sqrt(1-e2*sf*sf),T=Math.tan(fi)**2,C=ep2*cf*cf,A=cf*(la-l0);
  const M=a*((1-e2/4-3*e2*e2/64-5*e2**3/256)*fi-(3*e2/8+3*e2*e2/32+45*e2**3/1024)*Math.sin(2*fi)+(15*e2*e2/256+45*e2**3/1024)*Math.sin(4*fi)-(35*e2**3/3072)*Math.sin(6*fi));
  const E=k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120)+500000;
  let No=k0*(M+N*Math.tan(fi)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720));if(lat<0)No+=10000000;
  return{E,N:No,zone};
}
let gpsOn=false,gpsId=null,gpsPos=null,gpsErr='';
function gpsStart(){
  if(!navigator.geolocation){toast('Este aparelho não tem GPS no navegador');return;}
  gpsOn=true;gpsErr='';
  gpsId=navigator.geolocation.watchPosition(ps=>{gpsPos={lat:ps.coords.latitude,lon:ps.coords.longitude,acc:ps.coords.accuracy};gpsErr='';gpsDraw();},
    e=>{gpsErr=e.code===1?'Permissão do GPS negada. Libere a localização para este site.':'Sem sinal do GPS.';gpsDraw();},{enableHighAccuracy:true,maximumAge:3000,timeout:20000});
}
function gpsStop(){gpsOn=false;if(gpsId!=null)navigator.geolocation.clearWatch(gpsId);gpsId=null;gpsPos=null;}
/* ===== UTM → lat/lon (para o alerta de raio; Brasil = hemisfério sul) ===== */
function utm2ll(E,N,zone,sul=true){
  const a=6378137,f=1/298.257223563,k0=0.9996,e2=f*(2-f),ep2=e2/(1-e2),e1=(1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2));
  const x=E-500000,y=sul?N-10000000:N,M=y/k0,mu=M/(a*(1-e2/4-3*e2*e2/64-5*e2**3/256));
  const p1=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1*e1/16-55*e1**4/32)*Math.sin(4*mu)+(151*e1**3/96)*Math.sin(6*mu);
  const C1=ep2*Math.cos(p1)**2,T1=Math.tan(p1)**2,N1=a/Math.sqrt(1-e2*Math.sin(p1)**2),R1=a*(1-e2)/Math.pow(1-e2*Math.sin(p1)**2,1.5),D=x/(N1*k0);
  const lat=p1-(N1*Math.tan(p1)/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*ep2)*D**4/24+(61+90*T1+298*C1+45*T1*T1-252*ep2-3*C1*C1)*D**6/720);
  const lon=(D-(1+2*T1+C1)*D**3/6+(5-2*C1+28*T1-3*C1*C1+8*ep2+24*T1*T1)*D**5/120)/Math.cos(p1);
  return {lat:lat*180/Math.PI,lon:((zone-1)*6-177)+lon*180/Math.PI};}
// coordenada UTM do furo (polígono importado com coordenadas)
const furoUTM=(p,h)=>p&&p.geo&&geoUTM(p.geo)?{E:h.x+p.geo.mx,N:-(h.y+p.geo.my)}:null;

/* ===== Carimbo na foto do furo (data, hora, furo, coordenada) ===== */
function carimbar(url,linhas){return new Promise(res=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const g=c.getContext('2d');g.drawImage(im,0,0);
  const fs=Math.max(14,Math.round(c.width/42)),pad=Math.round(fs*.5),lh=Math.round(fs*1.3),hh=pad*2+lh*linhas.length;
  g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,c.height-hh,c.width,hh);g.fillStyle='#fff';g.font=`600 ${fs}px system-ui,Arial,sans-serif`;g.textBaseline='top';
  linhas.forEach((t,i)=>{let s=t;while(g.measureText(s).width>c.width-pad*2&&s.length>4)s=s.slice(0,-2);g.fillText(s,pad,c.height-hh+pad+i*lh);});
  res(c.toDataURL('image/jpeg',.82));};im.onerror=()=>res(url);im.src=url;});}
function carimboTxt(p,h,ts){const d=new Date(ts);const u=furoUTM(p,h)||(gpsPos?ll2utm(gpsPos.lat,gpsPos.lon):null);
  return [`POL ${p.pol||''} · Furo ${h.id} · ${d.toLocaleDateString('pt-BR')} ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`,
    [u?`E ${Math.round(u.E)}  N ${Math.round(u.N)}`:'',[p.mina,p.cava].filter(Boolean).join(' / '),p.banco?'Banco '+p.banco:''].filter(Boolean).join(' · ')].filter(Boolean);}

/* ===== Alerta de raio (previsão de tempestade na cava; precisa de internet) ===== */
const RAIO_MS=15*60*1000;let raio={st:'',t:0,pid:null,avisado:''};
function raioLocal(p){if(gpsPos)return {lat:gpsPos.lat,lon:gpsPos.lon};
  if(p&&p.geo&&geoUTM(p.geo)&&p.holes.length){const xs=p.holes.map(h=>h.x),ys=p.holes.map(h=>h.y);const E=(Math.min(...xs)+Math.max(...xs))/2+p.geo.mx,N=-((Math.min(...ys)+Math.max(...ys))/2+p.geo.my);return utm2ll(E,N,num(S.utmZona)||23,true);}
  return null;}
async function raioChecar(p,forcar){
  if(S.raioOff||!p)return;if(!forcar&&raio.pid===p.id&&Date.now()-raio.t<RAIO_MS)return;
  raio.pid=p.id;raio.t=Date.now();const L=raioLocal(p);
  if(!L){raio.st='sem local (polígono sem coordenadas UTM e GPS desligado)';raioPinta();return;}
  if(!navigator.onLine){raio.st='desligado: sem internet';raioPinta();return;}
  try{const u=`https://api.open-meteo.com/v1/forecast?latitude=${L.lat.toFixed(3)}&longitude=${L.lon.toFixed(3)}&hourly=weather_code&forecast_hours=4&timezone=auto`;
    const r=await fetch(u);if(!r.ok)throw new Error();const j=await r.json();const hs=(j.hourly&&j.hourly.time)||[],wc=(j.hourly&&j.hourly.weather_code)||[];
    const i=wc.findIndex((c,k)=>k<4&&c>=95);const hora=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    if(i>=0){const h=String(hs[i]||'').slice(11,13);raio.st=`previsão de tempestade com raio ${i===0?'agora':'por volta das '+h+'h'} (consultado ${hora})`;raio.grave=true;
      const ch=p.id+'|'+hs[i];if(raio.avisado!==ch){raio.avisado=ch;aviso(`⚡ <b>Previsão de tempestade com raio</b> ${i===0?'agora':'por volta das '+h+'h'} na cava do POL ${esc(p.pol)}.<br>Avalie parar o carregamento e siga o procedimento da mina.`);}}
    else{raio.st=`sem previsão de tempestade nas próximas 3 h (consultado ${hora})`;raio.grave=false;}
  }catch(e){raio.st='desligado: sem internet';raio.grave=false;}
  raioPinta();}
function raioPinta(){const b=$('#raioSt');if(!b)return;b.innerHTML=S.raioOff?'⚡ Alerta de raio desligado':`⚡ Alerta de raio: ${esc(raio.st||'consultando…')}`;b.style.color=raio.grave&&!S.raioOff?'var(--bad)':'';b.style.fontWeight=raio.grave&&!S.raioOff?'700':'';}
setInterval(()=>{const p=cur();if(p&&document.visibilityState==='visible')raioChecar(p);},60*1000);
window.addEventListener('online',()=>{const p=cur();if(p)raioChecar(p,true);});

function gpsDraw(){
  const gG=$('#gpsG'),info=$('#gpsInfo'),p=cur();if(!gG||!p||!p.geo||!lastGeom)return;
  if(!gpsOn){gG.innerHTML='';return;}
  if(!gpsPos){if(info)info.textContent=gpsErr||'Procurando sinal do GPS…';return;}
  const u=ll2utm(gpsPos.lat,gpsPos.lon),x=u.E-p.geo.mx,y=-u.N-p.geo.my,g=lastGeom;
  let best=null,bd=Infinity;p.holes.forEach(h=>{const d=Math.hypot(h.x-x,h.y-y);if(d<bd){bd=d;best=h;}});
  const ext=Math.max(g.W,g.H);
  if(bd>ext*3){gG.innerHTML='';if(info)info.innerHTML=`Você está a <b>${fmt(bd)} m</b> do polígono (fora do mapa). Precisão ${fmt(gpsPos.acc)} m.`;return;}
  gG.innerHTML=`<circle cx="${g.X(x)}" cy="${g.Y(y)}" r="${Math.max(gpsPos.acc,g.r)}" fill="rgba(11,92,173,.12)" stroke="#0b5cad" stroke-width="${g.r*0.08}"/><circle cx="${g.X(x)}" cy="${g.Y(y)}" r="${g.r*0.55}" fill="#0b5cad" stroke="#fff" stroke-width="${g.r*0.2}"/>`;
  if(info)info.innerHTML=`📍 Furo mais perto: <b>${esc(best.id)}</b> a ${fmt(bd,1)} m · precisão do GPS ${fmt(gpsPos.acc)} m${gpsPos.acc>5?' (fraca)':''} <button class="btn sm" id="gpsOpen" style="margin-left:6px">Abrir ${esc(best.id)}</button>`;
  const b=$('#gpsOpen');if(b)b.onclick=()=>editHole(p.holes.indexOf(best));
}

/* ===== Liberação: situação do polígono e checklists ===== */
const situDe=p=>p.situ||'aberto';
/* ===== Fechamento: o que falta antes de liberar ===== */
function faltas(p){
  const idx=new Map(p.holes.map((h,i)=>[h,i]));const carr=p.holes.filter(h=>h.status==='carregado');
  const temCam=h=>(h.decks||[]).filter(d=>num(d.kg)>0).every(d=>deckCam(h,d));
  return [
    ['Pendentes (não carregados)',p.holes.filter(h=>h.status==='pendente')],
    ['Em repasse',p.holes.filter(h=>h.status==='repasse')],
    ['Carregados sem carga lançada',carr.filter(h=>!holeKg(h))],
    ['Carregados sem caminhão',carr.filter(h=>holeKg(h)&&!temCam(h))],
    ['Carregados sem tampão',carr.filter(h=>h.tampao==null)],
    ['Carregados sem detonador',carr.filter(h=>!h.detTipo&&!num(h.detQtd))],
    ['Fora da tolerância do projeto',carr.filter(h=>alertasFuro(p,h).length)],
  ].map(([t,hs])=>({t,hs:hs.map(h=>({h,i:idx.get(h)}))})).filter(g=>g.hs.length);}

  return `<div class="card"><h2>Fechamento do polígono <span class="mut">(${tot} ${tot>1?'itens':'item'})</span></h2><p class="mut" style="margin:0 0 6px">Toque no furo para abrir e corrigir.</p>
  ${G.map(g=>`<div style="margin:8px 0"><b>${esc(g.t)}: ${g.hs.length}</b><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${g.hs.slice(0,40).map(x=>`<button class="btn sm" data-fi="${x.i}" style="flex:0 0 auto;min-width:44px">${esc(x.h.id)}</button>`).join('')}${g.hs.length>40?`<span class="mut" style="align-self:center">+${g.hs.length-40}</span>`:''}</div></div>`).join('')}</div>`;}
function tabLiber(p){
  p.check=p.check||{};
  const bloco=(k,tit,itens)=>{const c=p.check[k]||{it:{}};const nOk=itens.filter((_,i)=>c.it&&c.it[i]).length;
    return`<div class="card"><h2>${tit} <span class="mut">(${nOk}/${itens.length})</span></h2>${itens.map((t,i)=>`<label class="chk"><input type="checkbox" data-k="${k}" data-i="${i}" ${c.it&&c.it[i]?'checked':''}>${esc(t)}</label>`).join('')}
    <div class="row" style="margin-top:6px"><div><label>Liberado por</label><input id="nm_${k}" value="${esc(c.nome||meuNome()||p.resp||'')}"></div><div style="align-self:end"><button class="btn ${c.ts?'':'pri'}" data-lib="${k}" style="width:100%">${c.ts?'Registrar de novo':'Registrar liberação'}</button></div></div>
    ${c.ts?`<div class="hint" style="background:#eaf7ef;border-color:#b5e0c4">✔ Registrado por <b>${esc(c.nome)}</b> em ${new Date(c.ts).toLocaleString('pt-BR')}${nOk<itens.length?` · <b style="color:var(--bad)">${itens.length-nOk} item(ns) não marcado(s)</b>`:''}</div>`:''}</div>`;};
  const si=situDe(p);
  $('#tabBox').innerHTML=faltasHtml(p)+`<div class="card"><h2>Situação do polígono</h2><div id="raioSt" class="mut" style="margin:0 0 8px;font-size:14px"></div><div class="seg" id="situ">${Object.entries(SITU).map(([k,v])=>`<button data-s="${k}" class="${si===k?'on':''}">${v.n}</button>`).join('')}</div>
  ${si==='detonado'?`<div class="row"><div><label>Data e hora da detonação</label><input id="detAt" type="datetime-local" value="${esc(p.detAt||'')}"></div></div>`:''}</div>
  ${bloco('pre','Antes do carregamento',CHK_PRE)}${bloco('fim','Fechamento do carregamento',CHK_FIM)}
  <p class="mut">O checklist é registro do que foi conferido em campo. Ele não substitui os procedimentos e liberações da mina.</p>`;
  document.querySelectorAll('#situ button').forEach(b=>b.onclick=()=>{
    const v=b.dataset.s;const pend=p.holes.filter(h=>h.status==='pendente').length;
    const ap=()=>{p.situ=v;markP(p.id);save();tabLiber(p);toast('Situação: '+SITU[v].n);};
    if(v!=='aberto'&&pend)confirmBox(`Ainda há ${nf(pend)} pendente(s). Marcar como "${SITU[v].n}" mesmo assim?`,ap,'Marcar');else ap();});
  if($('#detAt'))$('#detAt').onchange=e=>{p.detAt=e.target.value;markP(p.id);save();};
  document.querySelectorAll('#tabBox [data-fi]').forEach(b=>b.onclick=()=>editHole(+b.dataset.fi));raioPinta();
  document.querySelectorAll('#tabBox input[data-k]').forEach(c=>c.onchange=()=>{const k=c.dataset.k;p.check[k]=p.check[k]||{it:{}};p.check[k].it=p.check[k].it||{};p.check[k].it[c.dataset.i]=c.checked;markP(p.id);save();});
  document.querySelectorAll('[data-lib]').forEach(b=>b.onclick=()=>{const k=b.dataset.lib;const nm=$('#nm_'+k).value.trim();if(!nm){toast('Informe quem liberou');return;}
    const reg=()=>{p.check[k]=p.check[k]||{it:{}};p.check[k].nome=nm;p.check[k].ts=Date.now();
      if(k==='fim'&&situDe(p)==='aberto'&&!p.holes.some(h=>h.status==='pendente'))p.situ='carregado';markP(p.id);save();tabLiber(p);toast('Liberação registrada');};

}

/* ===== Resumo do carregamento para o WhatsApp (modelo do Rodrigo) ===== */
const diaDe=ts=>{if(!ts)return '';const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const maisDia=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return diaDe(d.getTime());};
const camWpp=c=>String(c||'').replace(/^\s*(UMB|UMT|UBT|CAM\.?|CAMINH[AÃ]O)\s*/i,'').trim()||'sem caminhão';
const detNome=t=>{const m=String(t||'').match(/(\d+)\s*m\b/i);return 'Detonadores '+(/DT5|ELETR/i.test(t)?'Eletrônicos':String(t).replace(/\s*\d+\s*m\b/i,'').trim())+(m?' '+m[1]+' mts':'');};
function wppDados(p,o){
  const carr=p.holes.filter(h=>h.status==='carregado'&&(o.escopo==='tudo'||diaDe(h.ts)===o.data));
  const nd=h=>(h.decks||[]).filter(d=>num(d.kg)>0).length;
  const decks={};carr.forEach(h=>{const n=Math.max(1,nd(h));decks[n]=(decks[n]||0)+1;});
  const det={};let booster=0,bags=0;const frota={};
  carr.forEach(h=>{booster+=num(h.booster)||0;if(h.detTipo&&num(h.detQtd))det[h.detTipo]=(det[h.detTipo]||0)+num(h.detQtd);bags+=Math.max(0,nd(h)-1);
    (h.decks||[]).forEach(d=>{const kg=num(d.kg);if(!kg)return;const c=camWpp(deckCam(h,d));frota[c]=frota[c]||{};const pr=d.prod||'';frota[c][pr]=(frota[c][pr]||0)+kg;});});
  const oper={};Object.entries(p.cams||{}).forEach(([c,d])=>{if(d&&(d.oper||(d.opers||[]).length))oper[camWpp(c)]=(d.opers&&d.opers.length>1?d.opers.join(', '):d.oper);});
  return {carr,decks,det,booster,bags,frota,oper};}
function wppTexto(p,o,D){
  const hr=new Date().getHours();const L=[];
  L.push((hr<12?'Bom dia':hr<18?'Boa tarde':'Boa noite')+' a todos!','','*Informações do carregamento*','');
  L.push('Data: '+brDate(o.data),'Mina: '+(p.mina||''),'Cava: '+(p.cava||''),'Polígono: '+(p.pol||''),'Banco: '+(p.banco||''),'Status: '+o.status,'Coordenadas: '+(o.coord||''),'Perfuratriz: '+(o.perf||''),'');
  const mx=Math.max(2,...Object.keys(D.decks).map(Number));
  for(let n=1;n<=mx;n++)L.push(`• *Furos de ${n} Deck${n>1?'s':''} ${D.decks[n]||0}*`);
  L.push(`• *Total de furos carregados ${o.escopo==='tudo'?'no polígono':'hoje'} ${D.carr.length}*`,'','*Consumo:*','');
  if(D.booster)L.push(`• ${fmt(D.booster)} ${o.boosterNome||'Booster'}`);
  Object.entries(D.det).forEach(([t,q])=>L.push(`• ${fmt(q)} ${(o.detNomes&&o.detNomes[t])||detNome(t)}`));
  const bg=num(o.bags);if(bg)L.push(`• ${fmt(bg)} Blastbags`);
  L.push('','*Frota utilizada:*','');
  Object.entries(D.frota).forEach(([c,ps])=>{const op=D.oper[c];Object.entries(ps).forEach(([pr,kg])=>L.push(`• ${c} - ${fmt(kg)}kg ${pr}${op?' - Op. '+op:''}`.trim()));});
  const stc=Object.keys(p.cams||{}).map(c=>[c,camOpDe(c)]).filter(x=>x[1]);
  if(stc.length){L.push('','*Status dos caminhões:*','');stc.forEach(([c,o])=>{const e=camEstado(c,(agoraDados().find(x=>x.cam===c)||{}).last);L.push(`• ${camWpp(c)} - ${e.man?OPST[e.k].n+' às '+hm(e.desde):'Carregando (voltou do recarregar)'}`);});}
  L.push('','Mina: '+(p.mina||''),'Operação: '+D.carr.length+' Furos','Impacto: '+(o.impacto||'Não'),'','*D+1:*','Data: '+brDate(o.d1data),'Mina: '+(o.d1mina||p.mina||''),'Operação: '+(o.d1op||''));
  return L.join('\n');}
function resumoWpp(p){
  const sv=p.wpp||{};const g=S.wppG||{};
  const o={data:today(),escopo:'dia',status:situDe(p)==='aberto'?'Carregando':situDe(p)==='carregado'?'Carregado':'Detonado',coord:sv.coord||'',perf:sv.perf||'',impacto:sv.impacto||'Não',
    boosterNome:g.boosterNome||'Booster de 450gr',detNomes:Object.assign({},g.detNomes||{}),bags:null,bagsAuto:true,d1data:maisDia(today(),1),d1mina:p.mina||'',d1op:sv.d1op||''};
  const inp=(id,l,v,ph)=>`<div><label>${l}</label><input id="${id}" value="${esc(v??'')}" placeholder="${esc(ph||'')}"></div>`;
  const draw=()=>{const D=wppDados(p,o);if(o.bagsAuto)o.bags=D.bags;const dets=Object.keys(D.det);
    openSheet(`<h3>Resumo para o WhatsApp<button class="btn sm" id="wpX">Fechar</button></h3>
    <div class="row"><div><label>Data</label><input id="wpD" type="date" value="${o.data}"></div><div><label>Contar furos</label><select id="wpE"><option value="dia" ${o.escopo==='dia'?'selected':''}>Carregados nesse dia</option><option value="tudo" ${o.escopo==='tudo'?'selected':''}>Polígono inteiro</option></select></div></div>
    <div class="row"><div><label>Status</label><select id="wpS">${opts(['Carregando','Carregado','Liberado','Detonado'],o.status)}</select></div>${inp('wpP','Perfuratriz',o.perf,'ex.: 1132-1131')}</div>
    <div class="row">${inp('wpC','Coordenadas',o.coord)}${inp('wpI','Impacto',o.impacto)}</div>
    <div class="row">${inp('wpB','Nome do booster',o.boosterNome)}${inp('wpG','Blastbags (un)',o.bags)}</div>
    ${dets.map((t,i)=>`<div class="row">${inp('wpT'+i,'Nome do '+esc(t),o.detNomes[t]||detNome(t))}</div>`).join('')}
    <div class="row"><div><label>D+1 data</label><input id="wp1d" type="date" value="${o.d1data}"></div>${inp('wp1m','D+1 mina',o.d1mina)}</div>
    <div class="row">${inp('wp1o','D+1 operação',o.d1op,'ex.: 125 Furos')}</div>
    <label>Texto (pode ajustar antes de mandar)</label><textarea id="wpTx" style="min-height:260px;font-family:inherit">${esc(wppTexto(p,o,D))}</textarea>
    <div class="btns"><button class="btn pri" id="wpW">Mandar no WhatsApp</button><button class="btn" id="wpCp">Copiar</button></div>`);
    const ler=()=>{o.data=$('#wpD').value||today();o.escopo=$('#wpE').value;o.status=$('#wpS').value;o.perf=$('#wpP').value.trim();o.coord=$('#wpC').value.trim();o.impacto=$('#wpI').value.trim();o.boosterNome=$('#wpB').value.trim();
      const b=$('#wpG').value.trim();if(String(o.bags??'')!==b){o.bags=num(b);o.bagsAuto=false;}dets.forEach((t,i)=>o.detNomes[t]=$('#wpT'+i).value.trim());o.d1data=$('#wp1d').value;o.d1mina=$('#wp1m').value.trim();o.d1op=$('#wp1o').value.trim();};
    const guarda=()=>{p.wpp={coord:o.coord,perf:o.perf,impacto:o.impacto,d1op:o.d1op};S.wppG={boosterNome:o.boosterNome,detNomes:o.detNomes};markP(p.id);save();};
    document.querySelectorAll('#sheet input,#sheet select').forEach(e=>e.onchange=()=>{ler();guarda();if(e.id==='wpD'||e.id==='wpE'){o.bagsAuto=true;draw();return;}$('#wpTx').value=wppTexto(p,o,wppDados(p,o));});
    $('#wpX').onclick=closeSheet;
    $('#wpCp').onclick=async()=>{const t=$('#wpTx').value;try{await navigator.clipboard.writeText(t);toast('Texto copiado — cole no grupo');}catch(e){$('#wpTx').select();document.execCommand('copy');toast('Texto copiado');}};
    $('#wpW').onclick=()=>{guarda();window.open('https://wa.me/?text='+encodeURIComponent($('#wpTx').value),'_blank');};};
  draw();}

/* ===== Caminhões (NF x lançado) e acessórios ===== */
function camDif(p,c,kl){const d=(p.cams||{})[c]||{};const kn=num(d.kgNF);if(kn==null)return null;const sai=kn-(num(d.kgRet)||0);if(sai<=0)return null;const dif=kl-sai,pc=dif/sai*100,tol=projDe(p).tolCam;

function acessRows(p,r){const A=p.acess||{};const it=[['Booster',r.booster],['Brinel',r.brinel],...DETS.map(t=>[t,r.det[t]||0])];

function vozNum(tk,i){ // lê número a partir do token i: "2,5" "2 vírgula 5" "dois e meio" "2 metros e meio"

  if((tk[i+1]==='virgula'||tk[i+1]==='ponto')&&tk[i+2]!=null&&/^\d+$/.test(tk[i+2])){v=num(t+'.'+tk[i+2]);used=3;}
  else if(tk[i+1]==='e'&&(tk[i+2]==='meio'||tk[i+2]==='meia')){v+=0.5;used=3;}
  else if(tk[i+1]==='meio'||(tk[i+1]==='meia'&&!/^\d/.test(tk[i+2]||''))){v+=0.5;used=2;}
  else if(VOZ_UN_M.has(tk[i+1])&&tk[i+2]==='e'&&(tk[i+3]==='meio'||tk[i+3]==='meia')){v+=0.5;used=4;}
  return{v,used};
}
function parseVoz(txt,camList){
  let s=vozNorm(txt).replace(/(\d)\s*(kg|m)\b/g,'$1 $2').replace(/(\d)[.,](?=\d)/g,'$1\u0001').replace(/[.,;:!?()]/g,' ').replace(/\u0001/g,',');
  const tk=vozExtenso(s.trim().split(/\s+/).filter(Boolean));const r={};const usado=new Set();
  const kwAt=tk.map(vozKw);const camN=tk.map(w=>/^(caminhao|caminhoes|umt|umb|cam)$/.test(w));
  // furo e caminhão primeiro (os números deles não são carga)
  for(let i=0;i<tk.length;i++){
    if(/^(furo|buraco)$/.test(tk[i])&&r.furo==null){let j=i+1;while(j<tk.length&&/^(numero|n|no|nº|de|do)$/.test(tk[j]))j++;const id=tk[j];if(id==null)continue;
      const n=vozNum(tk,j);if(n&&/^[\d]/.test(id)||n&&id in NUMP){r.furo=String(n.v);for(let k=i;k<j+n.used;k++)usado.add(k);}else if(!vozKw(id)){r.furo=id.toUpperCase();for(let k=i;k<=j;k++)usado.add(k);}}
    if(camN[i]&&r.caminhao==null){let j=i+1;while(j<tk.length&&VOZ_FILL.has(tk[j]))j++;const id=(tk[j]||'').replace(/\D/g,'');if(id){const c=camList.find(c=>c.toLowerCase().replace(/\s/g,'').endsWith(id));if(c){r.caminhao=c;for(let k=i;k<=j;k++)usado.add(k);}}}
  }
  // palavras de estado
  for(let i=0;i<tk.length;i++){const w=tk[i];
    if(w==='seco'||w==='seca')r.agua='seca';
    if(/^(umido|umida|molhado|molhada)$/.test(w))r.agua='umida';
    if((w==='agua'||w==='aguas')&&r.agua!=='seca')r.agua=tk[i-1]==='sem'?'seca':'agua';
    if(w==='perdido')r.status='perdido';if(w==='repasse')r.status='repasse';
    if(w==='nao'&&(tk[i+1]||'').startsWith('carreg')){r.status='nao';usado.add(i+1);}
    if((w==='carregado'||w==='carregada')&&!usado.has(i)&&!r.status)r.status='carregado';
    const pr=PRODUTOS.find(x=>vozNorm(x)===w);if(pr)r.prod=pr;
  }
  // cada número vai para o campo certo, em qualquer ordem:
  // 1) "180 quilos" → carga; 2) campo logo antes ("tampão 2,5", "tampão de 3 metros"); 3) campo logo depois ("1 booster", "3 metros de tampão")
  const soltos=[];
  for(let i=0;i<tk.length;i++){if(usado.has(i))continue;const n=vozNum(tk,i);if(!n)continue;
    const fim=i+n.used;let j=fim;while(j<tk.length&&(VOZ_UN_M.has(tk[j])||VOZ_UN_UN.has(tk[j])||/^(de|do|da|no|na)$/.test(tk[j])))j++;
    let campo=null;
    if(VOZ_UN_KG.has(tk[fim])&&r.kg==null){campo='kg';j=fim+1;}
    if(!campo){let b=i-1;while(b>=0&&VOZ_FILL.has(tk[b])&&!usado.has(b))b--;const k=b>=0&&!usado.has(b)?kwAt[b]:null;if(k&&r[k]==null)campo=k;}
    if(!campo){const k=kwAt[j];if(k&&r[k]==null){campo=k;usado.add(j);}}
    if(campo){r[campo]=n.v;if(campo==='aguaM')r.agua='agua';}else soltos.push(n.v);
    for(let k=i;k<fim;k++)usado.add(k);i=fim-1;
  }
  // "furo 32 180" sem unidade: número solto vira carga
  if(r.kg==null&&soltos.length===1&&r.furo)r.kg=soltos[0];
  return r;
}
/* ----- números falados por extenso ("trinta e dois", "cento e oitenta") viram algarismos ----- */
const VOZ_NW=(()=>{const o={zero:0,um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,quatorze:14,catorze:14,quinze:15,dezesseis:16,dezasseis:16,dezessete:17,dezoito:18,dezenove:19,
  vinte:20,trinta:30,quarenta:40,cinquenta:50,cincoenta:50,sessenta:60,setenta:70,oitenta:80,noventa:90,cem:100,cento:100,duzentos:200,duzentas:200,trezentos:300,trezentas:300,quatrocentos:400,quinhentos:500,seiscentos:600,setecentos:700,oitocentos:800,novecentos:900,mil:1000};return o;})();
const vozSlot=v=>v>=1000?1000:v>=100?100:v>=20?10:1;
function vozExtenso(tk){const out=[];
  for(let i=0;i<tk.length;i++){const w=tk[i];if(!(w in VOZ_NW)){out.push(w);continue;}
    let v=VOZ_NW[w],slot=vozSlot(v),j=i+1;
    if(w==='mil'){v=1000;slot=1000;}
    for(;;){if(tk[j]==='mil'&&v<1000){v*=1000;slot=1000;j++;continue;}
      const k=tk[j]==='e'?j+1:j;const n=tk[k];if(!(n in VOZ_NW)||n==='mil')break;const nv=VOZ_NW[n];
      if(vozSlot(nv)>=slot)break;
      v+=nv;slot=vozSlot(nv);j=k+1;}
    out.push(String(v));i=j-1;}
  return out;}

const VOZ_CACHE='carregamento-voz-v1',VOZ_LIB='lib/vosk/vosk.js',VOZ_MODELO='lib/vosk/vosk-model-small-pt-0.3.tar.gz';

function vozIdb(){return new Promise((ok,no)=>{const r=indexedDB.open('carregamentoVoz',1);r.onupgradeneeded=()=>r.result.createObjectStore('arq');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});}
async function vozCache(){try{const db=await vozIdb();const tx=(m,f)=>new Promise((ok,no)=>{const t=db.transaction('arq',m);const q=f(t.objectStore('arq'));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error);});

async function baixarVozOffline(prog){
  const c=await vozCache();if(!c)throw new Error('Este navegador não deixa guardar a voz');
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}

async function apagarVozOffline(){try{await caches.delete(VOZ_CACHE);}catch(e){}try{await new Promise(ok=>{const r=indexedDB.deleteDatabase('carregamentoVoz');r.onsuccess=r.onerror=r.onblocked=()=>ok();});}catch(e){}vozModel=null;}
let vozModel=null,vozModelP=null;
async function vozCarregarModelo(){

async function vozOfflineIniciar(st,mostra){

  else if(r.prod&&f.decks[0])f.decks[0].prod=r.prod;
  ['tampao','booster','brinel','detQtd','profMed','agua','aguaM','status'].forEach(k=>{if(r[k]!=null)f[k]=r[k];});
  if(r.caminhao&&r.kg==null){f.caminhao=r.caminhao;(f.decks||[]).forEach(d=>delete d.cam);}
  if(f.status==='pendente'&&(r.kg!=null))f.status='carregado';
}

/* ===== Ligação com o Medição Enaex (mesmo site, mesmo celular) ===== */
// lê o banco do app (IndexedDB) sem criar nada: se o banco não existir, a abertura é cancelada
function idbOutroApp(nome,store){return new Promise(res=>{try{const r=indexedDB.open(nome);let novo=false;
  r.onupgradeneeded=e=>{novo=true;try{e.target.transaction.abort();}catch(_){}};
  r.onsuccess=()=>{const d=r.result;if(novo||!d.objectStoreNames.contains(store)){d.close();return res([]);}try{const q=d.transaction(store).objectStore(store).getAll();q.onsuccess=()=>{d.close();res(q.result||[]);};q.onerror=()=>{d.close();res([]);};}catch(e){d.close();res([]);}};
  r.onerror=()=>res([]);r.onblocked=()=>res([]);}catch(e){res([]);}});}
async function acharMedicoesApps(){
  const out=[];
  for(const [db,app,rot] of [['croqui-real','croqui-real','Medição Enaex'],['temporizacao','temporizacao','Temporização']]){
    (await idbOutroApp(db,'polys')).filter(P=>P&&!P.sample&&Array.isArray(P.holes)).forEach(P=>out.push({key:db,P,app,origem:rot,nome:P.nome||P.arquivo||'(sem nome)',n:P.holes.filter(h=>!h.ghost).length,data:P.upd?new Date(P.upd).toLocaleDateString('pt-BR'):''}));}
  acharMedicoes().forEach(m=>{if(!out.some(o=>o.P.id&&o.P.id===m.P.id))out.push(Object.assign(m,{origem:'neste celular'}));});
  return out.sort((a,b)=>(b.P.upd||0)-(a.P.upd||0));
}
function acharMedicoes(){
  const out=[];const visto=new Set();
  const busca=(o,key,d)=>{if(!o||typeof o!=='object'||d>4)return;
    if(Array.isArray(o.holes)&&o.holes.length&&o.holes.some(h=>h&&typeof h==='object'&&'x' in h&&'y' in h&&('n' in h||'tl' in h))){const id=key+'|'+(o.nome||o.id||out.length);if(!visto.has(id)){visto.add(id);out.push({key,P:o,nome:o.nome||o.pol||o.id||'(sem nome)',n:o.holes.filter(h=>!h.ghost).length,data:o.data||o.dt||''});}return;}
    (Array.isArray(o)?o:Object.values(o)).forEach(v=>busca(v,key,d+1));};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||k===KEY||k.startsWith('carregamento'))continue;const v=localStorage.getItem(k);if(!v||v[0]!=='{'&&v[0]!=='[')continue;try{busca(JSON.parse(v),k,0);}catch(e){}}}catch(e){}
  return out;
}

function atualizarMedicao(p){
  escolherMedicao(m=>{

/* ===== Aba 📏 Medição: medição real dos furos no campo PELO CROQUI (quem mede se posiciona no mapa e toca no furo)
   grava nos mesmos campos do furo (profMed, aguaM/agua, tampao): a aba Operador já abre com esses valores ===== */
let medFiltro='falta',medZoom=1,medSel=-1,medListaOn=false;
const medBN=v=>buscaNorm(v); // mesma busca da aba Operador (L1-F1 = l1f1)
function medAchar(p,q){q=medBN(q);if(!q)return -1;let b=-1,bn=9;p.holes.forEach((h,i)=>{const id=medBN(h.id);const n=id===q?0:id.startsWith(q)?1:id.includes(q)?2:9;if(n<bn){bn=n;b=i;}});return b;}
const medFeito=h=>!!h.med||h.profMed!=null;
function medRaso(p,h){const pr=projDe(p,h);return h.profMed!=null&&h.profProj!=null&&h.profMed<h.profProj-(pr.tolProf??0.5);}
const medBaixa=(p,h)=>h.profMed!=null&&!!profBaixa(p,h,h.profMed);
function medCor(p,h){if(h.status==='perdido')return ST.perdido.c;if(h.status==='nao')return'#343a40';if(!medFeito(h))return'#5b6676';if(medBaixa(p,h))return'#e03131';if(medRaso(p,h))return'#f08c00';if(h.agua==='agua'||h.aguaM>0)return'#22b8cf';return'#339af0';}

// planilha modelo: a aba "Densidade" tem 3 blocos (CARREG.1, 2 e 3), 4 amostras cada, peso do copo nas linhas 3/6/9/12, colunas 0/15/30 min
const DS_BLOCO={'CARREG.1':['B','C','D'],'CARREG.2':['G','H','I'],'CARREG.3':['L','M','N']};
const DS_LIN=[3,6,9,12];
// na CARREG.4+ (cópias) não há bloco: os valores vão direto nas células Dens.1–4 (linhas 8 e 9)
const DS_CARREG=[['B8','C8','D8'],['B9','C9','D9'],['F8','G8','H8'],['F9','G9','H9']];
function densPlanGravar(de,x,n,lista){
  const bl=DS_BLOCO[n];
  if(bl&&de){DS_LIN.forEach(r=>bl.forEach(c=>de.clear(c+r)));
    lista.slice(0,4).forEach((a,i)=>DS_T.forEach(([k],j)=>{if(a[k]!=null)de.set(bl[j]+DS_LIN[i],a['g'+k.slice(1)]??pesoDeDens(a[k]));}));}
  else if(!bl)DS_CARREG.forEach((cs,i)=>cs.forEach((c,j)=>{const a=lista[i];const v=a&&a[DS_T[j][0]];x.set(c,v!=null?Math.round(v*1000)/1000:null);}));
}
function densPlanLer(wb,n){const out=[];const cel=(s,r)=>{const c=s&&s[r];return c?num(c.v):null;};
  const bl=DS_BLOCO[n],de=wb.Sheets['Densidade'];
  for(let i=0;i<4;i++){const o={};
    if(bl&&de)DS_T.forEach(([k],j)=>{const g=cel(de,bl[j]+DS_LIN[i]);if(g!=null&&g>0){o[k]=densDePeso(g);o['g'+k.slice(1)]=g;}});
    else DS_T.forEach(([k],j)=>{const v=cel(wb.Sheets[n],DS_CARREG[i][j]);if(v!=null&&v>0)o[k]=Math.round(v*1000)/1000;});
    out.push(Object.keys(o).length?o:null);}
  return out;}
// junta as amostras lidas da planilha (por caminhão, na ordem 1–4) com as do app; devolve quantas mudaram

// pinta a linha de vermelho enquanto digita, se passar do limite do projeto (não bloqueia)
function operLimVivo(p,row,meu,h){
  h=h||p.holes[+row.dataset.i];if(!h||!row)return [];const g=k=>{const e=row.querySelector(`[data-k="${k}"]`);return e?num(e.value):null;};
  const k=g('kg'),t=g('tp'),pm=g('pm');const outros=Math.max(0,holeKg(h)-kgDoCam(h,meu));
  const lim=limitesFuro(Object.assign({},p),Object.assign({},h,{status:h.status==='pendente'?'carregado':h.status}),k>0?k+outros:outros,t!=null?t:(k>0?h.tampao??tampoPadrao(p,h):h.tampao),pm??h.profProj??null);
  row.classList.toggle('lim',lim.length>0);
  const ik=row.querySelector('[data-k="kg"]'),it=row.querySelector('[data-k="tp"]');if(ik)ik.classList.toggle('lim',lim.some(x=>x.k==='kg'));if(it)it.classList.toggle('lim',lim.some(x=>x.k==='tp'));{const ip=row.querySelector('[data-k="pm"]');if(ip)ip.classList.toggle('lim',lim.some(x=>x.k==='pb'));}
  let m=row.querySelector('.oplim');if(lim.length){if(!m){m=document.createElement('div');m.className='oplim';row.appendChild(m);}m.textContent='⛔ '+lim.map(x=>x.t).join(' · ');}else if(m)m.remove();
  const b=row.querySelector('.oplid b');if(b)b.textContent=(lim.length?'⛔ ':'')+h.id;
  return lim;
}
// salva a linha do furo (carga, profundidade, tampão) sem redesenhar a lista
function operSalvaLinha(p,row,meu){
  const h=p.holes[+row.dataset.i];if(!h)return;const pr=projDe(p,h);const limAntes=limitesFuro(p,h).map(x=>x.t).join('|');const g=k=>num(row.querySelector(`[data-k="${k}"]`).value);
  const k=g('kg'),pm=g('pm');let t=g('tp');const kgAntes=kgDoCam(h,meu);if(t==null&&k>0&&h.tampao==null){t=tampoPadrao(p,h);if(t!=null)row.querySelector('[data-k="tp"]').value=String(t).replace('.',',');}
  const mudou=(k??0)!==(kgAntes||0)||pm!==(h.profMed??null)||t!==(h.tampao??null);
  if(!mudou)return;
  const antes=camFora(p,meu)?[meu]:[];pushUndo(p,[h],'furo '+h.id);
  if(k>0){lancarCarga(h,meu,((h.decks||[]).find(x=>deckCam(h,x)===meu)||{}).prod||pr.prod||'',k);if(h.status==='pendente'||h.status==='repasse')h.status='carregado';
    if(h.booster==null&&pr.booster!=null)h.booster=pr.booster;if(h.brinel==null&&pr.brinel!=null)h.brinel=pr.brinel;if(!h.detTipo&&pr.detTipo)h.detTipo=pr.detTipo;if(h.detQtd==null&&pr.detQtd!=null)h.detQtd=pr.detQtd;}
  else if(kgAntes>0){h.decks=(h.decks||[]).filter(d=>deckCam(h,d)!==meu);normCams(h);if(!holeKg(h)&&h.status==='carregado'){h.status='pendente';h.booster=h.brinel=h.detQtd=null;h.detTipo='';}}
  h.profMed=pm;h.tampao=t;
  if(t!=null)S.ui=Object.assign(S.ui||{},{operLast:{tampao:t,area:h.area||''}});
  carimbaLotes(p,h);histAdd(h,'Operador: '+resumoFuro(h));h.ts=Date.now();h.por=meuNome()||meu;if(meuOper())h.oper=meuOper();markF(p.id,h.id);save();{const r=document.querySelector(`.opl[data-i="${p.holes.indexOf(h)}"] .oplid`);if(r&&h.oper){const o2=r.querySelector('.opnm');if(o2)o2.textContent='👷 '+h.oper;else r.insertAdjacentHTML('beforeend',`<small class="opperf opnm">👷 ${esc(h.oper)}</small>`);}}
  row.className='opl '+h.status;row.querySelector('.oplid span').innerHTML=h.status==='carregado'?'✔':h.status==='pendente'?'':esc(ST[h.status].n);
  const lim=operLimVivo(p,row,meu,h);const limTxt=lim.map(x=>x.t).join('|');
  if(lim.length&&limTxt!==limAntes)setTimeout(()=>aviso(`<b style="font-size:18px">⛔ Furo ${esc(h.id)}: ${limTit(lim).slice(2)}</b><br>${lim.map(x=>esc(x.t)).join('<br>')}`),60);
  const av=[];const kp=kgProj(p,h);if(!lim.some(x=>x.k==='kg')&&k>0&&kp!=null&&Math.abs(k-kp)/kp*100>pr.tolKg)av.push('carga '+(k>kp?'acima':'abaixo')+' do projeto');if(pm!=null&&h.profProj!=null&&pm<h.profProj-pr.tolProf)av.push(fmt(h.profProj-pm,1)+' m mais raso');if(!lim.some(x=>x.k==='tp')&&t!=null&&pr.tampao!=null&&Math.abs(t-pr.tampao)>0.5)av.push('tampão diferente do plano');
  toast('Furo '+h.id+(h.status==='carregado'?' carregado':' salvo')+(av.length?' · ⚠️ '+av.join(' · '):'')+(SY().token?' · enviado':''));
  operMapaPinta(p,meu,h);
  const cf=camFora(p,meu);if(cf&&!antes.includes(meu))setTimeout(()=>aviso(`<b>${esc(meu)}</b>: lançado x NF fora da tolerância (${esc(cf.txt)})`),60);
}
// furo adicional (fora do projeto): nasce como EXn no ponto tocado do croqui, ou ao lado do último furo lançado
function operNovoFuro(p,meu,pt){
  const ult=[...p.holes].filter(h=>h.ts&&camsDoFuro(h).includes(meu)).sort((a,b)=>b.ts-a.ts)[0]||p.holes[p.holes.length-1]||{x:0,y:0};
  const base=pt?maisPerto(p,pt.x,pt.y)||ult:ult;
  // prefixo próprio XO- (extra do operador): nunca colide com furos do projeto nem com extras da medição
  const ids=new Set(p.holes.map(h=>String(h.id).toUpperCase()));let k=1;while(ids.has('XO-'+k))k++;
  const id='XO-'+k;
  const h=pt?novoFuro(id,Math.round(pt.x*100)/100,Math.round(pt.y*100)/100,base.profProj):novoFuro(id,(base.x||0)+(p.esp||4)/2,(base.y||0)+1.5,base.profProj);
  h.obs='Furo extra do operador';histAdd(h,'Furo extra do operador criado ('+meu+')');h.por=meuNome()||meu;if(meuOper())h.oper=meuOper();
  p.holes.push(h);markP(p.id);markF(p.id,h.id);save();operAdd=false;operFiltro='todos';tabOper(p);
  const i=p.holes.length-1;setTimeout(()=>{const row=document.querySelector(`.opl[data-i="${i}"]`);if(row){row.scrollIntoView({block:'center'});row.classList.add('flash');const inp=row.querySelector('[data-k="kg"]');if(inp)inp.focus({preventScroll:true});}operMapaMarca(i);},80);
  toast('Furo extra do operador '+h.id+' criado — lance a carga');
}
// tampão que entra sozinho: o da área do furo (quando a área tem tampão próprio), senão o último digitado, senão o do plano
const tampoPadrao=(p,h)=>{const a=h&&areaDe(p,h);if(a&&a.tampao!=null)return a.tampao;const ol=operLast();const mesma=!temAreas(p)||(ol.area||'')===((h&&h.area)||'');return (mesma?ol.tampao:null)??projDe(p,h).tampao??ol.tampao??null;};
function operMais(p,i,meu){const h=p.holes[i];
  openSheet(`<h3>Furo ${esc(h.id)}<button class="btn sm" id="omX">Fechar</button></h3><p class="mut" style="margin:0 0 8px">${ST[h.status].n}${holeKg(h)?' · '+fmt(holeKg(h))+' kg':''}</p>

  $('#omAll').onclick=()=>{closeSheet();editHole(i);};
}

function bindCam(p,meu){
  if($('#syncBox'))bindSyncBox();

  if($('#cmP'))$('#cmP').onchange=e=>{camPoly=e.target.value;renderCam();};
  const dAv=()=>{const d=densNum($('#cmD').value),pd=p?projDe(p).dens:null;$('#cmDA').innerHTML=densFora(d)?'⚠️ Confira: densidade fora do comum (0,5 a 1,6 g/cm³)':(d!=null&&pd!=null&&Math.abs(d-pd)>0.05?`⚠️ Diferente do plano de fogo (${fmt(pd,2)} g/cm³)`:'');};
  $('#cmD').oninput=dAv;dAv();
  $('#cmD').onchange=()=>{const d=densNum($('#cmD').value);S.ui=Object.assign(S.ui||{},{meuDens:d});
    if(p&&meu&&d!=null){p.cams=p.cams||{};p.cams[meu]=p.cams[meu]||{};if(p.cams[meu].dens==null||p.cams[meu].dens===''){p.cams[meu].dens=d;markP(p.id);}}
    save();toast(d!=null?'Densidade '+fmt(d,2)+' g/cm³ guardada':'Densidade apagada');};
  if(!p)return;S.cur=p.id;
  document.querySelectorAll('#cmF button').forEach(b=>b.onclick=()=>{camFiltro=b.dataset.f;renderCam();});
  document.querySelectorAll('.poly[data-i]').forEach(el=>el.onclick=()=>camFuro(p,+el.dataset.i,meu));
  const abrir=()=>{const q=$('#cmQ').value.trim().toUpperCase();if(!q)return;const h=furoMap(p.holes)(q);if(!h){toast('Furo '+q+' não encontrado');return;}camFuro(p,p.holes.indexOf(h),meu);};
  $('#cmAbrir').onclick=abrir;$('#cmQ').onkeydown=e=>{if(e.key==='Enter')abrir();};
  $('#cmV').onclick=()=>vozOuvir(t=>{const r=parseVoz(t,[...CAMS]);if(!r.furo){toast(`Ouvi "${t}" — diga o furo primeiro`);return;}const i=p.holes.findIndex(h=>String(h.id).toUpperCase()===r.furo);if(i<0){toast('Furo '+r.furo+' não encontrado');return;}camFuro(p,i,meu,r);});
}
function camFuro(p,i,meu,voz){
  const h=p.holes[i],pr=projDe(p,h);const kp=kgProj(p,h);
  const meuD=(h.decks||[]).filter(d=>deckCam(h,d)===meu&&deckTemCarga(d));const outrosKg=holeKg(h)-kgDoCam(h,meu);const outrosC=camsDoFuro(h).filter(c=>c!==meu);
  const d0=meuD[0]||(h.decks||[])[0]||{};let kg=voz&&voz.kg!=null?voz.kg:(kgDoCam(h,meu)||(outrosKg>0?(kp!=null&&kp>outrosKg?Math.round((kp-outrosKg)*10)/10:null):(holeKg(h)||kp)));const prod=(voz&&voz.prod)||d0.prod||pr.prod||'';
  const v=x=>x==null?'':String(x).replace('.',',');const big='font-size:22px;font-weight:700';
  const dens=h.dens??meuDens()??pr.dens;
  openSheet(`<h3>Furo ${esc(h.id)}<button class="btn sm" id="cfX">Fechar</button></h3>
  <p class="mut" style="margin:0">${kp!=null?'Projeto: '+fmt(kp)+' kg':'Sem carga de projeto'}${h.profProj!=null?' · prof. projeto '+fmt(h.profProj,1)+' m':''}${pr.tampao!=null?' · tampão '+fmt(pr.tampao,1)+' m':''}${h.agua!=='seca'?' · 💧 '+AGUA_N[h.agua]:''}${h.obsCroqui?' · croqui: '+esc(h.obsCroqui):''}</p>
  ${outrosC.length&&outrosKg>0?`<div class="hint" style="margin:8px 0 0">Este furo já tem ${fmt(outrosKg)} kg do ${esc(outrosC.map(camCurto).join(' + '))}. O que você lançar aqui entra como outro deck, do ${esc(camCurto(meu))}.</div>`:''}
  <div class="row"><div><label>Explosivo (kg)</label><input id="cfK" inputmode="decimal" value="${v(kg)}" style="${big}"></div><div><label>Profundidade (m)</label><input id="cfPr" inputmode="decimal" value="${v((voz&&voz.prof)??h.profMed)}" placeholder="${h.profProj!=null?'proj. '+v(h.profProj):'trena'}" style="${big}"></div></div>
  <div class="row"><div><label>Tampão (m)</label><input id="cfT" inputmode="decimal" value="${v((voz&&voz.tampao)??h.tampao??pr.tampao)}" style="${big}"></div><div><label>Densidade (g/cm³)</label><input id="cfD" inputmode="decimal" value="${v(dens)}" placeholder="ex.: 1,15" style="${big}"></div></div>
  <div id="cfAv" class="mut"></div>
  <details style="margin-top:8px"><summary class="mut">Mais (produto, água, observação)</summary>
  <div class="row"><div><label>Produto</label><select id="cfP">${opts(PRODUTOS,prod,'—')}</select></div><div><label>Água</label><select id="cfA">${Object.entries(AGUA_N).map(([k,t])=>`<option value="${k}" ${((voz&&voz.agua)||h.agua)===k?'selected':''}>${t}</option>`).join('')}</select></div></div>
  <label>Observação</label><input id="cfO" value="${esc(h.obs||'')}"></details>
  <div class="btns"><button class="btn ok" id="cfOk" style="font-size:18px;min-height:56px">✔ Enviar: carregado pelo ${esc(camCurto(meu))}</button></div>
  <div class="btns"><button class="btn" id="cfRe">Não deu para carregar (repasse)</button></div>`);
  const av=()=>{const a=[];const pm=num($('#cfPr').value),d=densNum($('#cfD').value),t=num($('#cfT').value);
    {const kk=num($('#cfK').value);const lim=limitesFuro(p,h,kk>0?kk+Math.max(0,holeKg(h)-kgDoCam(h,meu)):0,t,pm??h.profProj??null);if(lim.length){$('#cfAv').innerHTML=`<div style="background:#c92a2a;color:#fff;border-radius:10px;padding:10px;font-weight:800;font-size:16px">${limTit(lim)}<br>${lim.map(x=>esc(x.t)).join('<br>')}</div>`;}}
    if(pm!=null&&h.profProj!=null&&pm<h.profProj-pr.tolProf)a.push(`profundidade ${fmt(h.profProj-pm,1)} m abaixo do projeto`);
    if(densFora(d))a.push('densidade fora do comum (0,5 a 1,6)');else if(d!=null&&pr.dens!=null&&Math.abs(d-pr.dens)>0.05)a.push(`densidade diferente do plano (${fmt(pr.dens,2)})`);
    if(t!=null&&pr.tampao!=null&&Math.abs(t-pr.tampao)>0.5)a.push(`tampão diferente do plano (${fmt(pr.tampao,1)} m)`);
    if(a.length)$('#cfAv').insertAdjacentHTML('beforeend','<div>⚠️ Confira: '+a.join(' · ')+'</div>');else if(!$('#cfAv').firstElementChild)$('#cfAv').innerHTML='';};
  const av0=()=>{$('#cfAv').innerHTML='';av();};
  ['#cfK','#cfPr','#cfD','#cfT'].forEach(id=>$(id).oninput=av0);av0();
  $('#cfX').onclick=closeSheet;
  const salva=st=>{const antes=camFora(p,meu)?[meu]:[];pushUndo(p,[h],'furo '+h.id);const k=num($('#cfK').value);
    if(st==='carregado')lancarCarga(h,meu,$('#cfP').value,k);
    const pm=num($('#cfPr').value),d=densNum($('#cfD').value);if(pm!=null)h.profMed=pm;h.dens=d;
    if(d!=null){S.ui=Object.assign(S.ui||{},{meuDens:d});p.cams=p.cams||{};p.cams[meu]=p.cams[meu]||{};if(p.cams[meu].dens==null||p.cams[meu].dens===''){p.cams[meu].dens=d;markP(p.id);}}
    h.status=st;h.tampao=num($('#cfT').value);h.agua=$('#cfA').value;h.obs=$('#cfO').value.trim();carimbaLotes(p,h);histAdd(h,'Operador: '+resumoFuro(h));h.ts=Date.now();h.por=meuNome()||meu;if(meuOper())h.oper=meuOper();markF(p.id,h.id);save();closeSheet();renderCam();toast('Furo '+h.id+' salvo'+(SY().token?' e enviado':' neste celular'));checarAlertas(p,h,antes);};
  $('#cfOk').onclick=()=>salva('carregado');$('#cfRe').onclick=()=>salva('repasse');
}

/* ===== Fotos na nuvem (Supabase Storage pela função carregamento) ===== */
const fotosRem={};let fotoEnviando=false;
function filaFoto(pid,hid,ts){const y=SY();y.fq=y.fq||{};y.fq[pid+'|'+hid+'|'+ts]=1;save();}
async function enviarFotos(){
  const y=SY();if(!y.token||fotoEnviando||!y.fq)return;const ks=Object.keys(y.fq).slice(0,40);if(!ks.length)return;fotoEnviando=true;
  try{for(const k of ks){if(!SY().token)break;const [pid,hid,ts]=k.split('|');const arr=await fotoGet(pid+'|'+hid);const f=arr.find(x=>String(x.ts)===ts);if(!f){delete y.fq[k];continue;}
      const r=await api({acao:'foto_enviar',token:y.token,poly_id:pid,furo_id:hid,ts:+ts,img:f.url.split(',')[1]});if(r&&r.ok){delete y.fq[k];f.nuvem=true;await fotoPut(pid+'|'+hid,arr);}}
    save();}
  catch(e){if(/desconhecida/i.test(e.message||''))y.fotoOff=true;}finally{fotoEnviando=false;}
}
// todas as fotos deste celular que ainda não subiram (inclusive as tiradas antes de entrar na conta)
async function filaTodasFotos(){const d=await db();if(!d)return;const ks=await new Promise(res=>{try{const q=d.transaction('foto').objectStore('foto').getAllKeys();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([]);}catch(e){res([]);}});
  const y=SY();y.fq=y.fq||{};for(const k of ks){const arr=await fotoGet(k);arr.forEach(f=>{if(!f.nuvem)y.fq[k+'|'+f.ts]=1;});}save();}
// croqui de fundo / foto do drone: sobe a imagem e baixa a dos colegas
let croquiOcupado=false;
async function nuvemCroquis(){const y=SY();if(!y.token||croquiOcupado||y.croquiOff)return;croquiOcupado=true;y.bq=y.bq||{};y.bgv=y.bgv||{};
  try{for(const pid of Object.keys(y.bq)){const p=S.polys.find(x=>x.id===pid);const url=p&&p.bg?await bgGet(pid):null;if(!url){delete y.bq[pid];continue;}
      const v=y.bq[pid];const r=await api({acao:'croqui_enviar',token:y.token,poly_id:pid,v,img:url.split(',')[1]});
      if(r&&r.ok){if(y.bq[pid]===v)delete y.bq[pid];if(p.bg){p.bg.v=v;y.bgv[pid]=v;markP(pid);}}}
    for(const p of S.polys){if(!p.bg||!p.bg.v||y.bgv[p.id]===p.bg.v||y.bq[p.id])continue;
      const r=await api({acao:'croqui_url',token:y.token,poly_id:p.id});if(!r||!r.url)continue;
      const b=await (await fetch(r.url)).blob();const url=await new Promise((ok,er)=>{const f=new FileReader();f.onload=()=>ok(f.result);f.onerror=er;f.readAsDataURL(b);});
      if(await bgPut(p.id,url,true)){y.bgv[p.id]=p.bg.v;if(view==='poly'&&S.cur===p.id&&$('#sheet').classList.contains('hidden'))renderPoly();}}
    save();}
  catch(e){if(/desconhecida/i.test(e.message||''))y.croquiOff=true;console.error(e);}finally{croquiOcupado=false;}}
async function nuvemArquivos(){await nuvemCroquis();await enviarFotos();await modeloNuvem();}
async function listarFotos(pid,forca){
  const y=SY();if(!y.token||y.fotoOff)return[];const c=fotosRem[pid];if(c&&!forca&&Date.now()-c.t<5*60e3)return c.l;
  try{const r=await api({acao:'foto_listar',token:y.token,poly_id:pid});fotosRem[pid]={t:Date.now(),l:r.fotos||[]};return fotosRem[pid].l;}catch(e){return c?c.l:[];}
}

// continuam iguais) e só escreve nas células de digitação: cabeçalho de CARREG.1/2/3, linhas dos furos e o topo do CHECK LIST.
// As fórmulas do modelo (carga programada, massa, RC…) são do próprio modelo; o app não calcula nada.
let zipP=null;
function loadZip(){return zipP||(zipP=(async()=>{if(!window.JSZip)await loadScript(['lib/jszip.min.js','https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js']);return window.JSZip;})().catch(e=>{zipP=null;throw e;}));}
const MOD_KEY='modeloPlanilha';
const MOD_ABAS=['CARREG.1','CARREG.2','CARREG.3'];
const MOD_COL={id:'A',prof:'B',k1:'D',k2:'E',k3:'F',tampao:'G',tampProj:'H',deck1:'I',deck2:'J',obs:'K'};
const MOD_KGP='C'; // Carga programada (kg): vai o valor do projeto (furo/área/polígono); sem projeto fica a fórmula do modelo
const MOD_HDR={pol:'D2',banco:'D3',lito:'F3',expl:'H3',diam:'D4',alt:'F4',dens:'H4',mina:'B5',cava:'B6',afast:'D5',espac:'D6',operador:'J8',auxiliar:'J9'};
const MOD_CHK={data:'C3',umb:'E3',operador:'G3'};
const xlSerial=s=>{const [y,m,d]=String(s||today()).split('-').map(Number);return (Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/864e5;};
const xlDeSerial=n=>{const d=new Date(Date.UTC(1899,11,30)+Math.round(n)*864e5);return d.toISOString().slice(0,10);};
async function modeloObter(){
  const v=await bgGet(MOD_KEY);if(v&&v.buf)return v;
  try{const r=await fetch('lib/modelo-carregamento.xlsx',{cache:'no-cache'});if(r.ok){const buf=await r.arrayBuffer();return {nome:'modelo do site',buf,t:0,site:true};}}catch(e){}
  return null;
}
async function modeloEscolher(){
  const f=await pickFile('.xlsx');if(!f)return null;
  try{busy('Conferindo o modelo…');const buf=await readBuf(f);const X=await loadXlsx();const wb=X.read(buf,{type:'array',bookSheets:true});busy();
    if(!MOD_ABAS.some(n=>wb.SheetNames.includes(n))){toast('Este arquivo não tem as abas CARREG.1/2/3 do modelo');return null;}

    if(SY().token){toast('Modelo guardado. Enviando para a equipe…');modeloNuvem(true).then(r=>{if(r==='enviado')toast('Modelo enviado: todos os logins da equipe já podem gerar a planilha');else if(r==='grande')toast('Modelo grande demais para a base (máx. 5 MB). Ficou só neste aparelho.');else if(r==='erro')toast('Sem conexão: o modelo sobe para a equipe quando tiver internet');});}
    else toast('Modelo guardado neste aparelho. Entre na conta da equipe para todos usarem.');

// ===== Modelo da planilha para a equipe toda =====
// Quem escolhe o modelo manda o arquivo para a base (pasta privada carreg-fotos, só abre com login da equipe);
// qualquer login baixa e guarda no aparelho, e daí funciona sem internet. Vale o modelo escolhido por último.
// Usa as ações croqui_enviar/croqui_url da função "carregamento" com um "polígono" reservado, sem mudar o servidor.
const MOD_NUV='_modelo-planilha',MOD_NUV_INFO='_modelo-planilha-info',MOD_MAX=5*1024*1024;
let modNuvT=0,modNuvP=null;
const b64De=buf=>{const u=new Uint8Array(buf);let t='';for(let i=0;i<u.length;i+=0x8000)t+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(t);};
async function modNuvBaixa(pid){const y=SY();const r=await api({acao:'croqui_url',token:y.token,poly_id:pid});if(!r||!r.url)return null;
  const x=await fetch(r.url,{cache:'no-store'});return x.ok?await x.arrayBuffer():null;}
// devolve: 'enviado' | 'baixado' | 'igual' | 'sem' | 'grande' | 'erro' | undefined (sem login / cedo demais)
function modeloNuvem(forca){
  const y=SY();if(!y.token)return Promise.resolve();
  if(modNuvP)return modNuvP;if(!forca&&Date.now()-modNuvT<10*60e3)return Promise.resolve();modNuvT=Date.now();
  return modNuvP=(async()=>{try{
    const loc=await bgGet(MOD_KEY);let info=null;
    try{const b=await modNuvBaixa(MOD_NUV_INFO);if(b)info=JSON.parse(new TextDecoder().decode(b));}catch(e){if(e instanceof TypeError||e.sair)throw e;info=null;}
    const tl=loc&&loc.buf&&!loc.site?(+loc.t||0):-1,tn=info?(+info.t||0):-1;
    if(tl>tn){ // este aparelho tem o modelo mais novo: manda para a equipe (arquivo primeiro, depois a ficha)
      if(loc.buf.byteLength>MOD_MAX)return 'grande';
      await api({acao:'croqui_enviar',token:y.token,poly_id:MOD_NUV,v:loc.t,img:b64De(loc.buf)});
      const fi={nome:loc.nome,t:loc.t,por:loc.por||meuNome(),tam:loc.buf.byteLength};
      await api({acao:'croqui_enviar',token:y.token,poly_id:MOD_NUV_INFO,v:loc.t,img:b64De(new TextEncoder().encode(JSON.stringify(fi)).buffer)});
      return 'enviado';}
    if(tn>tl){ // um colega escolheu um modelo mais novo (ou este aparelho não tem): baixa e guarda aqui
      const buf=await modNuvBaixa(MOD_NUV);if(!buf)return 'sem';
      const X=await loadXlsx();const wb=X.read(buf,{type:'array',bookSheets:true});if(!MOD_ABAS.some(n=>wb.SheetNames.includes(n)))return 'erro';
      await bgPut(MOD_KEY,{nome:info.nome||'modelo da equipe',buf,t:tn,por:info.por||'',equipe:true},true);return 'baixado';}
    return tn<0?'sem':'igual';
  }catch(e){console.error(e);if(e.sair){y.token=null;save();}return 'erro';}finally{modNuvP=null;}})();
}
// listas da aba PARÂMETRO (litologia, explosivo, diâmetro, operadores…), pelo título da coluna
async function modeloListas(m){
  if(m._listas)return m._listas;const X=await loadXlsx();const wb=X.read(m.buf,{type:'array',sheets:['PARÂMETRO','CHECK LIST']});
  const L={lito:[],expl:[],diam:[],oper:[],aux:[],umb:[],mina:[],cava:[]};const sh=wb.Sheets['PARÂMETRO'];
  if(sh){const rows=X.utils.sheet_to_json(sh,{header:1,raw:true,defval:null});const hi=rows.findIndex(r=>r&&r.some(v=>/TIPO DE ROCHA|DIÂMETRO/i.test(String(v||''))));
    if(hi>=0){const H=rows[hi].map(v=>String(v||'').trim().toUpperCase());const col=re=>H.findIndex(h=>re.test(h));
      const pega=(k,re)=>{const c=col(re);if(c<0)return;rows.slice(hi+1).forEach(r=>{const v=r&&r[c];if(v!=null&&String(v).trim()!==''&&!L[k].some(x=>String(x)===String(v)))L[k].push(v);});};
      pega('lito',/^TIPO DE ROCHA/);pega('expl',/^EXPLOSIVO 2$/);if(!L.expl.length)pega('expl',/^EXPLOSIVO$/);pega('diam',/^DIÂMETRO/);pega('oper',/^OPERADORES/);pega('aux',/^AUXILIARES/);pega('umb',/^TAG$/);pega('mina',/^MINA$/);pega('cava',/^CAVA$/);}}
  const ck=wb.Sheets['CHECK LIST'];L.dataModelo=ck&&ck.C3&&typeof ck.C3.v==='number'?xlDeSerial(ck.C3.v):null;
  return m._listas=L;
}
// furos que vão para a planilha: do caminhão escolhido (na ordem em que foram lançados) ou todos
function modFuros(p,cam){
  if(!cam)return p.holes.slice();
  return p.holes.filter(h=>camsDoFuro(h).includes(cam)&&(h.decks||[]).some(d=>deckCam(h,d)===cam&&deckTemCarga(d))).sort((a,b)=>(a.ts||0)-(b.ts||0));
}
// Carga 1/2/3 = número do deck no furo. Na aba de um caminhão, o deck de outro caminhão fica em branco
// (ex.: 1138 no 1º deck e 1145 no 2º: na aba do 1145 o kg vai em Carga 2, não em Carga 1).
const modKgs=(h,cam)=>[0,1,2].map(i=>{const d=(h.decks||[])[i];return deckTemCarga(d)&&(!cam||deckCam(h,d)===cam)?num(d.kg):null;});
const modProd=(p,cam)=>{const c={};p.holes.forEach(h=>(h.decks||[]).forEach(d=>{if(d.prod&&(!cam||deckCam(h,d)===cam))c[d.prod]=(c[d.prod]||0)+1;}));return Object.keys(c).sort((a,b)=>c[b]-c[a])[0]||projDe(p).prod||'';};
const modCasa=(lista,v)=>{if(v==null||v==='')return '';const t=String(v).toLowerCase();return lista.find(x=>String(x).toLowerCase()===t)??lista.find(x=>String(x).toLowerCase().startsWith(t)||t.startsWith(String(x).toLowerCase()))??v;};

      const rows=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false});const h=(rows.slice(0,40).find(r=>r&&r.length>1)||[]).map(v=>String(v||'').toLowerCase());

        <p><b>${esc(file.name)}</b> é a lista de <b>coordenadas dos furos</b> (furo, norte, leste), não a planilha de carregamento.</p>

      throw e;}
    const mostra=lido=>{
    const {info,linhas,naoAchou}=lido;const mud=linhas.map(l=>planMud(l.h,l.nv)).filter(Boolean);const nDs=densAplicar(p,lido.dens,true);

    openSheet(`<h3>Importar planilha<button class="btn sm" id="ipClose">Cancelar</button></h3>
      ${outroPol&&!info.forcar?(info.pols&&info.pols.length>1?`<div class="hint">⚠️ Esta planilha tem o <b>${info.pols.map(v=>'POL '+esc(v)).join('</b> e o <b>')}</b>, e você está no POL ${esc(p.pol)}. Se for o mesmo polígono com outro número, escolha abaixo qual aba entra aqui.</div>`:`<div class="hint">⚠️ Esta planilha foi gerada para o <b>POL ${esc(info.pol)}${info.mina?' ('+esc(info.mina)+')':''}</b>, e você está no POL ${esc(p.pol)}. Confira antes de aplicar.</div>`):''}
      ${selHtml}
      <p><b>${mud.length}</b> furo(s) com alteração${naoAchou.length?` · ${naoAchou.length} furo(s) da planilha não existem neste polígono (${esc(naoAchou.slice(0,6).join(', '))}${naoAchou.length>6?'…':''})`:''}.</p>
      ${mud.length?planTabela(mud):nDs?'':'<p class="mut">Nada diferente do que já está no app.</p>'}
      ${nDs?`<p>🧪 <b>${nDs}</b> amostra(s) de densidade da aba Densidade.</p>`:''}
      <div class="btns"><button class="btn pri" id="ipOk" ${mud.length||nDs?'':'disabled style="opacity:.5"'}>Aplicar no app</button></div>`);
    $('#ipClose').onclick=closeSheet;
    if($('#ipAba'))$('#ipAba').onchange=e=>{try{mostra(planLer(p,X,wb,e.target.value.split('|')));}catch(er){toast(er.message);}};
    if(mud.length||nDs)$('#ipOk').onclick=()=>{if(mud.length)planAplicar(p,mud);densAplicar(p,lido.dens);closeSheet();corPor='caminhao';if(mud.length)tab='mapa';renderPoly();toast(`${mud.length} furo(s)${nDs?' e '+nDs+' amostra(s) de densidade':''} atualizados pela planilha`);};
    };mostra(lido);
  }catch(e){busy();toast(e.message||'Não consegui ler a planilha');}
}

/* ----- Acompanhar a planilha (automático): o app relê o .xlsx sempre que ele é salvo ----- */
// Chrome/Edge no computador (File System Access API). Só aplica o que MUDOU na planilha desde a última leitura,
// para não desfazer o que foi lançado direto no app.
const planW={};const PLW_MS=2000; // planW[pid] = {chave: acompanhamento} — várias planilhas ao mesmo tempo (ex.: uma por caminhão)
const planWKey=pid=>'planw|'+pid;
const planWFhKey=(pid,k)=>planWKey(pid)+'|fh|'+k;
const planWPode=()=>!!window.showOpenFilePicker;
const planWLista=pid=>Object.values(planW[pid]||{});
// guardado: lista [{k,nome,last,snap}] (versão antiga guardava 1 objeto só)
// lista guardada no aparelho, com cópia em memória para as gravações não se atropelarem
const planWMem={};
async function planWSalvos(pid){if(!planWMem[pid]){const v=await bgGet(planWKey(pid));if(!planWMem[pid])planWMem[pid]=!v?[]:Array.isArray(v)?v.filter(x=>x&&x.nome):v.nome?[{k:v.nome,nome:v.nome,last:v.last,snap:v.snap,velho:1}]:[];}return planWMem[pid];}
async function planWGrava(pid){const l=planWMem[pid]||[];await bgPut(planWKey(pid),l.length?l.map(({velho,...x})=>x):null,true);}
async function planWGuardar(pid){const l=await planWSalvos(pid);planWLista(pid).forEach(w=>{const o={k:w.k,nome:w.nome,last:w.last,snap:w.snap};const i=l.findIndex(x=>x.k===w.k);if(i>=0)l[i]=o;else l.push(o);});await planWGrava(pid);}
async function planWEsquecer(pid,k){const l=await planWSalvos(pid);const i=l.findIndex(x=>x.k===k);const velho=i>=0&&l[i].velho;if(i>=0)l.splice(i,1);await planWGrava(pid);await bgPut(planWFhKey(pid,k),null,true);if(velho)await bgPut(planWKey(pid)+'|fh',null,true);}
function planSnap(linhas){const s={};linhas.forEach(({h,nv})=>{const o={};Object.keys(nv).forEach(k=>o[k]=planCmp(k,nv[k]));s[String(h.id).toUpperCase()]=o;});return s;}
async function planWLer(w,p){const f=await w.fh.getFile();const X=await loadXlsx();const wb=X.read(await f.arrayBuffer(),{type:'array',cellDates:true});return {f,...planLer(p,X,wb)};}
function planWSemPC(){openSheet(`<h3>Acompanhar planilha<button class="btn sm" id="awX">Fechar</button></h3>
  <p>Este navegador não deixa o app ficar de olho num arquivo do aparelho (isso só funciona no <b>Chrome</b> ou <b>Edge</b> do <b>computador</b>).</p>
  <p class="mut">No celular, use <b>Importar planilha preenchida</b> cada vez que quiser trazer o que foi digitado na planilha.</p>`);$('#awX').onclick=closeSheet;}
async function planAcompanhar(p){
  if(!planWPode()){planWSemPC();return;}
  let fh;try{[fh]=await window.showOpenFilePicker({types:[{description:'Planilha Excel',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}]});}catch(e){return;}
  if(!fh)return;
  try{busy('Lendo planilha…');const w={fh,nome:fh.name,last:0,snap:{}};const r=await planWLer(w,p);busy();
    const ja=planWLista(p.id).find(x=>x.nome===fh.name);if(ja){toast('Essa planilha já está sendo acompanhada');return;}
    if(r.info.poly_id&&r.info.poly_id!==p.id){openSheet(`<h3>Acompanhar planilha<button class="btn sm" id="awX">Fechar</button></h3><div class="hint">⚠️ Esta planilha é do <b>POL ${esc(r.info.pol)} (${esc(r.info.mina)})</b>, e você está no POL ${esc(p.pol)}. Abra o polígono certo ou gere a planilha deste polígono.</div>`);$('#awX').onclick=closeSheet;return;}
    const mud=r.linhas.map(l=>planMud(l.h,l.nv)).filter(Boolean);
    openSheet(`<h3>Acompanhar planilha<button class="btn sm" id="awX">Cancelar</button></h3>
      <p>O app vai ficar de olho em <b>${esc(fh.name)}</b>: toda vez que você <b>salvar</b> a planilha no Excel (Ctrl+S), os furos alterados entram aqui sozinhos em poucos segundos.</p>
      ${mud.length?`<p>Agora a planilha tem <b>${mud.length}</b> furo(s) diferentes do app:</p>${planTabela(mud)}`:'<p class="mut">Agora a planilha está igual ao app.</p>'}
      ${r.naoAchou.length?`<p class="mut">${r.naoAchou.length} furo(s) da planilha não existem neste polígono (${esc(r.naoAchou.slice(0,6).join(', '))}${r.naoAchou.length>6?'…':''}).</p>`:''}
      ${planWLista(p.id).length?`<p>📗 Já ${planWLista(p.id).length>1?'são':'é'} acompanhada${planWLista(p.id).length>1?'s':''} <b>${planWLista(p.id).map(x=>esc(x.nome)).join('</b>, <b>')}</b>. Esta entra <b>junto</b> (uma por caminhão, por exemplo); as outras continuam.</p>`:''}
      <p class="mut">Depois de ligado, só o que <b>mudar na planilha</b> entra no app; o que você lançar direto no app não é apagado. Deixe esta aba aberta.</p>
      <div class="btns">${mud.length?`<button class="btn pri" id="awA">Aplicar ${mud.length} e acompanhar</button><button class="btn" id="awS">Acompanhar sem aplicar agora</button>`:`<button class="btn pri" id="awS">Começar a acompanhar</button>`}</div>`);
    $('#awX').onclick=closeSheet;
    const liga=apl=>{if(apl&&mud.length)planAplicar(p,mud,'planilha acompanhada');w.last=r.f.lastModified;w.snap=planSnap(r.linhas);w.lido=Date.now();planWStart(p.id,w);closeSheet();if(apl&&mud.length){corPor='caminhao';}renderPoly();toast(apl&&mud.length?`${mud.length} furo(s) atualizados · acompanhando a planilha`:'Acompanhando a planilha');};
    if($('#awA'))$('#awA').onclick=()=>liga(true);$('#awS').onclick=()=>liga(false);
  }catch(e){busy();toast(e.message||'Não consegui ler a planilha');}
}
function planWStart(pid,w){w.k=w.k||w.nome;planWStop(pid,w.k,true);(planW[pid]=planW[pid]||{})[w.k]=w;w.timer=setInterval(()=>planWTick(pid,w.k),PLW_MS);planWGuardar(pid);bgPut(planWFhKey(pid,w.k),w.fh,true);}
function planWStop(pid,k,silencio){const w=planW[pid]&&planW[pid][k];if(!w)return;clearInterval(w.timer);delete planW[pid][k];if(!silencio)planWEsquecer(pid,k);}
async function planWTick(pid,k,forcar){const w=planW[pid]&&planW[pid][k];if(!w||w.lendo)return;if(document.hidden&&!forcar)return;
  const p=S.polys.find(x=>x.id===pid);if(!p){planWStop(pid,k);return;}
  w.lendo=true;try{
    let f;try{f=await w.fh.getFile();}catch(e){if(e&&e.name==='NotAllowedError'){w.erro='sem permissão';planWStop(pid,k,true);planWBarra();return;}w.erro='arquivo não encontrado';planWBarra();return;}
    if(f.lastModified===w.last&&!forcar){if(w.erro){w.erro=null;planWBarra();}return;}
    let r;try{const X=await loadXlsx();const wb=X.read(await f.arrayBuffer(),{type:'array',cellDates:true});r={f,...planLer(p,X,wb)};}catch(e){w.erro='não consegui ler (o Excel ainda está salvando?)';planWBarra();return;} // tenta de novo no próximo ciclo
    w.erro=null;const mud=[];
    // só entra o que mudou NESTA planilha desde a última leitura dela: duas planilhas não apagam o que a outra lançou
    r.linhas.forEach(({h,nv})=>{const ant=w.snap[String(h.id).toUpperCase()]||{};const ks=Object.keys(nv).filter(k2=>ant[k2]!==planCmp(k2,nv[k2]));if(!ks.length)return;const m=planMud(h,nv,ks);if(m)mud.push(m);});
    w.last=f.lastModified;w.snap=planSnap(r.linhas);w.lido=Date.now();
    const nDs=densAplicar(p,r.dens);if(nDs)toast(`📗 ${w.nome}: ${nDs} amostra(s) de densidade`,3000);
    if(mud.length){planAplicar(p,mud,'planilha acompanhada '+w.nome);w.ult={n:mud.length,ids:mud.map(m=>m.h.id),t:Date.now()};
      planFlash={ids:new Set(mud.map(m=>String(m.h.id))),ate:Date.now()+9000};if(corPor!=='caminhao')setCorPor('caminhao');
      const ids=mud.slice(0,5).map(m=>m.h.id).join(', ')+(mud.length>5?'…':'');toast(`📗 ${w.nome}: ${mud.length} furo(s) atualizados (${ids})`,3500);
      if(S.cur===pid&&view==='poly'&&$('#sheet').classList.contains('hidden')&&!((tab==='oper'||tab==='med')&&operSujo))renderPoly();else if(view==='home'&&$('#sheet').classList.contains('hidden'))renderHome();else planWBarra();}
    else planWBarra();
    planWGuardar(pid);
  }finally{w.lendo=false;}
}
const hhmm=t=>new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
async function planWRetomar(p,sv){let fh=null;
  try{fh=await bgGet(sv.velho?planWKey(p.id)+'|fh':planWFhKey(p.id,sv.k));if(fh){let ok=await fh.queryPermission({mode:'read'});if(ok!=='granted')ok=await fh.requestPermission({mode:'read'});if(ok!=='granted')fh=null;}}catch(e){fh=null;}
  if(!fh){toast('Escolha de novo a planilha '+sv.nome);try{[fh]=await window.showOpenFilePicker({types:[{description:'Planilha Excel',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}]});}catch(e){return;}if(!fh)return;}
  if(sv.velho)await bgPut(planWKey(p.id)+'|fh',null,true);
  const w={fh,k:sv.k,nome:fh.name||sv.nome,last:sv.last||0,snap:sv.snap||{},lido:Date.now()};if(w.nome!==sv.k){w.k=w.nome;await planWEsquecer(p.id,sv.k);}planWStart(p.id,w);planWBarra();planWTick(p.id,w.k,true);}
// faixa no topo do polígono: uma linha por planilha acompanhada
async function planWBarra(){const box=$('#planWBox');const p=cur();if(!box||!p)return;
  const at=planWLista(p.id);const sv=planWPode()?(await planWSalvos(p.id)).filter(x=>!at.some(w=>w.k===x.k)):[];if(cur()!==p||!$('#planWBox'))return;
  if(!at.length&&!sv.length){box.innerHTML='';return;}
  const st='display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0';
  box.innerHTML=at.map((w,i)=>`<div class="hint" style="${st};background:rgba(31,157,85,.16);border-color:#1f9d55">📗 <span style="flex:1;min-width:180px">Acompanhando <b>${esc(w.nome)}</b>${w.erro?` · <b style="color:#b3261e">${esc(w.erro)}</b>`:` · lida às ${hhmm(w.lido||Date.now())}`}${w.ult?` · última: ${w.ult.n} furo(s) às ${hhmm(w.ult.t)}`:''}</span><button class="btn sm" data-pwl="${i}">Ler agora</button><button class="btn sm" data-pwp="${i}">Parar</button></div>`).join('')
    +sv.map((x,i)=>`<div class="hint" style="${st}">📗 <span style="flex:1;min-width:180px">A planilha <b>${esc(x.nome)}</b> estava sendo acompanhada.</span><button class="btn sm pri" data-pwr="${i}">Retomar</button><button class="btn sm" data-pwe="${i}">Esquecer</button></div>`).join('')
    +(at.length&&planWPode()?`<div style="margin:-2px 0 6px"><button class="btn sm" id="pwMais">＋ Acompanhar outra planilha (outro caminhão)</button></div>`:'');
  box.querySelectorAll('[data-pwl]').forEach(b=>b.onclick=()=>planWTick(p.id,at[+b.dataset.pwl].k,true));
  box.querySelectorAll('[data-pwp]').forEach(b=>b.onclick=()=>{const w=at[+b.dataset.pwp];planWStop(p.id,w.k);planWBarra();toast('Parou de acompanhar '+w.nome);});
  box.querySelectorAll('[data-pwr]').forEach(b=>b.onclick=()=>planWRetomar(p,sv[+b.dataset.pwr]));
  box.querySelectorAll('[data-pwe]').forEach(b=>b.onclick=async()=>{await planWEsquecer(p.id,sv[+b.dataset.pwe].k);planWBarra();});
  if($('#pwMais'))$('#pwMais').onclick=()=>planAcompanhar(p);}

  <div class="card"><h2>Outros pontos</h2><table><tbody><tr><td>Profundidade abaixo do projeto (> ${fmt(pr.tolProf,1)} m)</td><td class="n">${r.profBaixa}</td></tr>${pr.tampao!=null?`<tr><td>Tampão diferente do projeto (> 0,5 m)</td><td class="n">${r.tampDif}</td></tr>`:''}${pr.booster!=null?`<tr><td>Booster diferente do projeto</td><td class="n">${r.boosterDif}</td></tr>`:''}${(()=>{const l=amostras(p);if(!l.length)return'';const m=mediaDens(l);const fora=pr.dens!=null?l.filter(a=>leituras(a).some(v=>Math.abs(v-pr.dens)>0.05)).length:null;return `<tr><td>Amostras de densidade (${l.length}) · média</td><td class="n">${fmt(m,2)} g/cm³</td></tr>${fora!=null?`<tr><td>Amostras diferentes do plano (> 0,05 g/cm³)</td><td class="n">${fora}</td></tr>`:''}`;})()}<tr><td>Perdidos / não carregar</td><td class="n">${r.n.fora}</td></tr></tbody></table></div>`;

/* ----- Resumo ----- */
function resumo(p,dia){
  const hs=dia?p.holes.filter(h=>dayOf(h.ts)===dia):p.holes;

  {const pb=p.holes.filter(h=>profBaixa(p,h));if(pb.length){const m=Object.values(p.areas||{}).some(a=>a&&num(a.cota)>0)?null:profMinFuro(p);L.push(`• ⛔ Metragem baixa${m?' (menos que '+fmt(m.v,1)+' m)':''}: ${pb.length} furo(s) (${pb.slice(0,15).map(h=>h.id+' '+fmt(h.profMed??h.profProj,1)+' m').join(', ')}${pb.length>15?'…':''})`);}}
  {const c=contasDesmonte(p);if(c.area!=null&&(c.proj.vol!=null||c.exec.vol!=null)){const pe=(a,b,u,d)=>`projeto ${a!=null?fmt(a,d)+' '+u:'–'} | executado ${b!=null?fmt(b,d)+' '+u:'–'}`;L.push('');L.push('🧮 *Contas do desmonte*');
    L.push(`• Volume: ${pe(c.proj.vol,c.exec.vol,'m³',0)}`);if(pj.densRocha!=null)L.push(`• Massa: ${pe(c.proj.t,c.exec.t,'t',0)}`);
    L.push(`• Razão de carga: ${pe(c.proj.rc,c.exec.rc,'kg/m³',3)}`);L.push(`• Metros perfurados: ${pe(c.proj.m,c.exec.m,'m',1)}`);
    if(c.lin!=null||c.exec.lin!=null)L.push(`• Razão linear: ${pe(c.lin!=null?c.lin:c.proj.lin,c.exec.lin,'kg/m',1)}`);}}
  const tz=analiseTempo(p);
  if(tz.com.length){L.push('');L.push('⏱️ *Temporização*');L.push(`• Furos com tempo: ${tz.com.length}/${tz.ativos}${tz.sem.length?' | sem tempo: '+tz.sem.length:''}`);
    L.push(`• Tempos: ${fmt(tz.t0)} a ${fmt(tz.t1)} ms`);if(tz.rep.length)L.push(`• Tempos repetidos: ${tz.rep.map(([t,v])=>`${fmt(t)} ms (${v.map(x=>x.id).join(', ')})`).join('; ')}`);
    L.push(`• Detonadores com tempo: ${tz.dets}${p.dvtProg!=null?' | DVT programado: '+p.dvtProg+(p.dvtProg===tz.dets?' ✔':' ⚠️'):''}`);}
  const cams=Object.keys(r.cam);
  if(cams.length){L.push('');L.push('🚛 *Caminhões*');cams.forEach(c=>{const cd=camDif(p,c,Object.values(r.cam[c]).reduce((a,b)=>a+b,0));const eo=camOpDe(c)?camEstado(c,(agoraDados().find(x=>x.cam===c)||{}).last):null;L.push(`• ${c} – ${Object.entries(r.cam[c]).map(([pr,kg])=>`${pr} ${fmt(kg)} kg`).join(' / ')}${eo&&eo.man?' – '+OPST[eo.k].i+' '+OPST[eo.k].n+' '+hm(eo.desde):''}${(p.nfs||{})[c]?' – NF '+p.nfs[c]:''}${cd?` – NF x lançado ${cd.txt}${cd.ok?' ✔':' ⚠️'}`:''}`);});}
  const ac=acessRows(p,r).filter(a=>a.ret!=null);
  if(ac.length){L.push('');L.push('🧰 *Acessórios (saldo)*');ac.forEach(a=>L.push(`• ${a.n}: retirado ${fmt(a.ret)} | aplicado ${fmt(a.apl)} | devolvido ${fmt(a.dev||0)} | saldo ${fmt(a.saldo)}${a.saldo===0?' ✔':' ⚠️'}`));}
  const oc={};p.holes.forEach(h=>(h.cond||[]).forEach(c=>(oc[c]=oc[c]||[]).push(h.id)));
  if(Object.keys(oc).length){L.push('');L.push('⚠️ *Ocorrências nos furos*');Object.entries(oc).forEach(([c,v])=>L.push(`• ${c}: ${v.length} (${v.slice(0,12).join(', ')}${v.length>12?'…':''})`));}
  const ck=p.check||{};if(ck.pre&&ck.pre.ts||ck.fim&&ck.fim.ts){L.push('');L.push('✅ *Liberação*');if(ck.pre&&ck.pre.ts)L.push(`• Antes do carregamento: ${ck.pre.nome} (${new Date(ck.pre.ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})})`);if(ck.fim&&ck.fim.ts)L.push(`• Fechamento: ${ck.fim.nome} (${new Date(ck.fim.ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})})`);}
  const po=p.pos;if(po&&po.ts){L.push('');L.push('🧨 *Pós-fogo*');L.push(`• Falhas: ${po.falhas&&po.falhas.length?po.falhas.length+' ('+po.falhas.join(', ')+')':'nenhuma'}`);if(po.frag)L.push(`• Fragmentação: ${FRAG[po.frag]}${po.matacoes!=null?' | matacões: '+po.matacoes:''}`);L.push(`• Ultralançamento: ${po.ultra==='sim'?'houve'+(po.ultraDist!=null?' ('+fmt(po.ultraDist)+' m)':''):'não houve'}`);if(po.fumaca)L.push(`• Fumaça: ${FUMACA[po.fumaca]}`);if(po.vib!=null||po.ruido!=null)L.push(`• Vibração ${po.vib!=null?fmt(po.vib,1)+' mm/s':'–'} | pressão acústica ${po.ruido!=null?fmt(po.ruido,0)+' dB':'–'}`);if(po.obs)L.push('• '+po.obs);}
  const obs=p.holes.filter(h=>h.obs).map(h=>`• ${h.id}: ${h.obs}`);
  if(obs.length){L.push('');L.push('📝 *Observações*');L.push(...obs.slice(0,30));}
  return L.join('\n');
}
function tabRelatorio(p){
  const t=relatorio(p,relModo);
  $('#tabBox').innerHTML=`<div class="seg" id="rm" style="margin-bottom:10px">${[['acum','Acumulado'],['hoje','Só hoje'],['ambos','Os dois']].map(m=>`<button data-m="${m[0]}" class="${relModo===m[0]?'on':''}">${m[1]}</button>`).join('')}</div>
  <textarea id="rel" style="min-height:320px">${esc(t)}</textarea><div class="btns"><button class="btn pri" id="rCopy">Copiar relatório</button><button class="btn" id="rPrint">Relatório completo (imprimir / PDF)</button></div><p class="mut">Cole no WhatsApp. Você pode editar o texto antes de copiar.</p>`;
  document.querySelectorAll('#rm button').forEach(b=>b.onclick=()=>{relModo=b.dataset.m;tabRelatorio(p);});
  $('#rCopy').onclick=()=>copyText($('#rel').value);$('#rPrint').onclick=()=>imprimir(p);
}

/* ----- CSV ----- */
function csv(p){
  const n=v=>v==null?'':String(v).replace('.',',');
  const head=['POL','Mina','Furo','Status','ProfProjeto','ProfMedida','Agua','ColunaAgua','Deck1Produto','Deck1Kg','Deck1Caminhao','Deck2Produto','Deck2Kg','Deck2Caminhao','Deck3Produto','Deck3Kg','Deck3Caminhao','TempoMs','TotalKg','CargaProjetoKg','DesvioCarga','Booster','Brinel','Detonador','QtdDetonador','Tampao','Densidade','Caminhao','NF','Obs','Condicao','LoteProduto','LoteBooster','LoteDetonador','LancadoPor','DataHora','Area','TampaoProjeto','PassouLimite'];
  const rows=p.holes.map(h=>{const d=[0,1,2].map(k=>h.decks[k]||{});return[p.pol,p.mina,h.id,ST[h.status].n,n(h.profProj),n(h.profMed),h.agua,n(h.aguaM),d[0].prod||'',n(d[0].kg),deckTemCarga(d[0])?deckCam(h,d[0]):'',d[1].prod||'',n(d[1].kg),deckTemCarga(d[1])?deckCam(h,d[1]):'',d[2].prod||'',n(d[2].kg),deckTemCarga(d[2])?deckCam(h,d[2]):'',(h.tempos&&h.tempos.length>1?h.tempos.join('/'):(h.tempo??'')),n(holeKg(h)||null),n(kgProj(p,h)),desvio(p,h).t,n(h.booster),n(h.brinel),h.detTipo,n(h.detQtd),n(h.tampao),n(h.dens),camsDoFuro(h).join(' + '),camsDoFuro(h).map(c=>(p.nfs||{})[c]).filter(Boolean).join(' + '),(h.obs||'').replace(/;/g,','),(h.cond||[]).join(', '),(h.lotes?.prod||''),(h.lotes?.booster||''),(h.lotes?.det||''),h.por||'',h.ts?new Date(h.ts).toLocaleString('pt-BR'):'',areaNome(p,h),n(projDe(p,h).tampao),limitesFuro(p,h).map(x=>x.t).join(' / ').replace(/;/g,',')].join(';');});
  return [head.join(';'),...rows].join('\n');
}
